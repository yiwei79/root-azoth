# Minimal CI for the extracted public `azoth` product tree (P4-004).
# Emitted into `.github/workflows/ci.yml` by `scripts/azoth_extract_product.py`.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: python3 -m ruff check scripts/ tests/

      - name: Validate extracted public product boundary
        run: python3 scripts/validate_public_product.py

      - name: Focused public contract tests
        run: xargs python3 -m pytest -q < public-test-paths.txt
