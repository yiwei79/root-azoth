# Azoth Toolkit Manifest
# This file tracks the toolkit's state and installed components.

name: azoth
version: 0.1.0-dev
description: The Universal Agentic Toolkit

# Current development phase
phase: 3  # Agent Archetypes (Phase 1, 1.5, 2 complete)

# Architecture decisions count
decisions: 28

# Layer status
layers:
  molecule:  # Layer 0: Kernel
    status: complete
    files: 14  # 4 kernel + 4 templates + 6 adapters
  mineral:   # Layer 1: Skills
    status: complete
    skills: 8  # 5 extracted + 3 new
  wave:      # Layer 2: Agents
    status: planned
    agents: 0  # Target: 10
  current:   # Layer 3: Pipelines
    status: planned
    pipelines: 0  # Target: 3

# Memory system
memory:
  episodes: 0
  patterns: 0
  last_sync: null

# Platform compatibility
platforms:
  claude_code: primary
  opencode: compatible  # Reads CLAUDE.md natively
  copilot: adapter      # Via .github/ files

# Sync source (set when configured)
sync:
  source: null
  last_sync: null
  sanitize_config: sync-config.yaml

# Pipeline presets
pipeline_presets:
  - full
  - deliver
  - hotfix
  - docs
  - research
  - review
  - refactor
  - auto  # default
