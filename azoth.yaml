# Azoth Toolkit Manifest
# This file tracks the toolkit's state and installed components.

name: root-azoth
version: 0.1.4.34
description: The Universal Agentic Toolkit

# Root scaffold identity (D34-D38)
scope:
  mode: scaffold
  product_target: azoth
  is_development_workshop: true

# Milestone-local phase for the active working slice (v0.2.x); welcome strip uses lifecycle_phase
phase: 4
milestone: v0.2.0
lifecycle_phase: 8  # historical 1–7 + Next marker for shipped pre-1.0 roadmap + v0.1.0 gate

# Architecture decisions count
decisions: 57  # D55 trust-bearing hosts, D56 hermes substrate, D57 runtime guards added 2026-06-11

# Layer status
layers:
  molecule:  # Layer 0: Kernel
    status: complete
    files: 14  # 4 kernel + 4 templates + 6 adapters
  mineral:   # Layer 1: Skills
    status: complete
    skills: 17  # 5 extracted + 12 new
  wave:      # Layer 2: Agents
    status: active
    agents: 10  # 4 core + 2 research + 3 meta + 1 utility
  current:   # Layer 3: Pipelines
    status: active
    pipelines: 8  # 8 presets (P3-003 complete)

# Memory system
memory:
  episodes: 588
  patterns: 29
  last_sync: null

# Trust-bearing hosts (D55) — committed 2026-06-11 in phase/v0.2.0-p5
trust_bearing_hosts:
  - hermes
  - codex
  - opencode

# Hermes substrate (D56) — kernel installed once per profile, not per project
hermes_substrate:
  enabled: true
  profile: azoth-personal-cockpit
  skill_anchor: ~/.hermes/profiles/azoth-personal-cockpit/skills/azoth-substrate/SKILL.md
  docs: docs/HERMES_SUBSTRATE.md
  shim_layer: ~/.hermes/profiles/azoth-personal-cockpit/bin/

# Friction-event runtime guards (D57) — mechanical subprocess enforcement
runtime_guards:
  enabled: true
  count: 4
  modules:
    - scripts/check_fd_003_subagent_isolation.py
    - scripts/check_fd_004_hydration_scope.py
    - scripts/check_fd_005_completion_semantics.py
    - scripts/check_fd_008_subagent_contract.py
  runner: scripts/azoth_guards.py
  manifest_check: scripts/hermes_manifest_check.py

# Platform compatibility
platforms:
  claude_code: best-effort  # Was primary; now best-effort mirror (D55)
  hermes: trust-bearing    # Primary substrate (D55, D56)
  opencode: trust-bearing  # Co-trust (D55)
  codex: trust-bearing     # Co-trust (D55)
  copilot: adapter         # Best-effort mirror
  cursor: adapter          # Best-effort mirror
  gemini: adapter          # Best-effort mirror
  antigravity: adapter     # Best-effort mirror

# Sync source (set when configured)
sync:
  source: null
  last_sync: null
  sanitize_config: sync-config.yaml

# Pipeline presets
pipeline_presets:
  - full
  - deliver
  - hotfix
  - docs
  - research
  - review
  - refactor
  - auto  # default
