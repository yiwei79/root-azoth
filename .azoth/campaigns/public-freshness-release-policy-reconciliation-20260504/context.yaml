approval_basis: >
  Operator approved the Public freshness and release-policy reconciliation
  campaign on 2026-05-04 and asked to design the campaign then proceed. Scope
  is research-only: reconcile local public release evidence, freshness policy,
  rollout/postmortem references, and root-workshop drift language. Public
  sync/release, public checkout mutation, cockpit/project writes, backup/private
  remote, kernel/governance/M1, dependency/network/credential/destructive
  actions remain blocked. Network freshness checks are not authorized; any
  externally material freshness gap must be recorded as a stop/recommendation,
  not inferred.
budget:
  max_child_scopes: 2
  used_child_scopes: 1
  replay_threshold: 1
  replay_used: 0
  allowed_actions:
    - research_initiative
  budget_rationale: >
    One synthesis child was sufficient because the policy, release evidence,
    local public checkout, and validation script agreed. The second child remains
    unused because no reconciliation defect was found.
protected_boundaries:
  blocked:
    - public sync or release
    - public checkout mutation
    - network or remote freshness checks
    - cockpit or project writes
    - backup/private remote or credential work
    - kernel/governance/M1 mutation
    - dependency expansion
    - destructive actions
campaign_design:
  objective: >
    Determine whether release-facing Azoth surfaces should continue to claim
    public azoth v0.2.0 as the latest approved/installable release while root
    workshop drift remains advisory, or whether evidence requires a fresh public
    sync/release gate before such claims.
  research_questions:
    - What does the public freshness policy currently authorize?
    - Does stable publication evidence mention the recorded public commit and version?
    - Does the local public checkout match the recorded public commit and v0.2.0 tag target?
    - Does the validator reject a fresh-with-root claim while policy status is intentionally_stale?
    - What next safe action follows without authorizing public mutation?
  stop_conditions:
    - policy shape invalid or release evidence missing
    - local public checkout not present or dirty
    - local public checkout HEAD or v0.2.0 tag target differs from recorded public_commit
    - release-facing fresh-with-root claim required without public sync approval
    - external freshness becomes material and cannot be verified without network authorization
