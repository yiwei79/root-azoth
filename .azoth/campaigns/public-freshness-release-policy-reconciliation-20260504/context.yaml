findings:
  - id: release_policy_truth
    verdict: pass
    summary: >
      The current policy coherently marks public azoth v0.2.0 as the latest
      approved/installable release while declaring root workshop drift advisory.
      This is the correct release-facing truth until a separate public sync gate
      is approved and completed.
  - id: local_public_checkout_truth
    verdict: pass
    summary: >
      The local public checkout HEAD and local v0.2.0 tag target both match the
      recorded policy public_commit 499a4508836cf2d836ba97461bc9c9b94dc38aa6.
  - id: fresh_with_root_claim
    verdict: blocked_as_expected
    summary: >
      The validator rejects a fresh-with-root claim because freshness.status is
      intentionally_stale. This is desirable: current root HEAD
      1ed2290aac770fb08dff9fdfc160800379df8c0b includes post-public workshop
      drift and must not be claimed as public release content.
  - id: external_freshness_boundary
    verdict: residual
    summary: >
      No network or remote freshness check was performed. This is a declared
      authority boundary, not a failed check. Future public release/sync work must
      verify remote refs as part of its own protected gate.
reconciliation:
  current_claim_rule: >
    Release-facing surfaces may say public azoth v0.2.0 is the latest
    approved/installable release. They must also say root workshop drift is
    advisory only while the policy remains intentionally_stale.
  disallowed_claims:
    - Public azoth is fresh with current root HEAD.
    - Current root workshop commits are public release content.
    - A public sync, tag, or release can proceed from this research campaign.
  future_public_sync_gate: >
    Before claiming public azoth is current with root, open a separate protected
    public sync/release campaign with explicit operator approval. That gate must
    run fresh extraction, product smoke, clean public checkout sync, public
    commit/tag/release approval, remote-ref verification, and then update
    PUBLIC-AZOTH-FRESHNESS-POLICY.yaml to status=fresh with the current root
    evidence commit.
evaluation:
  completeness: pass
  hydration_or_implementation_justified: false
  replay_needed: false
  rationale: >
    The local evidence set is internally consistent and the validator enforces
    the intended boundary. No policy mutation, public sync, or implementation is
    justified by this research-only campaign.
next_safe_action:
  action: stop_campaign_complete
  recommendation: >
    Close this campaign as research-complete. The next fresh campaign can return
    to the candidate board, with INI-UX-001 phone-friendly output as the strongest
    non-protected delivery candidate unless the operator explicitly opens a
    protected public sync/release gate.
