recommended_campaign_context_system:
  name: Campaign Context Ledger
  canonical_path_pattern: .azoth/campaigns/<campaign_id>/context.yaml
  role: >
    Tracked, durable campaign strategy state. It records the approved design,
    route authority, candidate board, budget, protected boundaries, child-scope
    timeline, and latest checkpoint without acting as a write gate.
  source_of_truth_boundaries:
    - surface: .azoth/campaigns/<campaign_id>/context.yaml
      authority: Durable campaign design, approved budget, candidate board, checkpoints, and child-scope index.
      non_authority: Does not grant write authority by itself.
    - surface: .azoth/scope-gate.json
      authority: Current child-scope write permission and delegation plan.
      non_authority: Not a durable historical campaign state; overwritten per active scope.
    - surface: .azoth/autonomous-loop-state.local.yaml
      authority: Local loop driver, queue, async alignment packets, and iteration accounting.
      non_authority: Local runtime state; not safe as the only campaign memory.
    - surface: .azoth/run-ledger.local.yaml
      authority: Stage spawn/summary evidence and active write claim.
      non_authority: Does not define campaign strategy or selected next board.
    - surface: campaign-report or campaign-audit
      authority: Read-only reconstruction and evidence evaluation.
      non_authority: Advisory only; completed campaign evidence cannot authorize new work.
  lifecycle_states:
    - id: draft
      meaning: Designed from repo discovery; no operator approval and no write authority.
    - id: approved
      meaning: Operator approved the campaign declaration and budget; child scopes still require scope gates.
    - id: active
      meaning: At least one child scope is open or eligible under the approved budget.
    - id: checkpointed
      meaning: A child scope closed and the context records result, residual risk, and next route.
    - id: completed
      meaning: Campaign acceptance is satisfied and closeout records final disposition.
    - id: stopped
      meaning: Budget, protected gate, stale state, or operator stop ended the campaign before completion.
    - id: superseded
      meaning: A later approved context replaces this campaign as the active strategy object.
  required_fields:
    - campaign_context_version
    - campaign_id
    - campaign_name
    - status
    - objective
    - approval_basis
    - budget
    - context_pack
    - decision_board
    - recommended_campaign_context_system
    - state_transitions
    - child_scopes
    - latest_checkpoint
  future_minimal_implementation:
    phase_1: >
      Keep a tracked context.yaml per campaign and require new campaign designs
      to create or update it before opening child work.
    phase_2: >
      Add scripts/campaign_context.py check/init/checkpoint so local loop state
      and scope gates can validate against the tracked context before open-next.
    phase_3: >
      Teach autonomous_loop.py campaign-report and strategy preflight to link the
      active campaign context, report stale-context warnings, and checkpoint
      child-scope outcomes.
acceptance_criteria:
  - A future operator can reconstruct the approved campaign design from a tracked repo artifact, not chat memory.
  - Child scopes can cite one campaign context path as their parent strategy object.
  - The context complements scope-gate, loop state, and run-ledger instead of replacing their authority.
  - The context can record async alignment and child-scope checkpoints after closeout.
  - Protected boundaries remain explicit and fail closed.
