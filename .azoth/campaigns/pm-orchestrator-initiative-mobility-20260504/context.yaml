start_readiness:
  verdict: ready_for_operator_approval
  reason: >
    The prior Product Strategy Orchestrator campaign is completed Green, packaged,
    and has no active run or write claim. This campaign can start with
    research/refinement/ship actions immediately after operator approval. Canonical
    hydration remains blocked until a later exact human gate names the candidate
    and write path.

approval_prompt: >
  Approve PM Orchestrator Initiative Mobility with 12 child scopes and 3 bounded
  replays. Pre-hydration actions are research_initiative, refine_proposal, and
  ship_task. hydrate_task is allowed only after a fresh gate naming the exact
  candidate, scaffold/write path, and validation set.
