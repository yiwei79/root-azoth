schema_version: 1
bank_type: design
id: deployment-readiness-cockpit-upgrade
title: Deployment readiness cockpit upgrade
status: active_refinement
created_at: "2026-05-19T14:52:00Z"
updated_at: "2026-05-19T16:01:40Z"
source_proposal_refs:
  - .azoth/proposals/azoth-deployment-readiness-cockpit-upgrade.yaml
related_initiative_refs:
  - INI-DEP-001
related_decision_refs: [D11, D23, D38, D48, D50, D52]
problem: >
  Azoth needs a deployment and control-point design that scales from guide-only
  adoption to governed autonomy without hiding which plane owns each action.
design_thesis: >
  Treat modes as explicit release/readiness contracts. Root owns architecture,
  public Azoth ships consumer-safe bundles, cockpit shows pointer-only readiness,
  and project-local spaces own selected mode receipts.
options:
  - {option_id: guide_only_default, status: preferred, summary: "Start new spaces with guidance and receipts before runtime mutation."}
  - {option_id: full_by_default, status: rejected, summary: "Too likely to advertise project-management or autonomy without installed support."}
  - {option_id: cockpit_write_hub, status: rejected, summary: "Would blur cockpit readback with cross-repo write authority."}
tradeoffs:
  - {tradeoff_id: simplicity_vs_truth, summary: "Mode labels simplify adoption but must fail closed when assets are missing.", mitigation: "Readiness reports name installed and missing assets."}
  - {tradeoff_id: cockpit_power, summary: "A central control point is useful but can become hidden authority.", mitigation: "Keep cockpit pointer-only until project-local approval exists."}
open_questions:
  - {question_id: db-dep-001, status: answered, question: "Should guide and assisted modes be public release profiles or starter presets?", answer: "T-059 defines them as mode/readiness contract levels first; release-profile compiler work needs a fresh gate."}
research_refs:
  - .azoth/research/ini-dep-001-readiness-map.yaml
  - .azoth/research/t-059-deployment-readiness-mode-matrix.yaml
challenge_log:
  - {challenge_id: ch-dep-design-001, status: active, prompt: "What would make modes misleading?", answer: "Claiming managed or governed-autonomy readiness without runtime, seed, and stop-condition checks."}
routing_candidates:
  - {route: initiative_candidate, status: selected, target: INI-DEP-001#slice-dep-001-a, rationale: "First buildable move is the mode matrix and first-use map."}
