schema_version: 1
bank_type: design
id: project-readiness-cockpit-handoff
title: Project readiness cockpit handoff
status: active_refinement
created_at: "2026-05-19T19:36:00Z"
updated_at: "2026-05-19T19:36:00Z"
source_proposal_refs:
  - .azoth/proposals/project-local-mode-receipts-and-cockpit-handoff.yaml
related_initiative_refs:
  - INI-DEP-002
related_decision_refs:
  - D11
  - D23
  - D38
  - D48
  - D50
  - D52
problem: >
  Azoth needs a central cockpit/control-point experience that is useful for
  project readiness without becoming hidden authority over public, cockpit, or
  project-local repositories.
design_thesis: >
  Treat project-local mode receipts as the authoritative project state, and
  treat cockpit readback as pointer-only display plus next-safe-action routing.
  Root-azoth defines the contract; public Azoth and project-local repositories
  may only adopt it after their own explicit gates.
options:
  - option_id: project_local_receipt_first
    status: preferred
    summary: "Project-local receipt is authoritative; cockpit reads and routes."
  - option_id: cockpit_as_writer
    status: rejected
    summary: "Would turn central control point into cross-repo write authority."
  - option_id: release_template_first
    status: deferred
    summary: "Needs a later public release/template gate before shipping."
tradeoffs:
  - tradeoff_id: central_visibility_vs_authority
    summary: "Cockpit visibility is valuable, but write authority must remain local."
    mitigation: "Require source-of-truth order: receipt, pointer readback, next safe action."
  - tradeoff_id: adoption_ease_vs_truth
    summary: "Simple mode labels help adoption but can overstate readiness."
    mitigation: "Keep installed and missing asset classes visible."
open_questions:
  - question_id: db-dep-002-001
    status: open
    question: "Which receipt fields become mandatory per mode after T-062 hydration?"
  - question_id: db-dep-002-002
    status: open
    question: "Should public Azoth ship one receipt template or mode-specific templates?"
research_refs:
  - .azoth/research/ini-dep-002-project-readiness-handoff-map.yaml
  - .azoth/research/t-059-deployment-readiness-mode-matrix.yaml
  - .azoth/research/ini-dep-001-readiness-map.yaml
challenge_log:
  - challenge_id: ch-dep-design-002-001
    status: answered_for_planning
    prompt: "What would make this handoff unsafe?"
    answer: "Claiming project readiness from root/cockpit artifacts without a project-local receipt."
  - challenge_id: ch-dep-design-002-002
    status: answered_for_planning
    prompt: "What should stay canonical from T-059/T-060?"
    answer: "The cockpit readback field names and no-write cockpit behavior."
