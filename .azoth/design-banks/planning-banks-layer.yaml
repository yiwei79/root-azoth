closeout_history_policy:
  policy_id: planning_bank_closeout_history_merge_policy_v1
  status: active
  merge_strategy: append_only
  routine_closeout:
    planning_bank_write_mode: forbidden
    allowed_effects:
      - Read planning banks for closeout summaries, route context, or residual-risk
        reporting.
      - Record ordinary session closure in closeout, run-ledger, inbox, or memory
        artifacts outside planning-bank directories.
    blocked_effects:
      - Do not rewrite .azoth/design-banks during routine closeout.
      - Do not rewrite .azoth/initiative-banks during routine closeout.
      - Do not append hydration_history without an explicit hydration action.
    rationale: >
      Routine closeout runs often occur concurrently across worktrees. Keeping them
      non-mutating for planning banks avoids merge churn and prevents session closure
      from becoming silent planning authority.
  explicit_hydration_history:
    append_path: hydration_history
    append_position: append_tail
    required_metadata:
      - hydrated_at
      - session_id
      - candidate_slice_ref
      - task_ref
      - spec_ref
      - approval_scope
      - approval_basis
      - append_policy_ref
      - append_mode
      - merge_key
    allowed_when:
      - A selected initiative-bank candidate is ready_to_hydrate.
      - Human or branch-local autonomy approval is scoped to the concrete hydration.
      - The helper delegates roadmap/backlog/spec creation through the approved
        scaffold path instead of writing those artifacts directly.
    merge_key_shape: candidate_slice_ref:task_ref:hydrated_at
    audit_rule: >
      New helper writes append one hydration_history item at the tail and stamp append metadata.
      Existing entries are not rewritten for cosmetic normalization.
  non_laundering_rule: >
    historical planning truth may record a task that was hydrated through a bypassed
    path, but the bank must label that event explicitly as non retroactive pipeline
    compliance and must not describe it as retroactively pipeline-compliant.
