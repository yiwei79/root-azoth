research_questions:
  - question_id: rq-gen-001-001
    question: What authority should Codex Goal-mode carry inside Azoth?
    status: answered
    opened_at: "2026-05-10T13:56:00+00:00"
    needed_for: goal_mode_authority_packet
    answer: >
      Goal-mode should authorize only bounded low-risk continuation scopes while
      an active Codex Goal and operator intent exist. It may create proposals,
      initiative/design banks, starter prompts, readiness notes, validation
      receipts, and explicitly scoped repo-local repair gates for scripts/tests.
      Scope and pipeline gates may be written only through the validated
      Goal-mode self-approval helper. Kernel/governance, roadmap/backlog/spec
      hydration, public Azoth, personal cockpit, project repos, dependencies,
      credentials, destructive changes, and broad productization remain human-gated.
    evidence_refs:
      - .azoth/proposals/project-genesis-goal-mode-autonomy.yaml#details.proposed_model.goal_mode_authority_packet
      - scripts/check_gates.py
      - commands/next/body.md
  - question_id: rq-gen-001-002
    question: What is the minimum Project Genesis starter contract?
    status: active
    opened_at: "2026-05-10T13:56:00+00:00"
    needed_for: project_local_starter_packet
    answer: >
      The starter should capture project identity, domain, why-now, success
      signals, local context paths, open questions, safe boundaries, Azoth source
      profile, cockpit route, and a validation receipt. It should remain
      discovery/readiness-first until a later hydration-specific approval exists.
    evidence_refs:
      - .azoth/proposals/project-genesis-goal-mode-autonomy.yaml#details.proposed_model.project_genesis_starter_contract
  - question_id: rq-gen-001-003
    question: How should Project Genesis adapt to music, thesis, and agent-context spaces?
    status: active
    opened_at: "2026-05-10T13:56:00+00:00"
    needed_for: domain_specific_starter_prompts
    answer: >
      Music production should preserve creative exploration language; bachelor
      thesis work should preserve academic source, structure, and deadline
      context; agent/context work should preserve architecture, compatibility,
      and experiment framing. None should be forced into task hydration before
      readiness is explicit.
    evidence_refs:
      - .azoth/proposals/project-genesis-goal-mode-autonomy.yaml#details.proposed_model.project_genesis_starter_contract.starter_examples
research_refs:
  - id: ref-gen-001-proposal
