local_findings:
  - finding_id: lf-gen-001-001
    summary: >
      Current gate validation blocks writes when scope-gate.approved is false,
      even if a Codex Goal is active.
    evidence_refs:
      - scripts/check_gates.py
      - scripts/scope_gate_check.py
    implication: >
      Goal-mode needs an explicit special authority packet; otherwise Codex Goal
      remains passive continuity rather than usable autonomy.
  - finding_id: lf-gen-001-002
    summary: >
      Existing Project Genesis support is scattered across public extraction,
      planning banks, proposals, and cockpit references rather than one friendly
      start/connect flow.
    evidence_refs:
      - scripts/azoth_release_profile.py
      - docs/personal-control-plane/MULTI-CONTROL-PANEL-UX-ANCHOR.md
      - .azoth/proposals/personal-knowledge-batch-zero-and-deployment-finalization.yaml
    implication: >
      The first slice should unify the experience contract before mutating any
      project or cockpit repository.
external_findings: []
assumptions:
  - assumption_id: asm-gen-001-001
    text: >
      The operator wants Goal-mode autonomy for low-risk planning and readiness
      progress, not unrestricted write authority across all Azoth planes.
    confidence: high
  - assumption_id: asm-gen-001-002
    text: >
      The first Project Genesis slice should not create or modify the music,
      thesis, agent-context, public Azoth, or cockpit repositories.
    confidence: high
contradictions:
  - contradiction_id: con-gen-001-001
    text: >
      Azoth's current approval gates are intentionally conservative, while Codex
      Goal creates an expectation that the agent should keep moving
      autonomously.
    resolution_path: >
      Use the delivered Goal-mode self-approval helper as the mechanical scope
      opener for bounded planning-seed and repo-repair continuations, while keeping
      protected planes human-gated.
challenge_log:
  - challenge_id: ch-gen-001-001
    challenge: >
      Could Goal-mode become a governance bypass?
    response: >
      Not in the seed contract. It explicitly forbids protected and mutating
      planes, hydration, dependencies, credentials, destructive edits, and broad
      implementation.
    status: answered_for_v1_v2_opener
  - challenge_id: ch-gen-001-002
    challenge: >
      Can Goal-mode open its own scope without weakening Azoth's human-gated
      trust model?
    response: >
      Yes, but only through a bounded planning-seed opener that validates the
      requested write set and emits normal scope/pipeline gates. It must not
      mutate kernel/governance, roadmap/backlog/spec hydration, public product,
      cockpit, project repos, releases, dependencies, credentials, or destructive
      surfaces.
    status: answered_for_v1_v2_opener
