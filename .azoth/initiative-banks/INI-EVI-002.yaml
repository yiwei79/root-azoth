candidate_slices:
  - candidate_id: slice-evi-002-a
    proposed_task_id: T-018
    title: Initiative bank contract and readiness validation for knowledge-richness discovery
    initiative_ref: INI-EVI-002
    status: complete
    target_layer: infrastructure
    delivery_pipeline: standard
    summary: Define reusable initiative-bank validation and a read-only readiness report for the INI-EVI-002 pilot so operators can see whether a candidate slice is ready to hydrate without mutating roadmap/backlog state.
    acceptance_criteria:
      - Reusable validation accepts the live INI-EVI-002 initiative bank and rejects missing required fields or malformed candidate slices.
      - Readiness reporting exposes readiness_status, human_decision, candidate_first_slice, acceptance criteria status, non-goals status, freshness status, and hydration recommendation.
      - Pending or absent human_decision fails closed for ready_to_hydrate.
      - The implementation does not write roadmap, backlog, or roadmap-spec state; any future hydration remains a separate explicit approval path.
      - Research evidence remains linked under .azoth/research/ instead of owning planning state.
    research_evidence_refs:
      - .azoth/initiative-banks/INI-EVI-002.yaml
      - .azoth/research/ini-evi-002-research-bank.yaml
    known_non_goals:
      - Do not implement a new command.
      - Do not change /next behavior.
      - Do not hydrate roadmap/backlog state in the same step.
      - Do not add write-mode hydration helper behavior in the first implementation slice.
    open_questions: []
    recommended_phase: v0.2.0-p3
    hydration_plan:
      proposed_title: Initiative bank contract validator and readiness report
      hydrated_task_ref: T-018
      hydrated_spec_ref: .azoth/roadmap-specs/v0.2.0/T-018.yaml
      scaffold_command: scripts/roadmap_scaffold.py --title "Initiative bank contract validator and readiness report" --initiative-ref INI-EVI-002 --target-layer infrastructure --delivery-pipeline standard
      pre_hydration_requirements:
        - readiness.readiness_status must be ready_to_hydrate.
        - readiness.human_decision must be approved.
        - acceptance_criteria_status and non_goals_status must be stable.
        - open_questions must be empty or explicitly non-blocking.
        - hydration_history remains empty until the approved scaffold write occurs.
  - candidate_id: slice-evi-002-b
    proposed_task_id: TBD-INI-EVI-002-B
    title: Generalize proposal richness scoring into artifact-class adapters
    initiative_ref: INI-EVI-002
    status: candidate
    target_layer: infrastructure
    delivery_pipeline: standard
    summary: Extend the current proposal-only richness evaluator into a plan-only adapter design for initiative banks, starting with INI-EVI-002 readiness evidence and preserving the boundary between advisory richness scoring and fail-closed structural validation.
    acceptance_criteria:
      - Define a minimal artifact-class adapter contract that can score architecture proposals and initiative banks without changing either source schema.
      - Map existing proposal richness dimensions to initiative-bank evidence fields, explicitly marking dimensions that do not transfer cleanly.
      - Produce a read-only report shape for initiative-bank richness that complements, but does not replace, planning_bank_validate.py structural checks.
      - Add tests proving proposal scoring remains unchanged and initiative-bank scoring fails soft as advisory evidence rather than blocking hydration mechanically.
      - Keep roadmap, backlog, roadmap-spec, and hydration-history writes out of the adapter slice.
    research_evidence_refs:
      - scripts/proposal_knowledge_richness.py
      - tests/test_proposal_knowledge_richness.py
      - scripts/planning_bank_validate.py
      - .azoth/research/ini-evi-002-research-bank.yaml#pack-evi-002-next-candidate-001
    known_non_goals:
      - Do not score every artifact class before the bank pilot proves the contract.
      - Do not make advisory richness scores a replacement for structural validation.
      - Do not add write-mode hydration helper behavior.
      - Do not mutate roadmap, backlog, or roadmap-spec state.
    open_questions: []
    recommended_phase: v0.2.0-p3
