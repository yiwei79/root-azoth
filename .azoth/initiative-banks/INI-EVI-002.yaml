research_questions:
  - question_id: rq-evi-002-001
    question: Which project-management artifacts should the first richness lane score?
    status: answered
    answered_at: "2026-04-24T00:00:00+00:00"
    answer: Start with architecture proposals and initiative banks. Defer roadmap hydration plans and task research capsules until the bank contract is validated against this pilot.
    evidence_refs:
      - .azoth/proposals/initiative-discovery-to-roadmap-hydration.yaml
      - scripts/proposal_knowledge_richness.py
  - question_id: rq-evi-002-002
    question: What should remain separate from structural schema validation?
    status: answered
    answered_at: "2026-04-24T00:00:00+00:00"
    answer: Richness scoring is advisory quality evidence. It should not replace structural validators such as architecture_proposal_validate.py, research_sufficiency.py, or planning_bank_validate.py.
    evidence_refs:
      - scripts/architecture_proposal_validate.py
      - scripts/research_sufficiency.py
      - scripts/planning_bank_validate.py
  - question_id: rq-evi-002-003
    question: What must be true before a first implementation slice is hydrated?
    status: answered
    opened_at: "2026-04-24T00:00:00+00:00"
    answered_at: "2026-04-24T17:43:19+00:00"
    needed_for: first_slice_readiness
    answer: The initiative-owned planning state now lives in a tracked initiative bank. The first slice should stay unhydrated until slice-evi-002-a has stable acceptance criteria, non-goals, readiness_status ready_to_hydrate, and human_decision approved.
    evidence_refs:
      - .azoth/design-banks/planning-banks-layer.yaml
      - .azoth/initiative-banks/INI-EVI-002.yaml
  - question_id: rq-evi-002-004
    question: Is slice-evi-002-a ready to become a scoped hydration candidate?
    status: answered
    opened_at: "2026-04-24T18:36:03+00:00"
    answered_at: "2026-04-24T18:36:03+00:00"
    needed_for: human_hydration_decision
    answer: Slice-evi-002-a is ready for a human hydration decision as a standard infrastructure task focused on validator plus readiness reporting. It is not yet hydrated; roadmap/backlog writes remain blocked until the operator explicitly approves that next step.
    evidence_refs:
      - .azoth/initiative-banks/INI-EVI-002.yaml#candidate_slices
      - .azoth/research/ini-evi-002-research-bank.yaml#pack-evi-002-readiness-checkpoint-001
  - question_id: rq-evi-002-005
    question: What should become the next candidate after T-018 delivered the bank validator and read-only readiness report?
    status: answered
    opened_at: "2026-04-24T19:55:00+00:00"
    answered_at: "2026-04-24T19:55:00+00:00"
    needed_for: next_candidate_refinement
    answer: The next candidate should refine artifact-class richness adapters as a plan-only infrastructure slice. It should start by mapping the existing proposal-richness dimensions onto initiative-bank readiness evidence, without adding a hydration write helper or treating advisory richness scores as fail-closed structural validation.
    evidence_refs:
