research_questions:
- question_id: rq-dep-001-001
  question: What deployment modes should Azoth expose?
  status: answered
  opened_at: '2026-05-19T14:39:38Z'
  needed_for: mode_matrix
  answer: 'Use guide, assisted, managed, and governed_autonomy as the first scale
    ladder. Each mode must name installed capability classes and exclusions.

    '
  evidence_refs:
  - .azoth/proposals/azoth-deployment-readiness-cockpit-upgrade.yaml#details.mode_taxonomy
- question_id: rq-dep-001-002
  question: What should the central cockpit control point own?
  status: answered
  opened_at: '2026-05-19T14:39:38Z'
  needed_for: cockpit_readiness_readback
  answer: 'It should show project pointers, selected Azoth mode, readiness state,
    freshness, installed/missing asset classes, active write claim, stop reason,
    and next safe action. It should not silently mutate project repos.

    '
  evidence_refs:
  - .azoth/research/t-059-deployment-readiness-mode-matrix.yaml#cockpit_readback_contract
  - scripts/cockpit_bootstrap_verify.py
  - scripts/cockpit_ux_simulate.py
- question_id: rq-dep-001-003
  question: Which readiness checks block unsafe first-use claims?
  status: answered
  opened_at: '2026-05-19T14:39:38Z'
  needed_for: release_profile_matrix_compiler
  answer: 'A mode is not ready unless advertised commands, skills, agents, scripts,
    planning seeds, ledger/route evidence, and local-private runtime protections
    all match the selected mode.

    '
  evidence_refs:
  - .azoth/research/t-059-deployment-readiness-mode-matrix.yaml#first_use_evidence_map
  - scripts/azoth_release_profile.py
  - scripts/product_release_smoke.py
