research_questions:
- question_id: rq-mem-003-001
  question: What is the current M3/context-recall behavior that a quality spine must
    preserve?
  status: answered
  opened_at: '2026-05-03T17:00:20Z'
  answered_at: '2026-05-03T17:00:20Z'
  needed_for: slice-mem-003-a
  answer: 'Context-recall is currently instruction-level. It extracts 3-5 goal tags,
    scores M3 episodes with tag overlap, recency, and reinforcement_count, scores
    M2 patterns by trigger/reinforcement, reviews stale/contradictory or superseded
    candidates, and surfaces top 1-3 advisory results.

    '
  evidence_refs:
  - .agents/skills/context-recall/SKILL.md
  - .azoth/memory/episodes.jsonl
  - .azoth/memory/patterns.yaml
- question_id: rq-mem-003-002
  question: Which corpus is safe for the first recall-quality spine?
  status: answered
  opened_at: '2026-05-03T17:00:20Z'
  answered_at: '2026-05-03T17:00:20Z'
  needed_for: slice-mem-003-a
  answer: 'Use governed repo-local M3 JSONL through episode_store plus read-only M2
    patterns. Do not index raw inbox, personal-root content, unreviewed source material,
    or hidden instruction bodies.

    '
  evidence_refs:
  - scripts/episode_store.py
  - scripts/personal_knowledge_recall.py
  - tests/test_personal_knowledge_recall.py
- question_id: rq-mem-003-003
  question: What is the smallest zero-dependency recall-quality spine?
  status: answered
  opened_at: '2026-05-03T17:00:20Z'
  answered_at: '2026-05-03T17:00:20Z'
  needed_for: slice-mem-003-a
  answer: 'A pure-Python scorer/eval harness that loads M3, reads M2 patterns read-only,
    accepts query tags or query text, returns top-1/top-3 results with score reasons
    and source ids, and verifies deterministic fixture cases.

    '
  evidence_refs:
  - .agents/skills/context-recall/SKILL.md
  - scripts/episode_store.py
  - scripts/personal_knowledge_recall.py
- question_id: rq-mem-003-004
  question: When should INI-MEM-002 temporal validity enter this campaign?
  status: answered
  opened_at: '2026-05-03T17:00:20Z'
  answered_at: '2026-05-03T17:00:20Z'
  needed_for: adjacent_lane_decision
  answer: 'Only if recall-quality replay shows stale M2 patterns, supersession gaps,
    or point-in-time pattern selection are actual correctness blockers. It is not
    prerequisite for the M3 zero-dependency baseline, and M2 invalidation remains
    HITL-only.

    '
  evidence_refs:
  - .azoth/roadmap.yaml#INI-MEM-002
  - .azoth/memory/patterns.yaml
- question_id: rq-mem-003-005
