    JSONL fallback, and measured improvement over the deterministic baseline.

    '
  evidence_refs:
  - .azoth/roadmap.yaml#INI-MEM-003
  - requirements-dev.txt
- question_id: rq-mem-003-006
  question: What exact executable surface should slice-mem-003-a hydrate?
