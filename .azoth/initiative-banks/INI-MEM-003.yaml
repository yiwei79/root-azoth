candidate_slices:
- candidate_id: slice-mem-003-a
  proposed_task_id: T-057
  title: M3 recall quality eval harness and deterministic default scorer
  initiative_ref: INI-MEM-003
  status: hydrated
  target_layer: infrastructure
  delivery_pipeline: standard
  summary: 'Build the smallest zero-dependency recall-quality spine for current Azoth
    memory: load governed M3 JSONL, read M2 patterns read-only, score by tags, metadata
    tokens, recency, and reinforcement, and verify top-1/top-3 fixture cases before
    any vector backend.

    '
  acceptance_criteria:
  - 'scripts/context_recall_quality.py supports --json query mode and fixture eval
    mode, loads M3 only through scripts/episode_store.py, reads M2 patterns read-only,
    and never mutates memory surfaces.

    '
  - 'JSON output includes schema_version, packet_type, query, query_tags, as_of, top_k,
    corpus, results, warnings, no_match, and advisory_authority.

    '
  - 'Each result includes rank, source_type, id, source_ref, summary, timestamp, tags,
    score_total, score_components, match_reasons, freshness_status, conflict_status,
    and advisory_authority.

    '
  - 'Eval mode reports fixture_set_id, fixture_results, top1_pass_count, top3_pass_count,
    failed_fixture_ids, and pass_fail.

    '
  - 'Fixture coverage includes exact tag hit, keyword-only rescue, M2 trigger match,
    recency tie-break, reinforcement boost, stale/supersede annotation, mixed M3/M2
    deterministic top-3, and no-match empty result.

    '
  - 'Tests prove no new dependency, vector runtime, network access, raw inbox indexing,
    personal-root read, context-recall skill replacement, or M2 invalidation/expiry
    is introduced.

    '
  research_evidence_refs:
  - .azoth/research/ini-mem-003-research-bank.yaml#pack-mem-003-local-recall-surfaces-001
  - .azoth/research/ini-mem-003-research-bank.yaml#pack-mem-003-fixture-contract-002
  - .agents/skills/context-recall/SKILL.md
  - scripts/episode_store.py
  - scripts/personal_knowledge_recall.py
  - tests/fixtures/context_recall_quality.yaml
  known_non_goals:
  - No vector backend or embedding generation.
  - No new dependencies or network access.
  - No M2 invalidation, rewrite, auto-expiry, or temporal-validity schema change.
  - No raw inbox, personal-root, or unreviewed source indexing.
  - No /start or /next integration in this slice.
  - No context-recall skill behavior replacement in this slice.
  - No stale, archived, or superseded candidate mutation; annotation only.
  open_questions: []
  recommended_phase: post-v0.2.0-stabilization
