research_questions:
- question_id: rq-pkb-001-001
  question: What is the smallest useful Batch 0 candidate-review artifact?
  status: active
  opened_at: '2026-04-29T17:20:00+00:00'
  needed_for: slice-pkb-001-a
  answer: 'Start with a root-side candidate review artifact only: 5-10 candidates,
    explicit provenance, decision state, safety classification, and validator evidence.
    Do not deploy cards to personal-root in the same slice.

    '
  evidence_refs:
  - scripts/personal_knowledge_inventory.py
  - scripts/personal_knowledge_validate.py
  - docs/personal-control-plane/PERSONAL-KNOWLEDGE-ARCHITECTURE.md
- question_id: rq-pkb-001-002
  question: Which retrieval/search practices should apply before adding recall surfaces?
  status: active
  opened_at: '2026-04-29T17:20:00+00:00'
  needed_for: slice-pkb-001-c
  answer: 'Retrieval should wait until the card schema proves useful. Future recall
    should preserve source metadata, filters, contextualized chunks, exact identifier
    search, and eval evidence before broad vector or graph indexing.

    '
  evidence_refs:
  - .azoth/roadmap-specs/v0.2.0-p4/SWARM_RESEARCH_DIGEST.yaml#RP-PKB-RAG
- question_id: rq-pkb-001-003
  question: What release-feedback gates prevent repeating the rushed stable-release
    mistake?
  status: active
  opened_at: '2026-04-29T17:20:00+00:00'
  needed_for: finalization_lifecycle
  answer: 'Use staged reconcile, preflight, independent review/eval, explicit approval,
    deploy/publish, verify, and closeout. Treat retrospective evidence as corrective
    evidence, not retroactive compliance.

    '
  evidence_refs:
  - .azoth/roadmap-specs/v0.2.0/V0.2.0-RC-RETROSPECTIVE-EVAL.md
  - .azoth/roadmap-specs/v0.2.0-p4/SWARM_RESEARCH_DIGEST.yaml#RP-PKB-LIFECYCLE
