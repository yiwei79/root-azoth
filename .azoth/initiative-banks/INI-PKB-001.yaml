external_findings:
  - finding_id: ef-pkb-001-001
    status: active
    summary: Delivery health requires speed and instability/recovery signals together, not a single green check.
    source_ref: .azoth/roadmap-specs/v0.2.0-p4/SWARM_RESEARCH_DIGEST.yaml#RP-PKB-LIFECYCLE
  - finding_id: ef-pkb-001-002
    status: active
    summary: GitOps and SLSA reinforce declarative desired state, immutable version history, source provenance, and revision continuity.
    source_ref: .azoth/roadmap-specs/v0.2.0-p4/SWARM_RESEARCH_DIGEST.yaml#RP-PKB-PROVENANCE
  - finding_id: ef-pkb-001-003
    status: active
    summary: Current RAG practice favors metadata filters, hybrid retrieval, contextual chunks, reranking, and evals before broad indexing.
    source_ref: .azoth/roadmap-specs/v0.2.0-p4/SWARM_RESEARCH_DIGEST.yaml#RP-PKB-RAG
  - finding_id: ef-pkb-001-004
    status: active
    summary: OWASP and NIST guidance treat vector stores and AI knowledge flows as governed systems with access, validation, logging, and lifecycle risk controls.
    source_ref: .azoth/roadmap-specs/v0.2.0-p4/SWARM_RESEARCH_DIGEST.yaml#RP-PKB-AI-SAFETY
assumptions:
  - assumption_id: as-pkb-001-001
    status: active
    statement: A proposal plus initiative-bank seed is the right p4 stabilization output because direct roadmap hydration would cut across freeze posture.
    validation_path: Revisit only after the operator explicitly approves a hydration route.
  - assumption_id: as-pkb-001-002
    status: active
    statement: Batch 0 usefulness should be proven with a tiny reviewed candidate set before recall or graph/index infrastructure.
    validation_path: Run a root-side Batch 0 review artifact slice with validator evidence.
contradictions:
  - contradiction_id: cx-pkb-001-001
    status: monitored
    summary: The personal control plane overlays the dev panel operationally, but it must not supersede root-azoth as source authority.
    resolution: Preserve source-plane pointers and keep mutation authority in root/public release gates.
challenge_log:
  - challenge_id: ch-pkb-001-001
    status: active
    prompt: What would make the next slice too broad?
    answer: >
      Combining candidate review, card creation, personal-root deployment, recall
      integration, source registry onboarding, or public release in one slice.
  - challenge_id: ch-pkb-001-002
    status: active
    prompt: What would repeat the rushed-release mistake?
    answer: >
      Treating validator success as approval to publish/deploy, or using retrospective
      evidence as if it were contemporaneous gated evidence.
candidate_slices:
  - candidate_id: slice-pkb-001-a
    proposed_task_id: T-PKB-A
    title: Batch 0 candidate review artifact only
    initiative_ref: INI-PKB-001
    status: candidate
    target_layer: infrastructure
    delivery_pipeline: standard
    summary: >
      Create a root-side candidate review artifact for 5-10 deferred personal
      knowledge candidates with provenance, safety classification, decision state,
      and validator evidence. Do not create cards or deploy to personal-root.
    acceptance_criteria:
      - Candidate artifact validates structurally.
      - Every candidate has source pointer, rationale, safety classification, and decision state.
      - No personal-root files are mutated.
      - No Batch 0 cards are created.
      - Dashboard and deploy parity checks still pass.
    research_evidence_refs:
      - .azoth/roadmap-specs/v0.2.0-p4/SWARM_RESEARCH_DIGEST.yaml#RP-PKB-PROVENANCE
      - .azoth/roadmap-specs/v0.2.0-p4/SWARM_RESEARCH_DIGEST.yaml#RP-PKB-AI-SAFETY
      - docs/personal-control-plane/PERSONAL-KNOWLEDGE-ARCHITECTURE.md
    known_non_goals:
      - No personal-root deployment.
      - No source registry or project onboarding.
      - No recall integration.
      - No public azoth release.
    open_questions:
      - Which exact 5-10 candidates should the operator approve for review?
    recommended_phase: post-v0.2.0-stabilization
    hydration_plan:
      proposed_title: Personal knowledge Batch 0 candidate review artifact
      scaffold_command: >
        python3 scripts/roadmap_scaffold.py --title "Personal knowledge Batch 0 candidate review artifact"
        --initiative-ref INI-PKB-001 --target-layer infrastructure --delivery-pipeline standard
  - candidate_id: slice-pkb-001-b
    proposed_task_id: T-PKB-B
    title: Approved card deployment receipt and personal-root pointer index
    initiative_ref: INI-PKB-001
    status: candidate
    target_layer: infrastructure
    delivery_pipeline: standard
    summary: >
      After operator approval of candidate decisions, deploy only approved cards
      to personal-root with a receipt, pointer index update, validation evidence,
      and clean-git proof.
    acceptance_criteria:
      - Only approved candidate IDs are deployed.
      - Personal-root validator passes after deployment.
      - Deployment receipt names source revision, target paths, validation command, and commit.
      - Root and personal-root git states are clean after closeout.
    research_evidence_refs:
      - .azoth/roadmap-specs/v0.2.0-p4/SWARM_RESEARCH_DIGEST.yaml#RP-PKB-LIFECYCLE
      - .azoth/roadmap-specs/v0.2.0-p4/SWARM_RESEARCH_DIGEST.yaml#RP-PKB-PROVENANCE
    known_non_goals:
      - No broad import.
      - No recall or retrieval index.
      - No public release.
    open_questions:
      - Which candidate decisions are approved after slice-pkb-001-a?
    recommended_phase: post-v0.2.0-stabilization
    hydration_plan:
      proposed_title: Approved personal knowledge card deployment receipt
      scaffold_command: >
        python3 scripts/roadmap_scaffold.py --title "Approved personal knowledge card deployment receipt"
        --initiative-ref INI-PKB-001 --target-layer infrastructure --delivery-pipeline standard
  - candidate_id: slice-pkb-001-c
    proposed_task_id: T-PKB-C
    title: Personal knowledge recall pilot and retrieval eval harness
    initiative_ref: INI-PKB-001
    status: candidate
    target_layer: infrastructure
    delivery_pipeline: standard
    summary: >
      After cards prove useful, add a root-side recall pilot with metadata filters,
      source-preserving context, exact identifier search, and eval cases before
      vector or graph infrastructure.
    acceptance_criteria:
      - Recall pilot uses approved card metadata only.
      - Eval cases cover exact source/path lookup, semantic question, freshness, and access-boundary behavior.
      - Retrieval output preserves source pointers and does not become hidden instruction authority.
    research_evidence_refs:
      - .azoth/roadmap-specs/v0.2.0-p4/SWARM_RESEARCH_DIGEST.yaml#RP-PKB-RAG
      - .azoth/roadmap-specs/v0.2.0-p4/SWARM_RESEARCH_DIGEST.yaml#RP-PKB-AI-SAFETY
    known_non_goals:
      - No raw inbox or memory indexing.
      - No GraphRAG production layer.
      - No autonomous source mutation from retrieved cards.
    open_questions:
      - Which card set is sufficient to evaluate recall usefulness?
      - What latency/cost ceiling should apply to recall?
    recommended_phase: post-v0.2.0-stabilization
    hydration_plan:
      proposed_title: Personal knowledge recall pilot and retrieval eval harness
      scaffold_command: >
        python3 scripts/roadmap_scaffold.py --title "Personal knowledge recall pilot and retrieval eval harness"
        --initiative-ref INI-PKB-001 --target-layer infrastructure --delivery-pipeline standard
