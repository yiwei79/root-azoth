  opened_at: '2026-04-29T17:20:00+00:00'
  needed_for: finalization_lifecycle
  answer: 'Use staged reconcile, preflight, independent review/eval, explicit approval,
    deploy/publish, verify, and closeout. Treat retrospective evidence as corrective
    evidence, not retroactive compliance.

