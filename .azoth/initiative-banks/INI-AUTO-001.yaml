local_findings:
  - finding_id: lf-auto-001-001
    status: active
    summary: Autonomous-auto can now observe completed campaigns through campaign-report, but that report deliberately requires a fresh budget before old-campaign continuation.
    evidence_refs:
      - scripts/autonomous_loop.py
      - tests/test_autonomous_loop.py
