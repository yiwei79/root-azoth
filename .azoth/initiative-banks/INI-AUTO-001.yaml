research_questions:
  - question_id: rq-auto-001-001
    question: What does "throw an initiative at Azoth" mean as a safe input contract?
    status: answered
    opened_at: "2026-04-25T12:10:00+00:00"
    needed_for: initiative_intake_contract
    answer: >
      A safe raw-initiative input is a discovery-only seed contract: stable
      initiative id, operator goal, why now, constraints, protected boundaries,
      success signals, initial uncertainty, approval_scope, allowed outputs,
      forbidden outputs, and discovery-only approval_basis. It may create or
      update planning seed artifacts, but it has no roadmap, backlog, task-spec,
      scope, run-claim, hydration, or implementation authority.
    evidence_refs:
      - .azoth/proposals/autonomous-initiative-lifecycle-orchestration.yaml#details.proposed_model.initiative_intake_contract
      - scripts/planning_bank_validate.py
      - scripts/initiative_scaffold.py
  - question_id: rq-auto-001-002
    question: Which readiness state should route to research, proposal refinement, hydration, delivery, capture, or stop?
    status: answered
    opened_at: "2026-04-25T12:10:00+00:00"
    needed_for: lifecycle_router
    answer: >
      Route from a normalized read-only lifecycle report, not raw YAML alone.
      Raw initiatives stop for intake. Initiative banks with continue_research,
      open questions, stale evidence, or contradictions route to
      research_initiative. Draft proposals with unclear non-goals, acceptance,
      alternatives, or hydration plans route to refine_proposal. A green
      readiness report with approved human_decision, hydration-specific approval_scope,
      approval_basis, fresh evidence, empty open questions, selected candidate,
      and scaffold command routes to hydrate_task. Hydrated safe roadmap/backlog/spec tasks route to
      ship_task. Self-improvement queues route to capture_self_improvement. Defer,
      reject, protected gates, missing approval, active claims, exhausted budget,
      async stop, stale old campaigns, or no safe candidate route to stop.
    evidence_refs:
      - scripts/autonomous_loop.py
      - scripts/planning_bank_validate.py
      - scripts/planning_bank_surfacing.py
      - scripts/roadmap_dashboard.py
      - .azoth/roadmap-specs/v0.2.0/AUTONOMOUS-AUTO-UX-EXPERIENCE.md
  - question_id: rq-auto-001-003
    question: What is the minimum approved write-mode hydration path that cannot become a second roadmap engine?
    status: answered
    opened_at: "2026-04-25T12:10:00+00:00"
    needed_for: write_mode_hydration
    answer: >
      The minimum safe path is a dedicated hydration helper that consumes a
      green planning_bank_validate.py readiness report, requires explicit
      hydration approval_basis and human_decision approved, refuses raw
      initiatives, proposal-only input, stale evidence, open questions,
      protected/governed/M1 expansion, and missing scaffold commands, then
      delegates actual roadmap/backlog/spec mutation to roadmap_scaffold.py.
      After success, it may update only initiative-bank bookkeeping such as
      candidate status and hydration_history.
    evidence_refs:
      - scripts/roadmap_scaffold.py
      - scripts/planning_bank_validate.py
      - .azoth/roadmap-specs/v0.2.0/T-022.yaml
      - .azoth/proposals/initiative-bank-tooling-and-hydration-helper.yaml
  - question_id: rq-auto-001-004
    question: How should durable wakeups run one bounded autonomous-auto iteration without hidden continuation?
    status: answered
    opened_at: "2026-04-25T12:10:00+00:00"
    needed_for: durable_wakeup_driver
    answer: >
      Durable wakeups should start as a repo-local dry-run/report command that
      reads loop state, campaign report, gates, run ledger, write claim, budget,
      async packets, and stop conditions; emits a concrete stop reason when
      blocked; requires fresh budget for old or completed campaigns; may run one
      decide-next and optionally one open-next when safe; then exits. It must not
      become a daemon, repeated loop, or hidden continuation path.
    evidence_refs:
      - .agents/skills/autonomous-auto/SKILL.md
      - scripts/autonomous_loop.py
      - .azoth/scope-gate.json
      - .azoth/handoffs/2026-04-25-autonomous-auto-development-handoff.md
  - question_id: rq-auto-001-005
    question: How should autonomous-auto evaluate completed campaigns and prove learning closure?
    status: active
    opened_at: "2026-04-25T21:30:00Z"
    needed_for: campaign_evaluation_learning_closure
    answer: >
      The next layer should treat each autonomous-auto campaign as a lifecycle
      object with declaration, route decisions, child scopes, delegation plans,
      run-ledger stage evidence, evaluator outputs, changed artifacts, closeout
      episodes, lessons, follow-on tasks, commits, and later reinforcement
      evidence. The first buildable form should be a read-only campaign audit
      report, followed by a learning-closure ledger only after the report proves
      which repo-native artifacts are reliable enough to join.
    evidence_refs:
      - .azoth/proposals/autonomous-auto-campaign-evaluation-learning-closure.yaml
      - .azoth/autonomous-loop-state.local.yaml
      - scripts/autonomous_loop.py
      - scripts/run_ledger.py
      - .azoth/memory/episodes.jsonl
