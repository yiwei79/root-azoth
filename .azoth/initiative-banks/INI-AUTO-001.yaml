assumptions:
  - assumption_id: as-auto-001-001
    status: active
    statement: Initiative lifecycle orchestration should be modeled as a router over readiness surfaces, not as a new roadmap authority.
    validation_path: Test raw, discovery-active, approved-for-hydration, and delivery-ready states against fail-closed route decisions.
  - assumption_id: as-auto-001-002
    status: active
    statement: The first buildable slice should be initiative intake and seed validation before lifecycle routing or write-mode hydration.
    validation_path: Challenge whether routing can be correct without a stable input contract.
  - assumption_id: as-auto-001-003
    status: active
    statement: Durable wakeups should run one bounded iteration per invocation and should never continue old campaigns without a fresh budget.
    validation_path: Use campaign-report output plus loop-state and write-claim tests.
