research_questions:
  - question_id: rq-harness-001-001
    question: What should replace the old stock-lite/azoth-lite/azoth-full user-facing language?
    status: answered
    opened_at: "2026-06-06T00:00:00Z"
    needed_for: harness_profile_router
    answer: >
      Keep the old classifier as a lower-level implementation detail, but expose
      the operator-facing ladder from the deployment readiness contract: guide,
      assisted, managed, and governed_autonomy.
    evidence_refs:
      - .azoth/research/t-059-deployment-readiness-mode-matrix.yaml#mode_matrix
      - scripts/harness_profile.py
  - question_id: rq-harness-001-002
    question: How does the three-circle model reconcile with Azoth's four authority planes?
    status: answered
    opened_at: "2026-06-06T00:00:00Z"
    needed_for: personal_operating_model
    answer: >
      Use three daily circles for the operator's mental model: personal cockpit,
      project spaces, and Azoth supply chain. Preserve four authority planes for
      safety: personal cockpit, project-local, root-azoth, and public Azoth.
    evidence_refs:
      - docs/personal-control-plane/MULTI-CONTROL-PANEL-UX-ANCHOR.md
      - .azoth/research/personal-harness-os-context-map.yaml#authority_model
