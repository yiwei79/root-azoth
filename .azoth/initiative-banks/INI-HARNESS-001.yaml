local_findings:
  - finding_id: lf-harness-001-001
    status: active
    summary: >
      The existing azoth-lite classifier already detects side-effect heaviness,
      but its profile names are implementation-centric and not sufficient for
      daily personal use.
    evidence_refs:
      - scripts/azoth_lite.py
      - tests/test_azoth_lite_classifier.py
  - finding_id: lf-harness-001-002
    status: active
    summary: >
      T-059 already defines the guide/assisted/managed/governed_autonomy mode
      matrix and cockpit readback contract, so the Personal Harness OS should
      reuse that contract instead of inventing a second ladder.
    evidence_refs:
      - .azoth/research/t-059-deployment-readiness-mode-matrix.yaml
