assumptions:
  - assumption_id: asm-harness-001-001
    status: active
    statement: >
      The operator prefers a cockpit-centered daily flow, but root-azoth should
      not mutate the cockpit repository until explicitly authorized.
    validation_path: Cockpit integration remains a follow-on slice.
contradictions:
  - contradiction_id: cx-harness-001-001
    status: monitored
    summary: >
      Personal convenience pushes toward automatic state and cross-repo action,
      while Azoth authority requires explicit receipts and gates.
    resolution: >
      Let HarnessProfile automate mode selection, but let RouteCapsule name the
      authority plane and stop reason before any protected mutation.
