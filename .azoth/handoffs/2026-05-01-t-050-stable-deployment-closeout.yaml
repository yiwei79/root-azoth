residual_risks:
- The stable closeout is local-root evidence only; it does not create remote backup
  resilience for root-azoth, personal-root, or private receipts.
- The T-049 project profile remains pointer-only and can become stale if the pilot
  project path, branch, or remote tracking changes.
- Public azoth release readiness still needs a release-specific gate and full release
  validation before any tag, publish, or consumer update.
- Future source onboarding, recall, graph, or vector work must prove access controls,
  provenance, and evaluation before touching private project content.
