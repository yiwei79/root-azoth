meta:
  session_id: 2026-04-29-knowledge-deployment-dfa
  wave_a: "External research across delivery metrics, GitOps, provenance, RAG, GraphRAG, and AI knowledge safety."
  wave_b: "Repo-local explorer wave across proposal conventions, personal knowledge/deployment surfaces, and lifecycle safeguards."
