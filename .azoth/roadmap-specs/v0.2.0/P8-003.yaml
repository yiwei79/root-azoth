# Roadmap task spec — v0.2.0
id: P8-003
roadmap_version: v0.2.0
title: "Pipeline composition linter"
decision_ref: [D28]

intent: >
  pipelines/*.pipeline.yaml stay structurally valid and reference real stage_ids / archetypes
  before humans rely on them for /auto composition.

problem: >
  Declarative YAML and execution in markdown can drift; typos surface only at runtime.

scope:
  - scripts/pipeline_lint.py (or extend existing validator)
  - CI or pytest invoking lint on pipelines/
  - Authoritative developer note: docs/AZOTH_ARCHITECTURE.md (preflight) or CLAUDE.md Development Workflow — one sentence minimum

non_goals:
  - Proving behavioral equivalence of LLM routing vs YAML (semantic lint)

acceptance:
  - Non-zero exit on malformed pipeline file
  - pytest covers happy path + one failure fixture
  - docs/AZOTH_ARCHITECTURE.md mentions pipeline lint in developer workflow or preflight (one line)

dependencies: []

delivery:
  target_layer: infrastructure
  delivery_pipeline: standard
  suggested_command: /deliver

elasticity: >
  Start with structural checks; add optional rules (e.g. every review stage maps to reviewer) behind flags.
