  release_evidence_ref: .azoth/roadmap-specs/v0.2.0/V0.2.0-STABLE-PUBLICATION-EVIDENCE.md
freshness:
  status: intentionally_stale
  checked_at: '2026-05-03'
  published_release_is_authority: true
  root_workshop_drift_is_advisory_only: true
  rationale: >-
    Public azoth v0.2.0 remains the latest approved/installable release. Root
    now contains post-stable cockpit deployment repairs, automation audit bundle
    evidence, recall-quality evaluation and adoption work, and roadmap narrative
    reconciliation that has not been extracted or published. That root workshop
    drift must be described as advisory only until a fresh public release gate
    synchronizes it.
  allowed_drift_since:
  - T-050 through T-055 personal cockpit deployment and UX evidence
  - T-056 nightly automation audit bundle and approval contract
  - T-057 M3 recall quality eval harness and deterministic default scorer
  - T-058 context-recall scorer adoption path
  next_public_sync_gate: >-
    Before claiming public azoth is current with root, run a fresh extraction,
    product smoke, public checkout sync, public commit/tag/release approval, and
    update this policy to status=fresh with the current root evidence commit.
claim_rule: >-
  Release-facing surfaces must say public azoth v0.2.0 is the latest approved
  installable release and root workshop drift is advisory, or run this check with
  --require-fresh after a new public synchronization gate. Do not claim root
  workshop HEAD is public release content while this policy is intentionally_stale.
