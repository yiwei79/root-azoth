id: T-008
roadmap_version: v0.2.0
title: Minimal bounded research sufficiency gate
decision_ref:
- D23
- D44
- D45
- D46
- D52
intent: >
  Add the first bounded durable contract on governed gate files so governed
  pipeline progression and governed write-enable fail closed when the session
  has declared that current external evidence is required.
problem: >
  Azoth already treats governed gate files as the mechanical stop layer, but
  they do not yet carry a durable research contract. That means the system still
  relies too much on orchestration judgment and prompt wording to remember that
  current external evidence was required for the run.
scope:
- "Define additive governed `pipeline-gate.json` fields for `research_required` and bounded repo-local evidence metadata for the current session"
- "Validate the governed research contract in `scripts/check_gates.py` before governed pipeline progression"
- "Enforce the same governed research contract in `.claude/hooks/scope_gate_core.py` before governed write or edit operations"
- "Add bounded regression coverage for missing, malformed, or non-local governed evidence metadata and for governed local-only allow paths"
non_goals:
- "Designing the full reusable research-bank or capsule-bank model"
- "Introducing a strict global domain allowlist as the main control"
- "Hardening every downstream platform/workflow surface in the same slice"
- "Judging evidence freshness, sufficiency, coverage, or reuse heuristics in this slice"
- "Classifying arbitrary local-only goals outside the named governed gate surfaces"
acceptance:
- "Governed `pipeline-gate.json` carries the bounded research contract needed for this slice"
- "When `research_required` is false, governed local-only runs continue through the existing allow path"
- "When `research_required` is true, missing, malformed, or non-local evidence metadata blocks governed pipeline progression and governed write or edit enablement"
- "Tests prove the bounded contract is enforced without claiming broader analysis-time or reusable-capsule behavior"
dependencies: []
delivery:
  target_layer: M1
  delivery_pipeline: governed
  suggested_command: /deliver-full
elasticity: >
  Phase 1 = durable governed gate contract plus validator and write-enable
  enforcement. Phase 2 = richer freshness, sufficiency, and reusable evidence
  policy in T-009 once the first stop layer is proven in real sessions.
