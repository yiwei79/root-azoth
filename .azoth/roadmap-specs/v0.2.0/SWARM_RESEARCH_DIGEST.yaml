consensus_themes:
  - id: durability
    contributing_packs: [RP-A]
    summary: >
      Durable execution separates persisted checkpoints/event history from replay semantics;
      side effects need idempotency keys and explicit activity boundaries (Temporal, LangGraph, Dapr).
      Maps to Azoth D21 (subagent/Task isolation) and D50 (scope-gate as session checkpoint).
  - id: declarative_orchestration
    contributing_packs: [RP-A, RP-B]
    summary: >
      Tool-based handoffs + declarative YAML workflows (vendor agent frameworks) complement
      prose commands; canonical data reduces drift if linked from markdown (D23, D28 — P1-002).
  - id: multi_eval_independence
    contributing_packs: [RP-C]
    summary: >
      Correlated LLM errors weaken naive majority vote; prefer diverse judges, structured
      disagreement, audit-style aggregation over raw consensus (aligns with BL-012 handoffs, D46 mirrors).
  - id: memory_elasticity
    contributing_packs: [RP-D]
    summary: >
      Relevance filter + utility/decay/access signals beat pure semantic retrieval; Azoth’s
      recency + reinforcement_count aligns partially; outcome-linked utility needs HITL (D11, D45 — P1-007).
  - id: inference_efficiency
    contributing_packs: [RP-E]
    summary: >
      Provider prompt caching rewards static prefixes + minimal volatile suffix; BL-012 stage
      boundaries are compaction points; parallel eval and speculative tools trade cost, latency,
      and safety (D21, D23, D44, D46 — P1-011).
  - id: closeout_efficiency
    contributing_packs: [RP-F]
    summary: >
      Session closeout currently pays for both prompt-surface verbosity and implementation drift:
      W3 and PR-review guidance are over-expanded in the command text, while `scripts/do_closeout.py`
      misses documented W2 responsibilities and repeats artifact reads. The net effect is higher
      token cost, stale-mirror risk, and incomplete end-of-session state updates (P1-006, P1-011).

