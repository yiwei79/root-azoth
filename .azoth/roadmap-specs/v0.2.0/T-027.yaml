id: T-027
roadmap_version: v0.2.0
title: Initiative lifecycle evaluator and discoverability spine
decision_ref:
- D11
- D23
- D48
- D50
- D52
intent: >
  Implement a read-only initiative lifecycle and discoverability report for
  INI-AUTO-001.
problem: >
  Initiative lifecycle evidence is spread across initiative banks, proposals,
  roadmap, backlog, specs, readiness reports, evaluator evidence, campaign reports,
  gates, and write-claim state, making fresh-session continuation too easy to
  misread.
scope:
- Add a deterministic read-only lifecycle/discoverability report surface.
- Reconcile initiative banks, proposal refs, candidate slices, hydrated task refs, readiness, evaluator evidence, campaign reports, gates, write claims, protected gates, blockers, and safe next actions.
- Distinguish planning evidence from executable roadmap/backlog/spec tasks.
- Show why completed hydrated tasks such as T-026 cannot authorize hidden continuation or repeat hydration.
non_goals:
- Do not mutate planning state from the report command.
- Do not replace /next, roadmap_scaffold.py, planning_bank_validate.py, or autonomous_loop.py route authority.
- Do not create a daemon, scheduler, hidden continuation path, or repeated wakeup loop.
- Do not repeat hydration for T-026 or any completed candidate.
acceptance:
- The report lists initiative banks, proposal refs, candidate slice states, hydrated task refs, completed-vs-active distinctions, readiness status, blockers, and safe next actions.
- The report distinguishes planning evidence from executable backlog/roadmap tasks.
- Residual risks, evaluator evidence status, route decisions, active gates, write claims, and protected gates are visible.
- The report shows why completed hydrated tasks such as T-026 cannot silently authorize continuation or repeat hydration.
- The report is deterministic and useful to a fresh chat session.
dependencies:
- T-023
- T-024
- T-026
delivery:
  target_layer: infrastructure
  delivery_pipeline: standard
  suggested_command: /auto
elasticity: Phase 1 = replace placeholder sections with concrete scope. Phase 2 =
  refine acceptance and follow-on slices once the task is approved.
source_bank_ref: .azoth/initiative-banks/INI-AUTO-001.yaml
candidate_slice_ref: slice-auto-001-e
