# Azoth Semantic Memory (M2)
# Promoted from M3 episodes via Promotion Rubric
patterns:
  - id: docs-first-implementation-deferred
    approved: true
    approved_date: "2026-04-05"
    reinforced_by: [ep-025, ep-026, ep-032]
    trigger: any session that surfaces a new architectural gap or capability need
    summary: >
      When a session reveals an architectural gap or insight, the correct response
      is to fix the architecture doc and add a roadmap task. Do NOT implement in
      the same session. Implementation belongs in a dedicated dev session with full
      scope and clean context.
    why_it_matters: >
      The pressure to "implement while the context is hot" is real but leads to
      scope creep, half-finished features, and governance bypasses. Both ep-025
      and ep-026 showed that restraint — docs-only sessions followed by dedicated
      implementation sessions — produces cleaner, more reviewable work.
    how_to_apply: >
      At the moment a session tempts implementation of a newly discovered gap,
      stop. Write the decision. Add the roadmap task. Close the session. The
      next session starts fresh with full scope defined.

  - id: mechanical-enforcement-over-memory
    approved: true
    approved_date: "2026-04-05"
    reinforced_by: [ep-022, ep-028, ep-029, ep-031]
    trigger: any behavioral rule that must hold under forward momentum or time pressure
    summary: >
      Memory-only encoding is insufficient for high-frequency, high-momentum
      behavioral rules. A rule encoded only in agent memory (M3 episodes,
      feedback files) will be bypassed when the agent is in a forward-moving
      state. The fix class is mechanical enforcement: move the rule from
      agent memory (driftable) to tool execution (deterministic) via hooks,
      gates, or preflight checks.
    why_it_matters: >
      The "confirm before building" rule was violated three times in sequence
      (ep-022, ep-028, ep-029) despite being encoded and re-encoded in memory
      after each violation. The fourth episode (ep-031) established that the
      pattern is systemic, not accidental. The lesson generalizes: any rule
      that must survive context drift and forward momentum pressure needs a
      mechanical layer, not just a remembered one.
    how_to_apply: >
      When a behavioral rule has been violated 2+ times despite memory
      encoding, do not update the memory again. Instead, design a mechanical
      enforcement layer: a PreToolUse hook, a preflight gate, a scope-gate
      file, or a required /plan step. The memory can still exist as context,
      but the gate must be deterministic. Target layer for the gate: M1
      (kernel/settings/hooks), delivered via /deliver-full.

  - id: auto-pipeline-reviewer-as-safety-net
    approved: true
    approved_date: "2026-04-05"
    extended_date: "2026-04-06"
    reinforced_by: [ep-034, ep-036, ep-039, ep-041, ep-044]
    trigger: any auto-pipeline run where evaluator passes but output touches logic, governance, or multi-file changes
    summary: >
      In the auto-pipeline, the reviewer stage consistently catches failures
      that the evaluator misses. The evaluator checks criteria coverage and
      scoring; the reviewer applies adversarial scrutiny to edge cases,
      pre-existing failures, and unintended scope changes. Both stages are
      load-bearing — removing either degrades the quality gate. Critically,
      the reviewer's value derives from fresh context: a reviewer sharing
      context with the author is structurally weaker and cannot catch blind
      spots invisible to the author.
    why_it_matters: >
      ep-034: evaluator passed, reviewer caught 2 CRITICAL bugs (naive datetime
      comparison, Z-suffix rejection on Python <3.11). ep-036: evaluator passed,
      reviewer caught 3 stale DAY0_TUTORIAL references. ep-039: governance and
      architect stages that shared context with the content they critiqued
      missed blind spots only visible from fresh context. ep-041: "Gate: agent"
      language in a skill is not self-enforcing — stages collapsed inline when
      Agent() invocation was not explicitly mandated. ep-044: fresh-context
      reviewer caught a Stage 5 role-capability mismatch (reviewer→builder) that
      inline review would have missed entirely. Pattern held across five
      independent sessions and different failure classes.
    how_to_apply: >
      Always include both evaluator and reviewer stages when the pipeline
      touches logic, governance files, or more than ~5 files. Never collapse
      them into a single "review" stage — they operate at different levels of
      abstraction. Invoke review stages as separate subagents (not inline):
      descriptive gate language ("Gate: agent") is insufficient — only explicit
      Agent() invocation mandates create the mechanical guarantee of context
      isolation. If a reviewer finds issues, loop the builder back before
      architect review. BL-006 and BL-008 delivered the M1 implementation of
      this principle (subagent-router skill + pipeline Agent() mandates).

  - id: memory-requires-read-back-mechanism
    approved: true
    approved_date: "2026-04-06"
    reinforced_by: [ep-032, ep-038]
    trigger: any session designing or auditing a memory or knowledge-accumulation subsystem
    summary: >
      A memory subsystem that only writes (M3 accumulates episodes, M2 grows
      patterns) but has no read-back into session selection creates a write-only
      sink. Insights accumulate but never drive behavior change. The fix is an
      explicit bridge artifact (backlog.yaml) plus a session-planning step (/next)
      that reads from M2 + backlog together. Without this, the memory pipeline is
      information-complete but action-incomplete.
    why_it_matters: >
      ep-032: root cause session revealed that M3/M2 were write-only paths — after
      months of episodes and patterns accumulating, none of them were feeding back
      into which session to run next. The closed-loop design (inbox → intake →
      M3/M2 + backlog.yaml → /next → scope-gate) was required to make memory
      actionable. ep-038: in-practice validation confirmed the closed loop works;
      the /next + backlog.yaml integration is load-bearing and the deliver-full
      auto-trigger for M1 items is a direct product of the read-back path existing.
    how_to_apply: >
      When designing or evaluating a memory system, ask: does every write path
      have a corresponding read path that feeds into action selection? Accumulation
      without consumption is waste. Concretely: M3 episodes must feed M2 via
      /promote; M2 patterns plus backlog items must feed /next; /next must produce
      a scope card that gates execution. Any break in this chain means insights
      exist but cannot change behavior. Apply this audit to any AI workflow that
      maintains state across sessions.

  - id: instruction-effect-labels-visibility
    approved: true
    approved_date: "2026-04-07"
    reinforced_by: [ep-064]
    trigger: authoring or editing slash commands, Cursor rules, or user prompts that may invoke Write/Edit
    summary: >
      Any instruction surface that can trigger a build (Write/Edit / builder path)
      must declare it explicitly. Slash commands use YAML frontmatter
      `azoth_effect: read | write | mixed` (normative in kernel/GOVERNANCE.md).
      Read = default flow does not write to the repo; write = implementation may run;
      mixed = writes only after explicit human approval (e.g. scope card). Other
      prompts may use a visible line `**Azoth effect:** read|write|mixed`. Drift
      tests enforce the frontmatter on every `.claude/commands/*.md` file.
    why_it_matters: >
      Humans and agents cannot safely choose tools or gates if "planning" and
      "shipping" prompts look the same. Hiding implementation behind read-only
      wording caused pipeline bypass (ep-063). Labeled effects align with trust
      contract entropy awareness and scope-gate expectations.
    how_to_apply: >
      When adding or changing a slash command, set `azoth_effect` immediately.
      When writing a custom prompt or skill without frontmatter, add the one-line
      Azoth effect line. Run `pytest tests/test_azoth_commands_effect.py` after
      command edits. After changing the governance rule, run `azoth-deploy.py`.

  - id: sibling-artifact-audit-after-structural-fix
    approved: true
    approved_date: "2026-04-07"
    reinforced_by: [ep-039, ep-041, ep-042]
    trigger: after fixing a structural flaw in one pipeline command, skill, or template among related siblings
    summary: >
      When a structural flaw is fixed in one place (e.g. inline pipeline stages, missing
      Agent/subagent mandates), the same flaw often exists in sibling commands or artifacts.
      Narrow single-site fixes create repeated backlog items and governance debt. Before
      closeout, audit same-class siblings and apply the fix class everywhere it applies.
    why_it_matters: >
      ep-039: inline /deliver-full stages shared context with authored content; ep-041: BL-006
      closed the gap for /deliver-full but not /deliver, forcing BL-008; ep-042: explicit
      lesson to audit siblings when a structural flaw is fixed in one pipeline artifact.
    how_to_apply: >
      After changing one of /deliver, /deliver-full, /auto, or a shared pipeline skill,
      list peer artifacts and ask whether the same rule applies. Prefer one routing policy
      (e.g. subagent-router) over duplicated per-command patches.

  - id: memory-authoring-quality-rules
    approved: true
    approved_date: "2026-04-07"
    reinforced_by: [ep-019, ep-020]
    trigger: capturing user preferences or feedback as durable memory (remember skill, M3, feedback files)
    summary: >
      Narrow scoping ("do not do X only in context Y" when the user meant "do not do X
      everywhere"), invented carve-outs the user never stated, and failing to record that
      user preference overrides platform defaults all produce memories that look correct
      but reinforce wrong behavior.
    why_it_matters: >
      ep-019: Co-Authored-By feedback memory was narrowly scoped with a false carve-out;
      ep-020: named three anti-patterns for the remember skill. Rubric D (3+ sessions) is
      borderline for this pattern; treat as maturing until a third independent reinforcement.
    how_to_apply: >
      Default to the broader interpretation of user preference. Do not add exceptions unless
      the user stated them. When preference conflicts with platform defaults, state the
      conflict and that user preference wins. Long-term procedural home: skills/remember
      (M2→M1 when promoted with backlog + /deliver-full).

  - id: standard-delivery-not-exempt-for-markdown
    approved: true
    approved_date: "2026-04-07"
    reinforced_by: [ep-063, ep-041]
    trigger: backlog item uses delivery_pipeline standard or deliverable is mostly markdown/docs but still repo-changing
    summary: >
      Items routed to the standard delivery path still require that path's semantics:
      staged pipeline (e.g. /deliver), Task or Agent per subagent-router, typed stage
      summaries where BL-011/BL-012 apply — not ad-hoc inline implementation in the
      orchestrator. "Docs-only" or README work is not an exemption from isolation and
      review gates when the backlog says standard delivery.
    why_it_matters: >
      ep-063: P4-001 README was implemented inline without /deliver, violating D21-style
      isolation despite delivery_pipeline standard. ep-041: related class of failure —
      pipeline stages collapsed inline so review gates did not hold. Human approved M2
      promotion with primary evidence ep-063; ep-041 reinforces the same governance class.
    how_to_apply: >
      Before building, read the backlog row's delivery_pipeline and the command referenced
      by deliver.md / subagent-router. If it says standard (or governed), run that pipeline
      with separate stages; do not rationalize away gates because the artifact is markdown.
      Cursor: use Task per stage with prior_stage_summaries per claude-code-parity.

  - id: evaluator-subagent-agentic-eval-skill
    approved: true
    approved_date: "2026-04-07"
    reinforced_by: [session-2026-04-07-eval-preference]
    trigger: /eval, pipeline evaluator stage, or post-delivery quality gate on code or plans
    summary: >
      Run **evaluation** as an isolated **`Task`** with `subagent_type: evaluator`, not as
      inline rubric prose in the orchestrator thread. **Read** `.agents/skills/agentic-eval/SKILL.md`
      first and apply its rubric, threshold (e.g. 0.85), and structured JSON/YAML handoff per
      BL-012. Do **not** re-spawn evaluator subagents unless the human explicitly asks for
      another evaluation pass; a prior PASS/CONCERNS is not an automatic cue to re-evaluate.
    why_it_matters: >
      Preserves review isolation (D21), spawn discipline (BL-011), and skill-bound scoring
      instead of ad-hoc judgment. Volunteering repeated evaluator runs wastes tokens and
      confuses orchestration with quality gates.
    how_to_apply: >
      On eval: Task(evaluator) with spawn YAML + Read targets for agentic-eval SKILL and
      artifacts under review; forward prior_stage_summaries when the skill requires upstream
      context. After one evaluator return, stop unless the human says to re-run eval or a
      new artifact materially changes the scope.

  - id: pipeline-declaration-before-execution
    approved: true
    approved_date: "2026-04-13"
    reinforced_by: [ep-176]
    trigger: any pipeline invocation (/auto, /deliver, /deliver-full, /dynamic-full-auto) or multi-stage goal
    summary: >
      Always declare and present the full pipeline design for human approval before
      proceeding to any stage. The Declaration is the contract; execution follows
      approval. Goal is end-to-end "vibe coding" with predictable behavior — no
      surprise stages, no implicit scope changes, no extra worrying elements. The
      human should be able to see exactly what will happen, approve it, and then
      trust that the pipeline executes as declared without deviation.
    why_it_matters: >
      Predictability is the foundation of trust in autonomous pipelines. If the
      agent starts executing stages before the human has approved the pipeline
      design, it introduces anxiety about what's happening, which defeats the
      purpose of the trust contract. The human wants to "vibe code" — focus on
      the goal, not monitor every move. That requires upfront clarity about the
      plan, not mid-flight surprises.
    how_to_apply: >
      Before any pipeline stage runs: (1) classify the goal, (2) compose the
      pipeline stages with agents, gates, and skills, (3) present the full
      Declaration to the human with [approve / adjust / abort], (4) wait for
      explicit approval. Only then write gate files and begin execution.
      Informational declarations (auto-proceed) are acceptable only for the
      lightest pipelines (docs, simple cosmetic). When in doubt, use the full
      interactive Declaration.

  - id: platform-command-parity-prefers-native-discoverability
    approved: true
    approved_date: "2026-04-13"
    reinforced_by: [ep-026, ep-150, ep-177, ep-178]
    trigger: adding or auditing Azoth support for a harness that lacks native repo command registration or uses a different command UX
    summary: >
      Platform parity must project Azoth workflows into the target platform's
      discoverable native surface first. Invisible fallback routing is not
      enough. For Codex, the correct primary surface is generated
      `.agents/skills/azoth-*` wrappers plus `agents/openai.yaml` UI metadata
      exposed through `/skills`; literal `/auto`-style prompt tokens are
      compatibility fallback only.
    why_it_matters: >
      ep-026 established that platform compatibility is a projection problem,
      not a copy-files problem. ep-150 showed that parity audits fail when one
      deployed platform surface is omitted. ep-177 confirmed the first Codex
      adapter pass had functional routing but still felt "not compatible at all"
      because no discoverable command surface existed. Users judge parity
      through the platform UX they can actually see, not through hidden fallback
      behavior.
    how_to_apply: >
      When adding or auditing a platform adapter, separate two questions:
      (1) what is the platform's documented discoverable surface for workflows,
      and (2) what fallback routing exists if that surface is absent? Implement
      both, but document the discoverable surface as primary. For Codex:
      regenerate `.agents/skills/azoth-*`, `.codex/config.toml`, and
      `.codex/hooks.json` via `python3 scripts/azoth-deploy.py`; tell users to
      use `/skills` or `$azoth-auto` / `$azoth-next`; keep any literal-token
      fallback narrow, repo-root aware, and limited to intentional leading
      invocations; never claim native repo-defined slash-command support unless
      Codex officially adds it.

  - id: blast-radius-includes-all-downstream-surfaces
    approved: true
    approved_date: "2026-04-13"
    reinforced_by: [ep-126]
    trigger: estimating blast radius for any multi-file or schema-driven change
    summary: >
      Blast radius estimation must include ALL downstream derivative surfaces, not
      just the primary authoring location. For Azoth this means: schema validators
      (pipeline.schema.yaml), linters (pipeline_lint.py), agent definitions that
      reference enums, AND all platform mirrors generated by azoth-deploy.py.
      Underestimating blast radius leads to partial updates that pass tests
      individually but break consistency across the deployed system.
    why_it_matters: >
      ep-126: initial blast radius for an enum addition was estimated as 4 files;
      the actual count was 13+, including pipeline.schema.yaml, pipeline_lint.py,
      and every platform mirror. The reviewer caught the gap only because blast
      radius was explicitly re-audited. A 0.90 evaluator threshold (vs 0.85)
      caught 4 concrete completeness gaps that 0.85 would have passed. Cross-file
      consistency tests (assert string X appears in both file A and file B)
      provided lightweight but effective guards against prose/YAML drift.
    how_to_apply: >
      Before estimating scope, enumerate: (1) all files that contain the targeted
      value/enum/reference, (2) all validators and linters that check the same
      constraint, (3) all platform mirrors generated by azoth-deploy.py. Use
      grep_search to discover derivative surfaces before authoring. Write
      cross-file consistency tests for any value that must be kept in sync
      across multiple files. Treat the blast radius as a lower bound until the
      grep sweep is complete.

  - id: status-enum-defensive-set-check
    approved: true
    approved_date: "2026-04-13"
    reinforced_by: [ep-135]
    trigger: any code that reads a YAML/JSON status field written by multiple code paths
    summary: >
      Status enum comparisons must use a set-based check covering all known
      terminal variants, never exact string equality. For Azoth backlog items,
      the canonical terminal status is 'complete' (written by do_closeout.py) but
      manual edits or other tools may write 'completed'. Reading code that checks
      only exact 'complete' will misclassify 'completed' items as active.
    why_it_matters: >
      ep-135: welcome.py's filter_unblocked_items used exact string 'complete';
      3 backlog items written as 'completed' reappeared as available work at the
      next session. Root cause: multiple write paths (do_closeout.py writes
      canonical 'complete'; human editors write 'completed') means readers must
      be defensive. The fix — a _DONE_STATUSES = {'complete', 'completed'} set
      — is a single-line change that prevents the entire class of bug.
    how_to_apply: >
      Whenever writing code that filters on a status field: define a _DONE_STATUSES
      set constant with all known terminal spellings; use `status in _DONE_STATUSES`
      not `status == 'complete'`. Apply this defensively to backlog.yaml, any
      pipeline state file, and any YAML written by more than one code path. When
      normalizing canonical status on write (do_closeout.py), also defensively
      read — the canonical writer cannot guarantee past data is clean.

  - id: adaptive-stage-skip-three-condition-rule
    approved: true
    approved_date: "2026-04-13"
    reinforced_by: [ep-138]
    trigger: orchestrator considering whether to skip a pipeline stage to reduce overhead
    summary: >
      An orchestrator may skip optional pipeline stages (e.g. reviewer, additional
      architect-design) ONLY when all three conditions hold simultaneously:
      (1) planner output contains exact specifications with no ambiguity,
      (2) entropy estimate is GREEN (delta < 12 per Trust Contract §1),
      (3) no deviations detected from the approved scope or classification.
      If any condition fails, all planned stages run. The eval gate (evaluator
      or eval-swarm) is never skippable regardless of conditions.
    why_it_matters: >
      ep-138: orchestrator skipped reviewer and architect-design stages after
      planner returned exact specs with GREEN entropy and no deviations — reduced
      pipeline overhead while eval-swarm still validated correctness. P1-018
      pre-commit hook caught 2 stale platform mirrors that would have been missed
      without enforcement. The skip was legitimate because all three conditions
      held; skipping when any condition is absent risks silent quality degradation.
    how_to_apply: >
      At each optional stage boundary, evaluate all three conditions explicitly.
      Log the skip decision and rationale in the alignment summary so the human
      can see what was omitted and why. Do NOT skip the evaluator or eval-swarm
      gate under any conditions — adaptive skip applies only to stages where the
      planner's output makes the stage provably redundant. When in doubt, run the
      stage; the cost of an unnecessary stage is low compared to the cost of a
      missed defect.

  - id: scaffold-only-paths-require-explicit-product-exclusion
    approved: true
    approved_date: "2026-04-13"
    reinforced_by: [ep-151]
    trigger: authoring or auditing sync-config.yaml product extraction profiles, or before any public product extraction run
    summary: >
      Any file tree that belongs exclusively to the scaffold (development workshop)
      and should NOT ship to consumers must be explicitly listed in
      sync-config.yaml exclude_paths. Omitting a scaffold-only path causes it to
      ship verbatim to public product consumers, violating D42. For Azoth:
      kernel/templates/ contains raw adapter templates (Cursor *.mdc.template,
      CLAUDE.md.template, settings.json.template) that consumers receive via
      installer paths (.azoth/kernel/), not as raw scaffold source trees.
    why_it_matters: >
      ep-151: sync-config.yaml did not include kernel/templates/ in exclude_paths.
      D42 states consumers receive .azoth/kernel/ via install, not raw scaffold
      templates. If product extraction ran with this gap, the full template tree
      would ship verbatim, exposing scaffold-internals and violating the D42
      path-duality contract. BL-042 tracks the concrete fix.
    how_to_apply: >
      Before any product extraction run (D35, D38): audit sync-config.yaml
      exclude_paths against the D42 path-duality table (docs/AZOTH_ARCHITECTURE.md
      §18). Scaffold-only paths to verify are excluded: kernel/templates/,
      research_*/,  .azoth/ runtime state, .claude/hooks/ (unless intentionally
      shipped). After adding any new scaffold-only directory, update exclude_paths
      in the same session before closeout. Test with a dry-run extraction before
      the first public release.

  - id: backlog-status-update-is-mandatory-at-closeout
    approved: true
    approved_date: "2026-04-13"
    reinforced_by: [ep-158]
    trigger: session closeout after any delivery session
    summary: >
      Backlog item status must be explicitly updated to 'complete' in
      .azoth/backlog.yaml during session closeout, BEFORE the scope gate is
      closed. Omitting this step causes the delivered item to reappear as active
      work at the next session's /next, wasting a routing cycle and undermining
      the closed workflow loop (D47).
    why_it_matters: >
      ep-158: BL-027 was delivered and file change confirmed live, but backlog.yaml
      status was never updated from 'active' to 'complete' at closeout. At the
      next session, /next surfaced BL-027 as available work — the human had to
      manually correct the stale state. The delivery was real; the closeout was
      incomplete. The closed loop from D47 depends on every delivered item being
      marked complete before the gate closes.
    how_to_apply: >
      At closeout, BEFORE W2 (closing scope-gate.json), update backlog.yaml:
      set status: complete on every item delivered this session. If do_closeout.py
      is used, verify it writes canonical 'complete' (not 'completed'). Run a
      grep to confirm the status change before committing. The canonical write
      path (do_closeout.py) is authoritative; manual edits should mirror it.
      This is checklist item #1 in the closeout-gotchas repo memory.

  - id: w3-mirror-required-from-all-platforms
    approved: true
    approved_date: "2026-04-13"
    reinforced_by: [ep-160]
    trigger: any session closeout, regardless of IDE/platform
    summary: >
      W3 (Claude Code project memory mirror: ~/.claude/projects/<key>/memory/)
      is a required closeout step from ALL platforms — not only Claude Code.
      Copilot, Cursor, OpenCode, and Codex must all attempt W3 on closeout;
      if filesystem access is unavailable, log "W3 deferred — <reason>" rather
      than silently skipping. W2 (repo-local .azoth/bootloader-state.md +
      scope-gate.json) is the authoritative record; W3 is the cross-IDE
      mirror that keeps Claude Code sessions current.
    why_it_matters: >
      ep-160: Copilot closeout completed W1/W2/W4 but skipped W3, leaving the
      Claude Code project memory stale and git commits uncommitted. Subsequent
      Claude Code sessions started cold with the wrong project_status.md,
      requiring manual resync. The architectural requirement (AZOTH_ARCHITECTURE.md
      §7 W3 row) applies to all platforms; each platform's native limitations
      affect HOW W3 is attempted, not WHETHER it is attempted.
    how_to_apply: >
      At every session closeout: (1) attempt W3 write to
      ~/.claude/projects/-Users-<user>-<repo>/memory/project_status.md with the
      current version, active backlog, and last episode summary; (2) if the write
      fails or the path is inaccessible, append "W3 deferred — <platform>: <reason>"
      to the session episode; (3) commit all closeout artifacts in the same git
      session — uncommitted closeout state is invisible to other platforms.
      W3 content format: title, last_updated, current_version, active_phase,
      last_session summary, next_priority from backlog.

  - id: control-plane-needs-real-time-claims-and-durable-status
    approved: true
    approved_date: "2026-04-17"
    reinforced_by: [ep-158, ep-184, ep-193, ep-215]
    trigger: any change to /next, scope selection, backlog claiming, or closeout status write-back
    summary: >
      Azoth control-plane state cannot rely on a single surface. Real-time
      ownership belongs in run-ledger.local.yaml (claim registry), while durable
      planning state belongs in backlog.yaml and scope-gate.json. Candidate
      selection must cross-check both. If either side is omitted, stale or
      lagging state resurfaces claimed or completed work as available.
    why_it_matters: >
      ep-158 showed a delivered item resurfacing because backlog completion was
      never written back. ep-184 and ep-193 reinforced the same stale-open
      failure class through review findings. ep-215 validated the fix shape:
      a three-layer defense of run-ledger cross-check, status:active exclusion,
      and approval-time write-back. The pattern is specific to Azoth's
      multi-surface session control plane, but it is now proven and actionable.
    how_to_apply: >
      Whenever scope selection or completion logic changes, audit all three
      surfaces together: (1) run-ledger.local.yaml for live claims, (2)
      backlog.yaml for durable task state, and (3) scope-gate.json for current
      intent. /next must exclude items claimed in either the ledger or backlog,
      and closeout must write backlog completion before the scope closes. Treat
      any one-surface fix as incomplete until the other two surfaces are checked
      and regression-tested.

  - id: platform-parity-needs-mechanical-mirrors-and-tests
    approved: true
    approved_date: "2026-04-17"
    reinforced_by: [ep-150, ep-177, ep-178, ep-202]
    trigger: any canonical command, hook, adapter, or instruction-surface change that projects to multiple platforms
    summary: >
      In Azoth, platform parity is not preserved by intention alone. When a
      canonical contract changes, every generated or parallel platform surface
      must be updated in the same slice and the propagation boundary must be
      locked by regression tests. Otherwise one platform silently lags while the
      source looks correct.
    why_it_matters: >
      ep-150 showed Cursor missing eval-swarm escalation routing because the
      template coverage was incomplete. ep-177 and ep-178 exposed the same class
      for Codex command discovery and parity wiring. ep-202 reinforced that
      repeated runtime failures are a signal to add mechanical hardening rather
      than trusting future manual sync. The repeated failure mode is structural:
      mirror drift persists until tests and deploy paths encode the boundary.
    how_to_apply: >
      For any canonical instruction or hook change, identify the full mirror set
      before editing. Update every affected surface in the same session, run the
      relevant deploy or projection step, and add or update parity tests that
      fail if one platform is omitted. If a field intentionally does not
      propagate, encode that boundary explicitly in tests or documentation so
      future sessions do not assume silent parity.
