# Azoth Semantic Memory (M2)
# Promoted from M3 episodes via Promotion Rubric
patterns:
  - id: docs-first-implementation-deferred
    approved: true
    approved_date: "2026-04-05"
    reinforced_by: [ep-025, ep-026, ep-032]
    trigger: any session that surfaces a new architectural gap or capability need
    summary: >
      When a session reveals an architectural gap or insight, the correct response
      is to fix the architecture doc and add a roadmap task. Do NOT implement in
      the same session. Implementation belongs in a dedicated dev session with full
      scope and clean context.
    why_it_matters: >
      The pressure to "implement while the context is hot" is real but leads to
      scope creep, half-finished features, and governance bypasses. Both ep-025
      and ep-026 showed that restraint — docs-only sessions followed by dedicated
      implementation sessions — produces cleaner, more reviewable work.
    how_to_apply: >
      At the moment a session tempts implementation of a newly discovered gap,
      stop. Write the decision. Add the roadmap task. Close the session. The
      next session starts fresh with full scope defined.

  - id: mechanical-enforcement-over-memory
    approved: true
    approved_date: "2026-04-05"
    reinforced_by: [ep-022, ep-028, ep-029, ep-031]
    trigger: any behavioral rule that must hold under forward momentum or time pressure
    summary: >
      Memory-only encoding is insufficient for high-frequency, high-momentum
      behavioral rules. A rule encoded only in agent memory (M3 episodes,
      feedback files) will be bypassed when the agent is in a forward-moving
      state. The fix class is mechanical enforcement: move the rule from
      agent memory (driftable) to tool execution (deterministic) via hooks,
      gates, or preflight checks.
    why_it_matters: >
      The "confirm before building" rule was violated three times in sequence
      (ep-022, ep-028, ep-029) despite being encoded and re-encoded in memory
      after each violation. The fourth episode (ep-031) established that the
      pattern is systemic, not accidental. The lesson generalizes: any rule
      that must survive context drift and forward momentum pressure needs a
      mechanical layer, not just a remembered one.
    how_to_apply: >
      When a behavioral rule has been violated 2+ times despite memory
      encoding, do not update the memory again. Instead, design a mechanical
      enforcement layer: a PreToolUse hook, a preflight gate, a scope-gate
      file, or a required /plan step. The memory can still exist as context,
      but the gate must be deterministic. Target layer for the gate: M1
      (kernel/settings/hooks), delivered via /deliver-full.

  - id: auto-pipeline-reviewer-as-safety-net
    approved: true
    approved_date: "2026-04-05"
    extended_date: "2026-04-06"
    reinforced_by: [ep-034, ep-036, ep-039, ep-041, ep-044]
    trigger: any auto-pipeline run where evaluator passes but output touches logic, governance, or multi-file changes
    summary: >
      In the auto-pipeline, the reviewer stage consistently catches failures
      that the evaluator misses. The evaluator checks criteria coverage and
      scoring; the reviewer applies adversarial scrutiny to edge cases,
      pre-existing failures, and unintended scope changes. Both stages are
      load-bearing — removing either degrades the quality gate. Critically,
      the reviewer's value derives from fresh context: a reviewer sharing
      context with the author is structurally weaker and cannot catch blind
      spots invisible to the author.
    why_it_matters: >
      ep-034: evaluator passed, reviewer caught 2 CRITICAL bugs (naive datetime
      comparison, Z-suffix rejection on Python <3.11). ep-036: evaluator passed,
      reviewer caught 3 stale DAY0_TUTORIAL references. ep-039: governance and
      architect stages that shared context with the content they critiqued
      missed blind spots only visible from fresh context. ep-041: "Gate: agent"
      language in a skill is not self-enforcing — stages collapsed inline when
      Agent() invocation was not explicitly mandated. ep-044: fresh-context
      reviewer caught a Stage 5 role-capability mismatch (reviewer→builder) that
      inline review would have missed entirely. Pattern held across five
      independent sessions and different failure classes.
    how_to_apply: >
      Always include both evaluator and reviewer stages when the pipeline
      touches logic, governance files, or more than ~5 files. Never collapse
      them into a single "review" stage — they operate at different levels of
      abstraction. Invoke review stages as separate subagents (not inline):
      descriptive gate language ("Gate: agent") is insufficient — only explicit
      Agent() invocation mandates create the mechanical guarantee of context
      isolation. If a reviewer finds issues, loop the builder back before
      architect review. BL-006 and BL-008 delivered the M1 implementation of
      this principle (subagent-router skill + pipeline Agent() mandates).

  - id: memory-requires-read-back-mechanism
    approved: true
    approved_date: "2026-04-06"
    reinforced_by: [ep-032, ep-038]
    trigger: any session designing or auditing a memory or knowledge-accumulation subsystem
    summary: >
      A memory subsystem that only writes (M3 accumulates episodes, M2 grows
      patterns) but has no read-back into session selection creates a write-only
      sink. Insights accumulate but never drive behavior change. The fix is an
      explicit bridge artifact (backlog.yaml) plus a session-planning step (/next)
      that reads from M2 + backlog together. Without this, the memory pipeline is
      information-complete but action-incomplete.
    why_it_matters: >
      ep-032: root cause session revealed that M3/M2 were write-only paths — after
      months of episodes and patterns accumulating, none of them were feeding back
      into which session to run next. The closed-loop design (inbox → intake →
      M3/M2 + backlog.yaml → /next → scope-gate) was required to make memory
      actionable. ep-038: in-practice validation confirmed the closed loop works;
      the /next + backlog.yaml integration is load-bearing and the deliver-full
      auto-trigger for M1 items is a direct product of the read-back path existing.
    how_to_apply: >
      When designing or evaluating a memory system, ask: does every write path
      have a corresponding read path that feeds into action selection? Accumulation
      without consumption is waste. Concretely: M3 episodes must feed M2 via
      /promote; M2 patterns plus backlog items must feed /next; /next must produce
      a scope card that gates execution. Any break in this chain means insights
      exist but cannot change behavior. Apply this audit to any AI workflow that
      maintains state across sessions.

  - id: instruction-effect-labels-visibility
    approved: true
    approved_date: "2026-04-07"
    reinforced_by: [ep-064]
    trigger: authoring or editing slash commands, Cursor rules, or user prompts that may invoke Write/Edit
    summary: >
      Any instruction surface that can trigger a build (Write/Edit / builder path)
      must declare it explicitly. Slash commands use YAML frontmatter
      `azoth_effect: read | write | mixed` (normative in kernel/GOVERNANCE.md).
      Read = default flow does not write to the repo; write = implementation may run;
      mixed = writes only after explicit human approval (e.g. scope card). Other
      prompts may use a visible line `**Azoth effect:** read|write|mixed`. Drift
      tests enforce the frontmatter on every `.claude/commands/*.md` file.
    why_it_matters: >
      Humans and agents cannot safely choose tools or gates if "planning" and
      "shipping" prompts look the same. Hiding implementation behind read-only
      wording caused pipeline bypass (ep-063). Labeled effects align with trust
      contract entropy awareness and scope-gate expectations.
    how_to_apply: >
      When adding or changing a slash command, set `azoth_effect` immediately.
      When writing a custom prompt or skill without frontmatter, add the one-line
      Azoth effect line. Run `pytest tests/test_azoth_commands_effect.py` after
      command edits. After changing the governance rule, run `azoth-deploy.py`.

  - id: sibling-artifact-audit-after-structural-fix
    approved: true
    approved_date: "2026-04-07"
    reinforced_by: [ep-039, ep-041, ep-042]
    trigger: after fixing a structural flaw in one pipeline command, skill, or template among related siblings
    summary: >
      When a structural flaw is fixed in one place (e.g. inline pipeline stages, missing
      Agent/subagent mandates), the same flaw often exists in sibling commands or artifacts.
      Narrow single-site fixes create repeated backlog items and governance debt. Before
      closeout, audit same-class siblings and apply the fix class everywhere it applies.
    why_it_matters: >
      ep-039: inline /deliver-full stages shared context with authored content; ep-041: BL-006
      closed the gap for /deliver-full but not /deliver, forcing BL-008; ep-042: explicit
      lesson to audit siblings when a structural flaw is fixed in one pipeline artifact.
    how_to_apply: >
      After changing one of /deliver, /deliver-full, /auto, or a shared pipeline skill,
      list peer artifacts and ask whether the same rule applies. Prefer one routing policy
      (e.g. subagent-router) over duplicated per-command patches.

  - id: memory-authoring-quality-rules
    approved: true
    approved_date: "2026-04-07"
    reinforced_by: [ep-019, ep-020]
    trigger: capturing user preferences or feedback as durable memory (remember skill, M3, feedback files)
    summary: >
      Narrow scoping ("do not do X only in context Y" when the user meant "do not do X
      everywhere"), invented carve-outs the user never stated, and failing to record that
      user preference overrides platform defaults all produce memories that look correct
      but reinforce wrong behavior.
    why_it_matters: >
      ep-019: Co-Authored-By feedback memory was narrowly scoped with a false carve-out;
      ep-020: named three anti-patterns for the remember skill. Rubric D (3+ sessions) is
      borderline for this pattern; treat as maturing until a third independent reinforcement.
    how_to_apply: >
      Default to the broader interpretation of user preference. Do not add exceptions unless
      the user stated them. When preference conflicts with platform defaults, state the
      conflict and that user preference wins. Long-term procedural home: skills/remember
      (M2→M1 when promoted with backlog + /deliver-full).

  - id: standard-delivery-not-exempt-for-markdown
    approved: true
    approved_date: "2026-04-07"
    reinforced_by: [ep-063, ep-041]
    trigger: backlog item uses delivery_pipeline standard or deliverable is mostly markdown/docs but still repo-changing
    summary: >
      Items routed to the standard delivery path still require that path's semantics:
      staged pipeline (e.g. /deliver), Task or Agent per subagent-router, typed stage
      summaries where BL-011/BL-012 apply — not ad-hoc inline implementation in the
      orchestrator. "Docs-only" or README work is not an exemption from isolation and
      review gates when the backlog says standard delivery.
    why_it_matters: >
      ep-063: P4-001 README was implemented inline without /deliver, violating D21-style
      isolation despite delivery_pipeline standard. ep-041: related class of failure —
      pipeline stages collapsed inline so review gates did not hold. Human approved M2
      promotion with primary evidence ep-063; ep-041 reinforces the same governance class.
    how_to_apply: >
      Before building, read the backlog row's delivery_pipeline and the command referenced
      by deliver.md / subagent-router. If it says standard (or governed), run that pipeline
      with separate stages; do not rationalize away gates because the artifact is markdown.
      Cursor: use Task per stage with prior_stage_summaries per claude-code-parity.

  - id: evaluator-subagent-agentic-eval-skill
    approved: true
    approved_date: "2026-04-07"
    reinforced_by: [session-2026-04-07-eval-preference]
    trigger: /eval, pipeline evaluator stage, or post-delivery quality gate on code or plans
    summary: >
      Run **evaluation** as an isolated **`Task`** with `subagent_type: evaluator`, not as
      inline rubric prose in the orchestrator thread. **Read** `.agents/skills/agentic-eval/SKILL.md`
      first and apply its rubric, threshold (e.g. 0.85), and structured JSON/YAML handoff per
      BL-012. Do **not** re-spawn evaluator subagents unless the human explicitly asks for
      another evaluation pass; a prior PASS/CONCERNS is not an automatic cue to re-evaluate.
    why_it_matters: >
      Preserves review isolation (D21), spawn discipline (BL-011), and skill-bound scoring
      instead of ad-hoc judgment. Volunteering repeated evaluator runs wastes tokens and
      confuses orchestration with quality gates.
    how_to_apply: >
      On eval: Task(evaluator) with spawn YAML + Read targets for agentic-eval SKILL and
      artifacts under review; forward prior_stage_summaries when the skill requires upstream
      context. After one evaluator return, stop unless the human says to re-run eval or a
      new artifact materially changes the scope.
