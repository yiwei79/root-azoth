    created_date: "2026-04-06"
    decision_ref: D21
    description: >
      /deliver-full currently does not mandate that each pipeline stage is
      executed via Agent(subagent_type=...). Without explicit subagent invocation,
      Claude runs all stages inline in the same context, eliminating context
      isolation and allowing the governance/architect review stages to share
      context with the stages they are supposed to critique independently.
      Update .claude/commands/deliver-full.md to explicitly require subagent
      invocation for each stage (architect, reviewer, planner, evaluator, builder)
      and specify which subagent_type maps to which stage.

  # ── Priority 6: Auto-versioning implementation ──────────────────────────
  - id: BL-009
    title: "Auto-versioning: scripts/version-bump.py + session-closeout + deliver-full integration (D53)"
    source: session-2026-04-06-d53
    target_layer: M1
    delivery_pipeline: governed
    status: complete
    target_version: v0.0.3
