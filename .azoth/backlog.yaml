  # ── Priority 5: Pipeline integrity ──────────────────────────────────────
  - id: BL-008
    title: "Subagent auto-routing policy — when-to-subagent rules integrated into pipeline composition (D21)"
    source: ep-041
    target_layer: M1
    delivery_pipeline: governed
    status: complete
    target_version: v0.0.3
    priority: 5
    created_date: "2026-04-06"
    decision_ref: D21
    description: >
      Instead of hardcoding Agent(subagent_type=...) mandates per pipeline command
      (BL-006 approach), define a general subagent routing policy with four decision
      triggers: (1) context-isolation — review stage must not share context with the
      stage it reviews; (2) review-independence — any gate whose job is to critique
      an artifact must be a fresh subagent; (3) parallel-execution — independent
      research or analysis tasks that can run concurrently; (4) context-budget —
      stages that would consume excessive context in the orchestrator.
      Deliverables: (a) skills/subagent-router/ — routing policy skill that defines
      the four triggers and maps goal classification dimensions to subagent assignments;
      (b) /auto updated — pipeline composition stage uses the router to emit subagent
      assignments automatically after goal classification, so every auto-composed
      pipeline inherits correct subagent behavior; (c) /deliver updated — reference
      the routing policy instead of inline mandates; (d) /deliver-full updated —
      same (BL-006 hardcodes become policy-derived). No per-pipeline audit work
      required for future pipelines — they inherit the policy via /auto composition.

  - id: BL-006
    title: "Enforce subagent invocation per stage in /deliver-full (D21)"
    source: session-2026-04-06
    target_layer: M1
    delivery_pipeline: governed
    status: complete
    target_version: v0.0.3
