- id: BL-011
  title: "Spawn prompt minimization \u2014 pipeline Agent() calls to minimal goal+params\
    \ pattern"
  source: session-2026-04-06-token-opt
  target_layer: M1
  delivery_pipeline: governed
  status: complete
  target_version: v0.0.4
  priority: 1
  created_date: '2026-04-06'
  decision_ref:
  - D21
  - D23
  description: 'Each Agent() subagent spawn currently passes 100-300 line prompts
    that load into the subagent context at turn 0, on top of inherited CLAUDE.md +
    skills. Fix: move subagent-specific context into dedicated skill files (lazy-loaded);
    spawn prompts carry only goal + parameters (~20 lines max). Deliverables: (1)
    pattern documented in skills/subagent-router/ as spawn-prompt convention; (2)
    existing pipeline skills (/auto, /deliver, /deliver-full) updated to follow minimal-spawn
    pattern; (3) example before/after showing token delta. Estimated yield: 500-2,000
    tokens saved per subagent invocation, compounds across every pipeline run.

    '
- id: BL-012
  title: "Typed pipeline stage summary schema \u2014 structured handoffs between stages"
  source: session-2026-04-06-token-opt
  target_layer: M1
  delivery_pipeline: governed
  status: complete
  target_version: v0.0.3.26
  priority: 1
  created_date: '2026-04-06'
  decision_ref:
  - D21
  - D23
  description: "Pipeline stages currently pass full prose reports back to the orchestrator\
    \ (3-8K tokens per stage). Define a typed YAML summary schema (10-15 fields, 200-400\
    \ tokens) that each stage emits instead of prose. Deliverables: (1) pipelines/stage-summary.schema.yaml\
    \ \u2014 typed schema with required/optional fields per stage type (research,\
    \ build, eval, audit); (2) pipeline skills updated to require structured summary\
    \ output from subagents; (3) orchestrator instructions updated to expect and pass\
    \ typed summaries between stages. Estimated yield: 3-8K \u2192 200-400 tokens\
    \ per stage boundary; a 4-stage pipeline saves ~15-25K tokens in orchestrator\
    \ context per run.\n"
