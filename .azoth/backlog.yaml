      fields per stage type (research, build, eval, audit); (2) pipeline skills
      updated to require structured summary output from subagents; (3) orchestrator
      instructions updated to expect and pass typed summaries between stages.
      Estimated yield: 3-8K → 200-400 tokens per stage boundary; a 4-stage pipeline
