  description: 'Cursor (v1.x) has a native toggle — Settings → Rules → "Include third-party
    plugin skills and configs" — that auto-loads CLAUDE.md, .claude/commands/, agents/,
    and skills/ into every Cursor chat. This gives ~90% Claude Code compatibility
    for free. The adapter bridges the remaining gap: M2 memory and cross-IDE session
    handoff. Deliverables: (1) kernel/templates/platform-adapters/cursor/azoth-memory.mdc.template
