  description: 'Fix the failure mode where a governed pipeline is declared, approved,
    and gate-opened, yet the session still returns another stage card or narration
    instead of executing the next downstream non-human stage. Deliverables: (1) introduce
    a durable execution-state transition for governed pipeline approvals so human
    gates are consumed as runtime state, not only as conversational acknowledgements;
    (2) require immediate advancement into the next eligible non-human stage once
    the corresponding approval is present; (3) align orchestrator/runtime behavior
    across `/auto`, `/deliver`, and `/deliver-full` so stage progression cannot satisfy
    itself with declarative status output alone; (4) add regression coverage for
    the exact failure class: after pipeline approval and architect approval, the
    session must proceed into real planner/test-builder execution in the same run,
    and emitting only another status/declaration card counts as failure. Non-goal:
    this slice is not another local wording tweak to one command body; it fixes the
    orchestration/runtime boundary that allows declared-but-not-executed pipelines.'
