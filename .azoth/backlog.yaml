    created_date: "2026-04-06"
    decision_ref: [D53, D48]
    description: >
      Implement delivery-triggered version increments per D53.
      Version format: 0.0.PHASE.PATCH where PHASE = current phase number
      (3–6) and PATCH increments every delivery session, resetting to 1 on
      phase bump. Final release bump: 0.1.0 (full roadmap complete, git tag).
      Deliverables: (1) scripts/version-bump.py — reads azoth.yaml, applies
      --patch (PATCH+1), --phase (PHASE+1, PATCH reset to 1), or --release
      (0.1.0 + git tag proposal); writes azoth.yaml + updates roadmap.yaml
      active_version and current_patch fields. Prints old→new transition.
      (2) /session-closeout integration — final step calls version-bump.py
      --patch after confirming at least one artifact was written this session.
      (3) /deliver-full integration — calls version-bump.py --patch after
      builder stage completes successfully.

