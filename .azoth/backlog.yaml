# Azoth Persistent Backlog (D47)
# Operational work queue. Source of truth for all pending tasks.
# /next reads this file alongside ROADMAP.yaml after BL-004 is delivered.
#
# RULES:
# - Active items cannot be silently dropped.
# - Deferral requires explicit target_version and status: deferred (excluded from
#   welcome top-N and /next candidate sourcing until requeued or version is active).
# - target_layer routes delivery: M1 → /deliver-full (governed), others → /deliver (standard)
# - M1 items require a dedicated session (D51) — scope card validator rejects mixed M1+runtime
# - target_version uses the D53 scheme: v0.0.PHASE (e.g. v0.0.3 for Phase 3 deliveries)
# - Completed items carry their actual delivery version, not a future release target

