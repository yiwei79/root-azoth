  # ── Priority 5: Pipeline integrity ──────────────────────────────────────
  - id: BL-008
    title: "Subagent auto-routing policy — when-to-subagent rules integrated into pipeline composition (D21)"
    source: ep-041
    target_layer: M1
    delivery_pipeline: governed
    status: complete
    target_version: v0.0.3
    priority: 5
    created_date: "2026-04-06"
    decision_ref: D21
    description: >
      Instead of hardcoding Agent(subagent_type=...) mandates per pipeline command
      (BL-006 approach), define a general subagent routing policy with four decision
      triggers: (1) context-isolation — review stage must not share context with the
      stage it reviews; (2) review-independence — any gate whose job is to critique
      an artifact must be a fresh subagent; (3) parallel-execution — independent
      research or analysis tasks that can run concurrently; (4) context-budget —
      stages that would consume excessive context in the orchestrator.
      Deliverables: (a) skills/subagent-router/ — routing policy skill that defines
      the four triggers and maps goal classification dimensions to subagent assignments;
      (b) /auto updated — pipeline composition stage uses the router to emit subagent
      assignments automatically after goal classification, so every auto-composed
      pipeline inherits correct subagent behavior; (c) /deliver updated — reference
      the routing policy instead of inline mandates; (d) /deliver-full updated —
      same (BL-006 hardcodes become policy-derived). No per-pipeline audit work
      required for future pipelines — they inherit the policy via /auto composition.

  - id: BL-006
    title: "Enforce subagent invocation per stage in /deliver-full (D21)"
    source: session-2026-04-06
    target_layer: M1
    delivery_pipeline: governed
    status: complete
    target_version: v0.0.3
    priority: 5
    created_date: "2026-04-06"
    decision_ref: D21
    description: >
      /deliver-full currently does not mandate that each pipeline stage is
      executed via Agent(subagent_type=...). Without explicit subagent invocation,
      Claude runs all stages inline in the same context, eliminating context
      isolation and allowing the governance/architect review stages to share
      context with the stages they are supposed to critique independently.
      Update .claude/commands/deliver-full.md to explicitly require subagent
      invocation for each stage (architect, reviewer, planner, evaluator, builder)
      and specify which subagent_type maps to which stage.

  # ── Priority 6: Auto-versioning implementation ──────────────────────────
  - id: BL-009
    title: "Auto-versioning: scripts/version-bump.py + session-closeout + deliver-full integration (D53)"
    source: session-2026-04-06-d53
    target_layer: M1
    delivery_pipeline: governed
    status: complete
    target_version: v0.0.3
    priority: 6
    created_date: "2026-04-06"
    decision_ref: [D53, D48]
    description: >
      Implement delivery-triggered version increments per D53.
      Version format: 0.0.PHASE.PATCH where PHASE = current phase number
      (3–6) and PATCH increments every delivery session, resetting to 1 on
      phase bump. Final release bump: 0.1.0 (full roadmap complete, git tag).
      Deliverables: (1) scripts/version-bump.py — reads azoth.yaml, applies
      --patch (PATCH+1), --phase (PHASE+1, PATCH reset to 1), or --release
      (0.1.0 + git tag proposal); writes azoth.yaml + updates roadmap.yaml
      active_version and current_patch fields. Prints old→new transition.
      (2) /session-closeout integration — final step calls version-bump.py
      --patch after confirming at least one artifact was written this session.
      (3) /deliver-full integration — calls version-bump.py --patch after
      builder stage completes successfully.

