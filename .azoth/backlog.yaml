- id: BL-064
  title: "Scope-gate hook: whitelist paths outside repo root (fixes plan-mode write blocking)"
  source: "ep-266"
  target_layer: infrastructure
  delivery_pipeline: standard
  status: complete
  target_version: v0.2.0-p2
  priority: 3
  created_date: '2026-04-19'
  completed_date: '2026-04-19'
  description: >
    The PreToolUse hook in .claude/hooks/scope_gate_core.py fires on ALL Write/Edit
    tool calls regardless of destination path. Discovered live when plan-mode tried to
    write to ~/.claude/plans/ (outside the repo root) and was blocked because no scope
    card existed — a deadlock for planning sessions. Fix: in evaluate_scope_gate(), add
    an outside-root check before the `not gate_path.exists()` branch. If the resolved
    target path does not share a common prefix with repo_root, skip enforcement and return
    ScopeGateResult(allowed=True, skip_entropy=True).
    File: .claude/hooks/scope_gate_core.py (evaluate_scope_gate, ~line 337).
    Acceptance: writing to ~/.claude/plans/ proceeds without a scope card; writing to
    .azoth/ still requires one.
