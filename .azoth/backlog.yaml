- id: BL-015
  title: Agent/skill boilerplate dedup — posture single-source + skill trigger compression
  source: session-2026-04-06-token-opt
  target_layer: infrastructure
  delivery_pipeline: standard
  status: complete
  target_version: v0.0.4
  priority: 4
  created_date: '2026-04-06'
  description: 'Two boilerplate reduction targets: (1) Agent posture: all 10 agents/*.agent.md
    files have near-identical posture: sections (~300 chars each, ~3K total). Define
    "Default Posture" once in GOVERNANCE.md §Default-Posture; replace posture blocks
    in agent files with a single-line pointer. Agents with genuinely unique posture
    rules keep only those deltas. (2) Skill triggers: 12 SKILL.md files have "Use
    this skill when:" preambles averaging 3-5 bullets each. Compress to 1-2 sentences
    per skill — enough signal for Claude to match the skill, not a comprehensive list
    of scenarios. Estimated yield: ~800 tokens (agents, on-demand) + ~600 tokens (skills,
    on-demand). Low yield per session but improves maintainability.

