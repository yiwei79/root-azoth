  # ── Token Optimization: Phase 4 deferred items ──────────────────────────

  - id: BL-011
    title: "Spawn prompt minimization — pipeline Agent() calls to minimal goal+params pattern"
    source: session-2026-04-06-token-opt
    target_layer: M1
    delivery_pipeline: governed
    status: complete
    target_version: v0.0.4
    priority: 1
    created_date: "2026-04-06"
    decision_ref: [D21, D23]
    description: >
      Each Agent() subagent spawn currently passes 100-300 line prompts that load
      into the subagent context at turn 0, on top of inherited CLAUDE.md + skills.
      Fix: move subagent-specific context into dedicated skill files (lazy-loaded);
      spawn prompts carry only goal + parameters (~20 lines max). Deliverables:
      (1) pattern documented in skills/subagent-router/ as spawn-prompt convention;
      (2) existing pipeline skills (/auto, /deliver, /deliver-full) updated to
      follow minimal-spawn pattern; (3) example before/after showing token delta.
      Estimated yield: 500-2,000 tokens saved per subagent invocation, compounds
      across every pipeline run.

