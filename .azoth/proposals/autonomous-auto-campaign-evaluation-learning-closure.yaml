          campaign, the autonomous-auto-campaign-evaluation-learning-closure
          proposal, stale slice-auto-001-c/T-031 readiness as the root-cause
          blocker, and the exact scaffold command before any roadmap/backlog/spec
          write.
        scaffold_command: >
          python3 scripts/roadmap_scaffold.py --title "Proposal refinement to hydration readiness bridge" --namespace roadmap --initiative-ref INI-AUTO-001 --decision-ref D11 D21 D23 D48 D50 D52 --source proposal-autonomous-auto-campaign-evaluation-learning-closure-hydration-bridge --description "Teach autonomous-auto strategy-preflight and lifecycle discovery to route exact proposal-backed hydration plans after refine_proposal children, so stale completed initiative readiness cannot mask a fresh proposal-backed hydration candidate; use retrospective evidence normalization as the first validation case without mutating campaign state from audit reports." --target-layer infrastructure --delivery-pipeline standard
        do_not_run_until:
          - "This proposal validates with `scripts/architecture_proposal_validate.py`."
          - "The current refine_proposal child records lifecycle/audit evidence and closes or checkpoints cleanly."
          - "No active write claim or protected gate blocks roadmap/backlog/spec hydration."
          - "Strategy-preflight selects hydrate_task with fresh approval for this exact scaffold command."
        hydrated_task_ref: T-032
        hydrated_spec_ref: .azoth/roadmap-specs/v0.2.0/T-032.yaml
        hydrated_at: "2026-04-26T14:08:20Z"
        hydration_session_id: 2026-04-26-autonomous-auto-proposal-hydration-bridge-2
        result: "Created roadmap/backlog/spec artifacts for T-032 and kept implementation for a separate ship_task child."
