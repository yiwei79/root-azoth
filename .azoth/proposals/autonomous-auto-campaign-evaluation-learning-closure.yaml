proposal_schema_version: 1
created_at: "2026-04-25T21:30:00Z"
session_id: "2026-04-25-autonomous-auto-campaign-evaluation-seed"
backlog_id: "P6-003"
title: "Autonomous-auto campaign evaluation and learning closure spine"
summary: >
  Architecture seed for turning past and future autonomous-auto campaigns into
  analysis-ready evidence. The desired system should join loop state, scope
  gates, run-ledger stage evidence, subagent summaries, evaluator scores,
  closeout episodes, changed artifacts, lessons, and follow-on roadmap/code
  changes into one campaign audit report. The goal is to verify that the
  self-improvement loop is genuinely closed: lessons are observed, captured,
  triaged, planned, implemented, verified, and later reinforced by behavior.
status: draft
decision_refs:
  - D11
  - D21
  - D23
  - D48
  - D50
  - D52
scope_layers:
  - pipelines
  - docs
  - mixed
details:
  problem:
    current_gap: >
      Autonomous-auto now leaves many useful traces, but the traces are spread
      across `.azoth/autonomous-loop-state.local.yaml`, `.azoth/scope-gate.json`,
      `.azoth/run-ledger.local.yaml`, closeout episodes, inbox reflections,
      proposals, roadmap/backlog/specs, commits, tests, and chat/subagent
      transcripts. A human can reconstruct a campaign, but the repo does not yet
      have a single campaign-evaluation spine that can reliably answer whether
      the mode learned, whether lessons were applied, and which future fixes are
      highest leverage.
    risk_without_spine: >
      Without a durable evaluator, autonomous-auto can look successful while
      important lessons remain as untriaged inbox rows, evaluator scores remain
      unnormalized, subagent reasoning stays outside repo-native artifacts, and
      cross-campaign patterns require manual synthesis. That weakens the core
      design goal of traceable agent decision-making and makes automatic
      self-improvement harder to trust.
  desired_outcomes:
    - "One read-only campaign audit report per selected autonomous-auto campaign."
    - "A normalized learning-closure ledger for lessons: observed, captured, triaged, planned, implemented, verified, reinforced, or stale."
    - "A traceability scorecard for agent decisions, stage evidence, route choices, evaluator scores, artifacts changed, tests, residual risks, and operator alignment packets."
    - "A machine-readable defect/opportunity list that can route to capture_self_improvement, refine_proposal, hydrate_task, ship_task, or stop."
    - "A human-facing executive read that explains what worked, what failed, what improved, and what should be fixed next."
  proposed_model:
    read_only_campaign_auditor:
      purpose: >
        Build a deterministic report over existing artifacts before adding any
        new writer. The first slice should inspect a named campaign or the latest
        completed autonomous-auto loop and emit structured JSON plus compact
        operator text.
      candidate_inputs:
        - ".azoth/autonomous-loop-state.local.yaml"
        - ".azoth/scope-gate.json and historical scope-gate payloads embedded in closeout episodes"
        - ".azoth/run-ledger.local.yaml when present"
        - ".azoth/memory/episodes.jsonl"
        - ".azoth/inbox/session-reflection-*.jsonl"
        - ".azoth/proposals/*.yaml"
        - ".azoth/roadmap.yaml, .azoth/backlog.yaml, and .azoth/roadmap-specs/v0.2.0/*.yaml"
        - "git commits for delivered campaign artifacts"
      outputs:
        - "campaign declaration and budget"
        - "iteration timeline"
        - "route decisions and rejected alternatives"
        - "delegation plan versus observed stage evidence"
        - "subagent summary availability and gaps"
        - "evaluator score and UX Anchor Scorecard availability"
        - "changed artifacts and verification commands"
        - "lesson closure status"
        - "residual risks and recommended next routes"
    learning_closure_ladder:
      states:
        - id: observed
          meaning: "A failure, friction, or opportunity was noticed in a campaign."
        - id: captured
          meaning: "The issue exists as a repo-native inbox/reflection/proposal/initiative/backlog artifact."
        - id: triaged
          meaning: "A route decision classified severity, auto_applicable status, and protected-gate needs."
        - id: planned
          meaning: "A proposal or candidate slice defines acceptance, non-goals, and validation."
        - id: implemented
          meaning: "A code, spec, skill, or command change landed."
        - id: verified
          meaning: "Tests/evaluator evidence demonstrate the change meets acceptance."
        - id: reinforced
          meaning: "A later campaign shows changed behavior or fewer repeats of the same failure."
        - id: stale_or_rejected
          meaning: "The item is no longer relevant or was explicitly rejected."
    traceability_scorecard:
      dimensions:
        - "campaign declaration durability"
        - "approval_basis and protected-boundary clarity"
        - "route decision completeness"
        - "subagent spawn/summary evidence completeness"
        - "evaluator score and UX-anchor evidence completeness"
        - "artifact provenance from lesson to proposal/task/code"
        - "verification and residual-risk clarity"
        - "commit/closeout linkage"
  recommended_first_slice:
    title: "Autonomous-auto campaign audit report"
    route: "refine_proposal_then_hydrate"
    target_layer: "infrastructure"
    delivery_pipeline: "standard"
    purpose: >
      Implement a read-only report that can evaluate one completed autonomous-auto
      campaign and classify trace completeness plus learning-closure status.
    candidate_command: "python3 scripts/autonomous_loop.py campaign-audit --loop-id <id> --json"
    acceptance:
      - "The report identifies campaign objective, budget, iteration count, completion reason, vision band, and approval basis."
      - "The report lists child scopes with action, candidate, route rationale, stage plan, stage evidence presence, evaluator score, verification, and closeout episode id."
      - "The report computes lesson closure rows for captured lessons and shows whether each led to proposal, roadmap/backlog/spec, code/test, or instruction changes."
      - "The report distinguishes reliable repo-native evidence from chat-only or missing evidence."
      - "The report emits recommended next routes with confidence and residual risks."
    non_goals:
      - "Do not mutate campaign, roadmap, backlog, or memory state in the first slice."
      - "Do not mine external services or chat transcripts that are not available in repo-native artifacts."
      - "Do not replace closeout, lifecycle-report, campaign-report, or planning_bank_validate.py."
      - "Do not auto-open follow-on work from the audit report."
  readiness_notes:
    current_status: "seeded_for_research_and_refinement"
    why_not_ready_to_hydrate: >
      The first slice still needs a concrete source-of-truth decision for where
      historical child-scope stage summaries and evaluator outputs should be
      read from when they exist only in run-ledger or closeout episodes. It also
      needs a small sample audit over the two latest completed autonomous-auto
      campaigns before the command contract is frozen.
    next_research_questions:
      - "Which artifacts are authoritative for completed child scopes after `.azoth/run-ledger.local.yaml` no longer has an active run?"
      - "How much subagent text should be promoted into repo-native summaries versus treated as chat-only residual risk?"
      - "What minimum fields make a learning-closure row strong enough for automatic routing?"
      - "Should campaign audit live in `scripts/autonomous_loop.py`, a new helper, or a planning-bank surfacing module?"
  validation_plan:
    - "Validate this proposal with `scripts/architecture_proposal_validate.py`."
    - "Run a manual sample audit over the Initiative Lifecycle Discoverability Spine Campaign and Run-Ledger Atomic Stage Evidence Campaign."
    - "Only after the sample audit, hydrate a narrow read-only implementation task."
