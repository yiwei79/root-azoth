proposal_schema_version: 1
created_at: "2026-04-19T16:30:00Z"
session_id: "2026-04-19-worktree-upgrade-research"
backlog_id: "T-012"
title: "Worktree integration workflow hardening"
summary: >
  Azoth's current worktree flow already delivers producer refresh, queueable
  handoffs, and clean-target preflight, but the command/playbook surface still
  reads ahead of what the backend actually executes. This proposal refreshes the
  worktree upgrade around combined evidence: repo-local truth for what exists
  now, current official Git documentation as the normative source for worktree
  lifecycle and per-worktree safety behavior, and bounded academic multi-agent
  research as directional input for orchestration choices only. The follow-on
  implementation path should start with a sandboxed integrate run, then add
  deterministic reconciliation for shared Azoth state, and finally improve
  post-integration lifecycle UX.
status: draft
decision_refs:
  - D21
  - D50
  - D54
scope_layers:
  - pipelines
  - docs
  - mixed
details:
  evidence_basis:
    external_research_freshness_observed_at: "2026-04-19"
    industry_track:
      role: "normative for factual tool behavior"
      sources:
        - title: "git-worktree manual"
          url: "https://git-scm.com/docs/git-worktree.html"
          finding: >
            Worktree add/remove/lock/prune semantics, per-worktree config
            (`extensions.worktreeConfig`), and explicit lifecycle management are
            the factual baseline for Azoth's worktree contract.
        - title: "git-sparse-checkout manual"
          url: "https://git-scm.com/docs/git-sparse-checkout/2.36.0"
          finding: >
            Worktree-specific config isolation is an established Git pattern and
            supports Azoth keeping temporary integration state scoped to the
            ephemeral worktree rather than the live target checkout.
    academic_track:
      role: "directional for orchestration design, not a hard requirement"
      sources:
        - title: "A Survey on LLM-Based Multi-Agent Systems"
          url: "https://link.springer.com/article/10.1007/s44336-024-00009-2"
          status: "2024 survey"
          finding: >
            Role specialization is useful when coordination cost stays bounded
            and the control plane remains explicit.
        - title: "Rethinking the Value of Multi-Agent Workflow: A Strong Single Agent Baseline"
          url: "https://openreview.net/forum?id=i95lcR2GN5"
          status: "OpenReview submission"
          finding: >
            Multi-agent workflow should justify itself against a strong single
            agent baseline instead of being assumed beneficial by default.
        - title: "Understanding Agent Scaling in LLM-Based Multi-Agent Systems via Diversity"
          url: "https://openreview.net/forum?id=9BN2W5BCfE"
          status: "OpenReview workshop paper"
          finding: >
            More agents help only when they add genuinely diverse evidence or
            roles; bounded, differentiated lanes beat undirected swarm growth.
        - title: "AEMA: Verifiable Evaluation Framework for Trustworthy and Controlled Agentic LLM Systems"
          url: "https://openreview.net/forum?id=DXIEHiZx3i"
          status: "OpenReview workshop paper"
          finding: >
            Evaluation trails, explicit evidence, and reviewer independence are
            important when agentic workflows claim trustworthy behavior.
  problem:
    current_gap: >
      `scripts/worktree_sync.py` currently implements producer refresh, dirty
      target blocking, ready-handoff recording, and integration marking, while
      `/worktree-sync` and the parallel-session playbook describe a broader
      end-of-session integration story that has not yet been built.
    repo_contract_mismatches:
      - "The command surface says detached producer branches are acceptable, but the backend currently rejects detached HEAD state."
      - "The playbook and command imply an integration lane; the backend still stops at queueing/preflight rather than executing a sandboxed merge."
      - "Shared Azoth state remains text-merge-prone because no deterministic reconciliation policy exists yet."
    observed_conflict_surfaces:
      - ".azoth/backlog.yaml"
      - ".azoth/roadmap.yaml"
      - ".azoth/memory/episodes.jsonl"
      - ".azoth/final-delivery-approvals.jsonl"
      - ".azoth/bootloader-state.md"
      - "azoth.yaml"
  current_state:
    implemented_now:
      - "Producer refresh with stash/rebase/restore and fail-closed conflict handling."
      - "Clean-target integrate preflight before any handoff is considered ready."
      - "Shared handoff queue with ready-handoff selection and integrated marking."
    supported_by_evidence_not_implemented:
      - "A short-lived temporary integration worktree that performs the merge away from the live target checkout."
      - "Per-worktree isolation of transient integration state and cleanup after success or abort."
      - "Bounded orchestration lanes with explicit evaluator independence rather than unconstrained swarm growth."
    still_open:
      - "Deterministic reconciliation semantics for shared Azoth state files."
      - "Targeted verification contract for the merged sandbox result."
      - "Lifecycle UX after integration: closeout, follow-on routing, and cleanup."
  architectural_judgment:
    statement: >
      Azoth should not reopen P1-015 or pretend the current producer handoff flow
      is already a full integration engine. The safer path is a fresh follow-on
      initiative: first align contract surfaces with repo truth, then implement a
      sandboxed integrate run, then add deterministic reconciliation and lifecycle
      UX as separate slices.
    fit_with_existing_model:
      - "Preserves one integration operation at a time without requiring a permanently open integrator session."
      - "Keeps producer sessions lightweight and queue-based."
      - "Uses official Git lifecycle behavior as the factual source of truth."
      - "Uses external academic input to bound swarm design rather than to mandate product behavior."
  proposal:
    initiative: "INI-RST-005"
    workflow_shape:
      producer_lane:
        - "Refresh producer work from the target branch when safe."
        - "Record a ready handoff with branch, SHA, and verification facts."
        - "Queue the handoff without claiming integration already happened."
      integrate_lane:
        - "Select one ready handoff."
        - "Create a temporary integration worktree from the target tip."
        - "Merge and verify inside that temporary worktree, not the live target checkout."
        - "Apply deterministic reconciliation for known shared Azoth state."
        - "Advance the live target branch only after the sandbox result is accepted."
        - "Prune temporary integration state and report the next follow-on path."
    phased_follow_on:
      - "T-012: sandboxed integrate-run execution"
      - "T-013: deterministic reconciliation policy for shared Azoth state"
      - "T-014: post-integration lifecycle UX"
    command_contract:
      recommendation: >
        Keep `/worktree-sync` as the operator entrypoint, but make the current
        implemented producer-handoff contract explicit and reserve integration
        execution claims for the future T-012 slice.
  non_goals:
    - "Do not implement the sandbox merge engine in this planning session."
    - "Do not broaden the proposal system beyond repo-aware reference integrity."
    - "Do not auto-promote this proposal into architecture docs or decision records."
    - "Do not reopen completed task P1-015 as if the worktree upgrade were the same slice."
  recommended_follow_up:
    shape: >
      Land T-012 as the first implementation slice under a new worktree upgrade
      initiative, then stage T-013 and T-014 behind it so execution, semantic
      reconciliation, and lifecycle UX can be validated separately.
    likely_touchpoints:
      - ".claude/commands/worktree-sync.md"
      - ".agents/skills/azoth-worktree-sync/SKILL.md"
      - "scripts/worktree_sync.py"
      - "tests/test_worktree_sync.py"
      - "docs/playbook/05-parallel-sessions.md"
