proposal_schema_version: 1
created_at: "2026-04-24T07:40:08+00:00"
session_id: "2026-04-24-initiative-discovery-bridge-proposal"
backlog_id: "P6-003"
title: "Initiative discovery lane to roadmap hydration"
summary: >
  Draft architecture proposal for bridging Azoth's phase-null initiatives to
  scoped roadmap tasks without asking delivery agents to start from assumptions.
  The proposal introduces an initiative discovery lane: select a goal-oriented
  initiative, open research/discovery sessions against that initiative, maintain
  a persistent initiative knowledge bank, challenge and refine the synthesis,
  then hydrate one or more initiative-bound tasks into the active roadmap only
  after explicit knowledge-readiness and human approval gates pass. This keeps
  initiatives as durable goal containers while preserving `/next` and roadmap
  tasks as the only delivery-scoping surface.
status: draft
decision_refs:
  - D11
  - D23
  - D47
  - D48
  - D49
  - D50
  - D51
  - D52
scope_layers:
  - mixed
details:
  problem:
    current_gap: >
      Azoth can already draft proposals, run research/discovery sessions, build
      proposal-specific research banks, refine the proposal, and eventually
      hydrate stable knowledge into roadmap work. Initiatives, however, are
      currently larger goal containers that can appear as the next visible thing
      after the backlog is empty without having an equally explicit knowledge
      build-up path.
    operator_need: >
      When the operator wants to tackle the next initiative, the desired action
      is often not immediate delivery. The desired action is to research the
      initiative, challenge assumptions, build a durable knowledge base, and
      only then mint bounded tasks tied back to the initiative and scheduled
      into a roadmap phase.
    failure_mode: >
      Without an initiative discovery lane, `/next` has only two awkward choices:
      invent a backlog card too early, or point at an unscheduled initiative
      without a governed path for learning enough to scope it well.
  proposed_model:
    name: "initiative discovery lane"
    hierarchy:
      - "Initiative: durable goal container in `.azoth/roadmap.yaml`."
      - "Discovery proposal: human-readable design space and open questions under `.azoth/proposals/`."
      - "Initiative research bank: append-only or merge-friendly knowledge base under `.azoth/research/`."
      - "Synthesis: candidate slices, risks, assumptions, and evidence-readiness score."
      - "Hydrated roadmap tasks: bounded task stubs/specs bound to `initiative_ref` and scheduled into a version."
    central_rule: >
      Initiatives may guide discovery, but they should not directly authorize
      delivery. Delivery starts only after a hydrated task exists in the roadmap
      and backlog, then `/next` opens a scope card as usual.
  lifecycle:
    step_1_select_initiative:
      trigger: >
        `/start` or `/next` finds no claimable backlog item and surfaces
        actionable phase-null initiatives.
      output: >
        Operator selects an initiative for discovery, not delivery.
      gate: >
        Human confirms the initiative discovery intent. This opens an
        exploratory session or AD-HOC planning scope, not a delivery scope.
    step_2_open_discovery_proposal:
      output: >
        Create or update a draft architecture proposal that names the initiative,
        the motivating goal, the initial question set, known constraints, and
        challenge points.
      artifact_pattern: ".azoth/proposals/<initiative-slug>-discovery.yaml"
      rule: >
        The proposal is not authority for roadmap writes. It is a durable
        discussion and refinement surface.
    step_3_build_initiative_research_bank:
      output: >
        Run research and discovery sessions that append packs, local source
        findings, assumptions, contradictions, and operator decisions to an
        initiative-level knowledge bank.
      candidate_artifact_patterns:
        - ".azoth/research/<initiative-id>-research-bank.yaml"
        - ".azoth/research/<initiative-id>-research-bank.json"
        - ".azoth/roadmap-specs/v0.2.0/<initiative-id>-execution-plan.md"
      compatibility_note: >
        Existing task-level research capsules can remain flat JSON files under
        `.azoth/research/`. The initiative bank should synthesize broader
        knowledge and later emit task-specific capsules when a slice is ready.
    step_4_challenge_and_refine:
      output: >
        Run architect/reviewer/evaluator-style challenge passes against the
        proposal and research bank. Record rejected assumptions, unresolved
        conflicts, non-goals, and candidate slice boundaries.
      expected_questions:
        - "What must be true before this initiative becomes actionable?"
        - "Which risks are research gaps versus implementation risks?"
        - "What is too broad for the first slice?"
        - "Which work belongs in M1/governed delivery versus standard infrastructure?"
        - "What evidence would make this initiative not worth scheduling yet?"
    step_5_readiness_gate:
      output: >
        Produce a readiness report before any roadmap hydration.
      readiness_dimensions:
        - "goal clarity"
        - "evidence coverage"
        - "source freshness or volatility"
        - "assumption audit"
        - "contradiction handling"
        - "sliceability"
        - "governance layer classification"
        - "success criteria"
        - "test or validation strategy"
        - "operator confidence"
      suggested_threshold: >
        Hydration is allowed only when the proposal has stable goal/scope,
        major questions are answered or explicitly deferred, contradictions are
        adjudicated, and at least one bounded first slice has clear acceptance
        criteria and governance classification.
    step_6_hydrate_roadmap_tasks:
      output: >
        Create one or more roadmap task stubs/specs bound to `initiative_ref`,
        optionally seed backlog items, and assign them to the active or selected
        roadmap version.
      current_repo_path: >
        Use `scripts/roadmap_scaffold.py --title ... --initiative-ref <INI-ID>`
        for new slices, or `scripts/roadmap_scaffold.py --hydrate-task <TASK-ID>`
        when a planned task stub already exists.
      future_path: >
        Consider a dedicated `scripts/initiative_hydrate.py` helper that reads
        a proposal plus initiative research bank and emits reviewed roadmap
        task candidates before writing.
      gate: >
        Human approves the hydration plan before roadmap/backlog writes.
    step_7_delivery_resumes_normal_flow:
      output: >
        Once the task is hydrated, `/next` can surface it as a normal scope card.
        `/auto`, `/deliver`, or `/deliver-full` then handles implementation via
        the existing control plane.
  artifact_contract:
    initiative_research_bank:
      purpose: >
        Persistent initiative-level knowledge base that can survive multiple
        discovery sessions and produce task-level research capsules later.
      minimal_fields:
        - "schema_version"
        - "initiative_id"
        - "title"
        - "source_sessions"
        - "research_questions"
        - "research_packs"
        - "local_findings"
        - "external_findings"
        - "assumptions"
        - "contradictions"
        - "challenge_log"
        - "candidate_slices"
        - "readiness"
        - "hydration_history"
      merge_rule: >
        Append or merge by stable pack/question ids. Do not rewrite prior
        findings except to supersede them explicitly.
    candidate_slice:
      minimal_fields:
        - "proposed_task_id"
        - "title"
        - "initiative_ref"
        - "target_layer"
        - "delivery_pipeline"
        - "summary"
        - "acceptance_criteria"
        - "research_evidence_refs"
        - "known_non_goals"
        - "open_questions"
        - "recommended_phase"
      rule: >
        Candidate slices are planning evidence only until the human approves
        hydration into roadmap/backlog state.
  refined_contract:
    external_source_alignment:
      observed_at: "2026-04-24"
      sources:
        - title: "Atlassian Product Discovery"
          url: "https://www.atlassian.com/agile/product-management/discovery"
          finding: >
            Product discovery should validate ideas before build commitment,
            connect discovery data with delivery status, and keep decision data
            visible rather than scattered across disconnected artifacts.
        - title: "Jira Product Discovery delivery overview"
          url: "https://www.atlassian.com/software/jira/product-discovery/guides/delivery/overview"
          finding: >
            Ideas can move from uncertain parking-lot state through discovery
            into ready-for-delivery only after validation, prioritization, and
            commitment; delivery issues remain linked back to discovery ideas.
        - title: "Product Talk Opportunity Solution Tree"
          url: "https://www.producttalk.org/glossary-discovery-opportunity-solution-tree/"
          finding: >
            Opportunity solution trees separate desired outcomes, opportunity
            space, solution space, and assumption tests so teams can make
            assumptions explicit before choosing what to build.
        - title: "Google Cloud Architecture Decision Records overview"
          url: "https://cloud.google.com/architecture/architecture-decision-records"
          finding: >
            Architecture decision records capture options, requirements, the
            selected decision, and context so future work can understand why a
            decision was made.
        - title: "GOV.UK Service Manual discovery phase"
          url: "https://www.gov.uk/service-manual/agile-delivery/how-the-discovery-phase-works"
          finding: >
            Discovery should happen before build commitment, should clarify the
            problem, constraints, users, wider context, opportunities, and success
            measures, and should end with a decision to stop, continue researching,
            or move toward testing ideas.
      implications:
        - >
          Treat phase-null initiatives like uncertain discovery ideas: visible
          and discussable, but not ready for delivery until the readiness gate
          produces a validated candidate slice.
        - >
          Keep the initiative bank linked to downstream tasks so delivery
          preserves discovery rationale instead of copying stale evidence into
          disconnected task specs.
        - >
          Model candidate slices with outcome, opportunity, solution, and
          assumption-test fields where useful; this maps cleanly to Azoth's
          candidate-slice plus readiness-report contract.
        - >
          Preserve the proposal as the architectural rationale surface while
          the initiative bank carries evidence and readiness state.
        - >
          Treat "not ready yet" and "stop" as successful discovery outcomes when
          replay shows that an initiative is historical-only, too broad, or lacks
          enough context to justify a first slice.
    initiative_candidate_criteria:
      purpose: >
        Define which phase-null initiatives are eligible for discovery routing
        so historical theme containers do not masquerade as live work.
      criteria:
        - "The initiative has `phase: null` and is not already scheduled into a roadmap version."
        - "The initiative has at least one incomplete or explicitly open goal, slice, or unresolved research question."
        - "The initiative is not fully represented by completed historical slices."
        - "No claimable backlog item already covers the same next action."
        - "The operator explicitly wants discovery, or the initiative has material assumptions that would make direct hydration risky."
      non_candidates:
        - "Historical-only initiatives whose slices are all complete."
        - "Initiatives with an already claimable backlog item; `/next` should handle those."
        - "Small obvious follow-ups that can be drafted directly as backlog work without a research lane."
    artifact_boundary:
      proposal_owns: "Intent, design space, open questions, non-goals, and challenge points."
      initiative_bank_owns: >
        Evidence, source packs, local findings, assumptions, contradictions,
        challenge history, candidate slices, readiness, and hydration history
        for one initiative.
      task_capsule_owns: >
        Slice-specific freshness and sufficiency evidence for delivery. A
        task-level capsule must still satisfy `scripts/research_sufficiency.py`
        before research-dependent delivery treats it as reusable evidence.
      digest_relationship: >
        `SWARM_RESEARCH_DIGEST.yaml` remains the roadmap-version DFA+ aggregate.
        Initiative banks may reference digest pack ids, cite selected consensus
        themes, or import relevant packs with provenance, but the digest should
        not be reused directly as the initiative bank because it lacks
        initiative ownership, readiness, candidate-slice, and hydration fields.
    readiness_report_schema:
      purpose: >
        Record a human-readable pass/fail readiness judgment before hydration
        without writing roadmap or backlog state.
      minimal_fields:
        - "initiative_id"
        - "evaluated_at"
        - "source_bank_ref"
        - "readiness_status"
        - "goal_clarity"
        - "evidence_coverage"
        - "freshness_status"
        - "assumption_audit"
        - "contradiction_disposition"
        - "candidate_first_slice"
        - "target_layer"
        - "delivery_pipeline"
        - "acceptance_criteria"
        - "non_goals"
        - "hydration_recommendation"
        - "human_decision"
      status_values:
        - "continue_research"
        - "ready_to_hydrate"
        - "defer"
        - "reject"
      fail_closed_rules:
        - "Unresolved contradictions that affect first-slice scope block `ready_to_hydrate`."
        - "Stale evidence blocks `ready_to_hydrate` when freshness affects the slice."
        - "Ambiguous `target_layer` or `delivery_pipeline` blocks hydration."
        - "A first slice that is still the whole initiative must return `continue_research`."
    command_policy:
      roadmap: >
        First visibility surface. `/roadmap` may show read-only discovery
        readiness or candidate status inside the unscheduled initiatives panel.
      start: >
        Keep `/start` lightweight: when no backlog item is claimable, it may
        hint that discovery candidates exist and point to `/roadmap` or a
        future discovery command.
      next: >
        Keep `/next` as the delivery scope-card path. It may show a read-only
        discovery hint when no backlog item is claimable, but it must not create
        proposals, write research banks, hydrate roadmap tasks, or turn an
        initiative into a scope card.
      future_command: >
        If the pattern proves durable, consider `/initiative-discover <INI-ID>`
        as the dedicated command for opening or resuming discovery without
        overloading `/next`.
    hydration_handoff:
      existing_planned_task: >
        For a planned task stub that already exists in the active version, use
        `scripts/roadmap_scaffold.py --hydrate-task <TASK-ID>` so the existing
        identity is preserved.
      new_approved_slice: >
        For a newly approved slice, use `scripts/roadmap_scaffold.py --title ...
        --initiative-ref <INI-ID>` after the human approves the hydration plan.
      helper_boundary: >
        A future `initiative_hydrate.py` helper should first emit a reviewed
        hydration plan and readiness report without writing roadmap/backlog
        state; only a separate human-approved step should call the existing
        scaffold paths.
  validation_replay:
    - scenario: "Historical-only initiative should not become a discovery candidate"
      input:
        initiative_ref: "INI-KRP-001"
        observed_state: >
          Phase-null initiative whose T-KRP-A through T-KRP-E slices are all
          recorded as historical and complete.
      expected_path: "not_candidate"
      readiness_result: "reject"
      rationale: >
        The initiative is durable historical context, not a live opportunity.
        Surfacing it as discovery would confuse completed goal memory with the
        next actionable planning surface.
      external_alignment:
        - "GOV.UK discovery treats stop/no-go as a valid outcome when research says the problem should not proceed."
    - scenario: "Open phase-null initiative with no slices stays in discovery"
      input:
        initiative_ref: "INI-MEM-003"
        observed_state: >
          Phase-null memory initiative with no slices, no backlog task, and an
          architectural goal that still needs slice and evidence selection.
      expected_path: "initiative_discovery"
      readiness_result: "continue_research"
      rationale: >
        The initiative is visible and potentially valuable, but direct hydration
        would require inventing first-slice scope, acceptance criteria, and
        delivery-layer classification from incomplete evidence.
      external_alignment:
        - "Atlassian's discovery-to-delivery model keeps uncertain ideas out of committed delivery until validation and prioritization are complete."
        - "Product Talk's opportunity-solution tree flow asks teams to choose a target opportunity and test assumptions before deciding what to build."
    - scenario: "Knowledge-richness initiative can become a ready hydration candidate after a bounded slice is named"
      input:
        initiative_ref: "INI-EVI-002"
        candidate_slice: "Proposal richness dashboard integration"
        observed_state: >
          Phase-null initiative with no slices yet, but the ad-hoc evaluator,
          proposal contract, and roadmap integration points create enough
          evidence to draft a first reviewed hydration plan.
      expected_path: "ready_to_hydrate_after_human_approval"
      readiness_result: "ready_to_hydrate"
      rationale: >
        Once the slice records target layer, acceptance criteria, evidence refs,
        non-goals, freshness status, and contradiction disposition, the helper
        may emit a hydration plan. Roadmap and backlog writes still remain
        human-approved scaffold actions.
      external_alignment:
        - "Google Cloud ADR guidance supports retaining options, requirements, decisions, and timestamps so future work can understand the rationale."
  worked_examples:
    - name: "Readiness report flow for a phase-null initiative"
      steps:
        - "Select an actionable phase-null initiative from `/roadmap` instead of `/next`."
        - "Open or update the discovery proposal and initiative bank."
        - "Record local findings, external sources, assumptions, contradictions, and candidate slices."
        - "Run knowledge-richness and structural proposal checks."
        - "Emit a readiness report with `continue_research`, `ready_to_hydrate`, `defer`, or `reject`."
        - "Only after human approval, call the existing roadmap scaffold path for the selected slice."
      expected_output: >
        A reviewed hydration plan or a clear non-hydration decision, with no
        roadmap/backlog writes performed by discovery itself.
  research_completion_assessment:
    assessed_at: "2026-04-24"
    evaluator: "scripts/proposal_knowledge_richness.py"
    score: "100/100"
    rating: "excellent"
    gaps: []
    research_complete_for: >
      Proposal refinement and future implementation scoping of the initiative
      discovery lane contract.
    not_complete_for:
      - "Implementing a new `/initiative-discover` command without a separate scoped task."
      - "Bypassing human approval for roadmap or backlog hydration writes."
      - "Treating initiative-level evidence as a task-level research capsule without `scripts/research_sufficiency.py`."
    evidence_basis:
      - "Five external source alignments with observed date."
      - "Three validation replay scenarios against real roadmap initiative shapes."
      - "One worked readiness-report flow."
      - "Passing structural proposal validation and targeted evaluator tests."
  command_surface_options:
    option_a_extend_start_next:
      description: >
        When `/next` has no claimable backlog item, show an "initiative discovery"
        route for actionable phase-null initiatives.
      benefit: "Low friction for the operator at exactly the point they feel the gap."
      risk: "`/next` could become too broad if it starts doing discovery work itself."
    option_b_add_initiative_discover_command:
      description: >
        Add a dedicated `/initiative-discover <INI-ID>` workflow that opens or
        resumes initiative discovery without overloading `/next`.
      benefit: "Clean separation between delivery scoping and knowledge build-up."
      risk: "Another command surface may add discoverability and parity work."
    option_c_use_arch_proposal_plus_plan:
      description: >
        Keep the first version procedural: use `/arch-proposal` for the design
        artifact and `/plan` for initiative slice readiness until the pattern is
        proven.
      benefit: "Smallest implementation surface; matches the proposal-first rule."
      risk: "Relies on operator discipline and may remain less discoverable."
    recommended_starting_point: >
      Start with option C as policy, then research whether option B deserves a
      bounded implementation slice. Avoid making `/next` write discovery state.
  governance:
    human_gates:
      - "Approve initiative discovery intent."
      - "Approve creation or material revision of a discovery proposal."
      - "Approve research/challenge question set when scope is ambiguous."
      - "Approve readiness before hydration."
      - "Approve roadmap/backlog writes produced by hydration."
    scope_boundaries:
      - "Exploratory discovery sessions may read broadly and write only approved proposal/research artifacts."
      - "Hydration sessions may write roadmap/backlog/spec state only after explicit approval."
      - "Delivery sessions must start from hydrated tasks and existing `/next` scope cards."
    m1_boundary: >
      If the hydrated task targets M1 or governed surfaces, D51 still applies:
      the task requires a governed pipeline and must not be batched with non-M1
      work.
  readiness_rubric:
    pass_conditions:
      - "The initiative goal is stated in one or two durable sentences."
      - "At least one first slice is small enough for a normal delivery session."
      - "The first slice has explicit acceptance criteria and non-goals."
      - "Research questions that affect scope are answered, contradicted, or consciously deferred."
      - "Evidence freshness is adequate for the slice's volatility."
      - "The proposed task has a clear target_layer and delivery_pipeline."
      - "The proposal names what would invalidate or postpone the slice."
    fail_or_continue_research_conditions:
      - "The first slice is still just the whole initiative."
      - "The plan depends on unstated product or architecture assumptions."
      - "Research evidence is too old or too narrow for the decision."
      - "Contradictions are recorded but not adjudicated."
      - "The target layer is ambiguous enough to risk mixing M1 and non-M1 work."
  non_goals:
    - "Do not let initiatives become direct `/next` delivery scopes."
    - "Do not auto-hydrate roadmap tasks merely because an initiative exists."
    - "Do not move phase-null initiatives into a roadmap phase until a slice is explicitly scheduled."
    - "Do not replace existing task-level research capsules; initiative banks should feed them."
    - "Do not implement a new command from this proposal without a later scoped delivery task."
  challenge_points:
    - >
      The initiative bank could duplicate proposal details unless the proposal
      owns design intent and the bank owns evidence.
    - >
      A readiness score could create false confidence; unresolved contradictions
      should be first-class, not hidden behind a number.
    - >
      Discoverability matters: if this remains only an expert convention, future
      agents may still jump from initiative to implementation.
    - >
      The system should avoid forcing research for every small initiative; the
      lane should trigger when assumptions are materially risky or the operator
      explicitly asks to build knowledge first.
  suggested_future_research_session:
    goal: >
      Research and challenge the initiative discovery lane against existing
      proposal, research capsule, roadmap scaffold, and dynamic-full-auto digest
      mechanisms.
    questions:
      - "Should the durable initiative bank be YAML or JSON?"
      - "Can `SWARM_RESEARCH_DIGEST.yaml` be reused, or does initiative discovery need a narrower schema?"
      - "Should a future helper validate readiness without writing roadmap state?"
      - "Where should the operator see initiative discovery state: `/start`, `/roadmap`, `/next`, or a new command?"
      - "How should task-specific research capsules be derived from an initiative bank without copying stale evidence?"
    likely_outputs:
      - "Refined proposal details."
      - "Candidate schema for initiative research banks."
      - "Decision on command surface: policy-only, `/plan`, or dedicated `/initiative-discover`."
      - "A bounded backlog item only if implementation is justified."
  candidate_surfaces:
    - ".azoth/proposals/"
    - ".azoth/research/"
    - ".azoth/roadmap.yaml"
    - ".azoth/roadmap-specs/v0.2.0/"
    - "commands/start/body.md"
    - "commands/next/body.md"
    - "scripts/roadmap_scaffold.py"
    - "scripts/initiative_scaffold.py"
    - "scripts/research_sufficiency.py"
    - "scripts/swarm_research_digest.py"
    - "scripts/roadmap_dashboard.py"
