proposal_schema_version: 1
created_at: "2026-04-24T08:59:30Z"
session_id: "2026-04-24-m2-m1-self-improvement-loop"
backlog_id: "BL-075"
title: "M2-to-M1 Self-Improvement Control Loop"
summary: >
  Draft architecture proposal for treating Azoth's M2-to-M1 path as a
  governed learning control loop rather than a `/promote`-local feature. The
  target loop is: M3 evidence to M2 pattern, M2 pattern to a Learning
  Application Decision, decision to scoped readback, proposal, backlog, L2
  refinement, or M1 candidate work, then closeout evaluation that reinforces or
  revises the learning. This proposal changes governance/design artifacts only.
  It preserves the draft-only policy: Azoth may recommend and prepare
  downstream artifacts, but M1 changes still require a backlog item, explicit
  human approval, `/next`, and `/deliver-full`.
status: draft
decision_refs:
  - D11
  - D21
  - D23
  - D45
  - D47
  - D49
  - D50
  - D51
scope_layers:
  - mixed
details:
  problem: >
    Azoth can capture M3 episodes and promote recurring evidence into M2
    patterns, but the post-promotion application step is still mostly manual.
    Some patterns should remain operational memory, some should reinforce exact
    prior evidence, some should become L2 instruction-refinement work, some
    need architecture proposals or planning backlog items, and only a smaller
    subset should graduate toward M1. Without a common decision model, each
    command risks inventing its own partial router and the self-improvement loop
    remains less auditable than the rest of Azoth.
  architecture_thesis: >
    The optimal design is not to make `/promote` a larger command that owns all
    downstream learning. Azoth should define one Learning Application Decision
    concept that can be surfaced by multiple entrypoints. `/intake`, `/promote`,
    `context-recall`, `/next`, `self-improve`, and closeout become views over
    one governed learning loop: evidence is captured, pattern maturity is
    judged, an application path is selected, the resulting work is scoped
    through existing gates, and closeout records whether the learning actually
    improved future behavior.
  learning_state_model:
    states:
      - name: "captured_evidence"
        source: "M3 episodes from closeout, intake, memory capture, or operator correction"
        exit_condition: "Evidence is archived, integrated, or marked as an M2 candidate."
      - name: "pattern_candidate"
        source: "`/intake` D49 triage or `/promote` candidate discovery"
        exit_condition: "Human approves, rejects, or defers promotion."
      - name: "m2_pattern"
        source: "Approved M3-to-M2 promotion under the Promotion Rubric"
        exit_condition: "Pattern is available for readback and application routing."
      - name: "learning_application_decision"
        source: "Post-promotion or planning-time routing judgment"
        exit_condition: "A path is selected with evidence, owner, gate, and rejected alternatives."
      - name: "scoped_application"
        source: "Existing proposal, backlog, L2 refinement, M1 candidate, or readback path"
        exit_condition: "Work is completed, deferred, or rejected through normal Azoth gates."
      - name: "closeout_feedback"
        source: "Session closeout and future promote/intake sweeps"
        exit_condition: "The pattern is reinforced, contradicted, revised, or retired."
  application_paths:
    readback_only:
      description: >
        Keep the approved pattern in M2 and rely on context-recall/readback to
        influence future planning and execution.
      use_when: >
        The pattern is useful, but prose memory is enough for now or evidence is
        not mature enough to justify a scoped implementation.
      gate: "No write beyond the approved M2 update."
    reinforce:
      description: >
        Add recurrence evidence to an exact prior episode or pattern without
        creating a duplicate pattern or downstream work item.
      use_when: >
        The human confirms that the same lesson recurred and an exact target id
        is available.
      gate: "Require exact id; never infer the reinforcement target from tags or prose."
    l2_refinement:
      description: >
        Route the pattern into the evidence-based self-improve lane for prompt,
        skill, agent, or command instruction refinement.
      use_when: >
        There is enough repeated evidence to test an instruction-quality
        hypothesis, but the change is still behavioral/instructional rather
        than a kernel procedure.
      gate: "Human-approved L2 proposal, then `/auto` with instruction-refinement."
    proposal:
      description: >
        Capture an architecture-level design space in `.azoth/proposals/` for
        research, challenge, and refinement before implementation.
      use_when: >
        The learning affects multiple commands or governance layers, has unclear
        ownership, or risks overfitting from a narrow recent workflow.
      gate: "Draft-only unless the operator explicitly approves the proposal write."
    backlog_planning:
      description: >
        Recommend or draft a non-M1 planning or implementation backlog item for
        later scoped delivery.
      use_when: >
        The pattern has a clear operational destination but does not require a
        kernel/governance M1 change.
      gate: "Human-approved backlog append; later `/next` scope card."
    m1_candidate:
      description: >
        Recommend a `target_layer: M1` backlog candidate for a procedure,
        governance, kernel, command, skill, or agent change.
      use_when: >
        The pattern is validated across sessions, belongs in a durable Azoth
        procedure, and memory/readback alone is insufficient.
      gate: "`target_layer: M1`, human approval, `/next`, and `/deliver-full`."
    not_yet:
      description: >
        Preserve the evidence without taking downstream action.
      use_when: >
        The signal is one-off, contradictory, too broad, too recent, or not yet
        tied to a concrete Azoth improvement surface.
      gate: "No downstream write; optionally record a maturity note."
  command_roles:
    intake: >
      `/intake` remains the external-signal triage point. It classifies inbox
      evidence across M3 integration, M2 candidacy, and backlog candidacy using
      D49. It may produce candidate evidence for this loop, but it does not own
      M2-to-M1 graduation.
    promote: >
      `/promote` remains the evidence and Promotion Rubric gate for M3-to-M2
      movement. After an approved promotion, it should be able to surface a
      Learning Application Decision recommendation, but it should not directly
      implement M1 or write unrelated work without an explicit approved path.
    context_recall: >
      `context-recall` closes the write-only memory failure mode by pulling
      relevant M3 episodes and M2 patterns into planning. It is the default
      execution-time path for readback-only patterns.
    next: >
      `/next` remains the scoped-work gate. It should surface relevant M2
      patterns, proposal references, and M1 boundaries when choosing and
      approving backlog work, and it must continue to reject mixed M1 and
      non-M1 scope cards.
    self_improve: >
      `self-improve` owns the L1/L2 reflexion path. L2 refinement should be
      used when repeated evidence points at instruction quality, prompt
      behavior, or agent/skill wording rather than a deterministic M1
      procedure.
    closeout: >
      Closeout records whether a learning was applied, ignored, contradicted,
      reinforced, or converted into scoped work. This feedback is what makes
      the loop self-correcting instead of merely accumulative.
  m1_graduation_policy:
    principles:
      - "M1 is a durable procedure layer, not a reward for every useful pattern."
      - "M2 readback is the default application path until evidence proves it is insufficient."
      - "M1 candidates require cross-session validation and a concrete procedure home."
      - "M1 changes must happen between sessions through scoped delivery, not inline during promotion."
    required_path:
      - "Create or approve a backlog item with `target_layer: M1`."
      - "Select it through `/next` and approve the scope card."
      - "Deliver it through `/deliver-full` with the normal typed gates."
      - "Close out with evidence of whether the new procedure changed behavior."
  v1_output_contract:
    purpose: >
      Give operators a consistent decision surface without adding a new
      persisted control-plane schema in the first implementation.
    section_name: "Learning Application Decision"
    fields:
      - "selected_path"
      - "evidence_basis"
      - "why_this_path"
      - "not_selected_paths"
      - "downstream_owner"
      - "required_gate"
      - "draft_artifact_or_next_step"
    example: >
      selected_path=proposal; evidence_basis=recent promote sweep exposed
      multiple plausible homes; downstream_owner=architect/planner;
      required_gate=human-approved proposal/backlog write; not_selected=M1
      because architecture is not yet stable.
  public_interface_policy:
    current_slice: >
      This proposal changes only the architecture proposal text. It does not
      change command contracts, scripts, skills, schemas, hooks, or runtime
      behavior.
    future_slice: >
      If approved, a later implementation should first add a shared output
      contract to the command/skill surfaces that already participate in the
      learning loop. It should prefer existing proposal, backlog, and memory
      metadata before introducing a new persisted learning-decision log.
  validation_replay:
    - source_pattern: "orchestrator-final-delivery-reports-need-executive-quality-synthesis"
      expected_path: "readback_only or proposal"
      rationale: >
        The pattern is immediately useful as operator memory, but durable
        reporting changes affect multiple surfaces and should be challenged as
        architecture before becoming M1.
    - source_pattern: "platform-parity-needs-mechanical-mirrors-and-tests"
      expected_path: "backlog_planning or m1_candidate"
      rationale: >
        The failure mode is deterministic and cross-platform; prose memory may
        be insufficient if parity can be mechanically checked.
    - source_pattern: "control-plane-needs-real-time-claims-and-durable-status"
      expected_path: "backlog_planning"
      rationale: >
        The pattern points at operational state management and should be scoped
        through backlog and `/next` before changing control-plane behavior.
    - source_pattern: "governed-write-protocols-require-operational-readiness-check"
      expected_path: "not_yet"
      rationale: >
        The pattern was promoted with an explicit maturity note; it should
        remain evidence until recurrence strengthens the case for procedure
        change.
    - source_pattern: "exact duplicate recurrence evidence"
      expected_path: "reinforce"
      rationale: >
        Exact recurrence should strengthen existing evidence rather than create
        duplicate patterns or premature downstream work.
  research_questions:
    - >
      What minimum evidence threshold should move a pattern from readback-only
      to L2 refinement, backlog planning, or M1 candidacy?
    - >
      Should the Learning Application Decision be persisted later, or is it
      enough to record decisions in proposals, backlog items, and closeout
      episodes?
    - >
      How should `/next` present relevant M2 patterns without making every
      scoped task feel obligated to implement memory improvements?
    - >
      What evaluator checks can prove that an M1 procedure actually reduced the
      recurrence of the original failure?
  challenge_points:
    - >
      Avoid command fragmentation: adding separate routers to `/intake`,
      `/promote`, `/next`, and closeout would make the loop harder to audit.
    - >
      Avoid premature M1 pressure: most useful M2 patterns should remain
      operational memory until they show that memory/readback is insufficient.
    - >
      Avoid hidden writes: draft-only recommendations must not quietly mutate
      backlog, proposal, command, skill, or kernel surfaces.
    - >
      Avoid false precision: the route is an architectural judgment with
      evidence and rejected alternatives, not a deterministic classifier.
  non_goals:
    - "Do not auto-promote M2 patterns into M1."
    - "Do not directly edit command, skill, agent, kernel, or script surfaces from memory alone."
    - "Do not write backlog items or proposals without explicit human approval."
    - "Do not replace `/intake`; keep external insight triage distinct from promotion of captured M3 evidence."
    - "Do not introduce a new persisted learning-decision schema in this proposal slice."
  recommended_follow_up:
    shape: >
      Use BL-075 for a focused research/challenge session that replays recent
      promotions, compares D49 intake triage with post-promotion application
      routing, and decides whether the v1 output contract should be implemented
      in `/promote`, shared skill text, `/next` readback, closeout, or a small
      common helper.
    likely_outputs:
      - "Accepted or revised application-path vocabulary."
      - "A testable Learning Application Decision output contract."
      - "A separate implementation backlog item only if research supports it."
      - "No M1 implementation unless the approved item is `target_layer: M1`."
