proposal_schema_version: 1
created_at: "2026-05-04T16:50:02+00:00"
session_id: "2026-05-04-public-release-root-feature-parity"
backlog_id: "BL-082"
title: "Public release root feature parity"
summary: >
  Product-direction proposal for the public Azoth release path: a published release
  should include the feature capability present in root-azoth, not a narrow subset
  that only installs kernel, memory, skills, and agents. Private or workshop-local
  state must not be copied verbatim, but root capabilities such as roadmap,
  planning-bank/project-management, command wrappers, scripts, pipelines, and
  autonomous-auto control surfaces must be transformed into consumer-safe release
  assets and first-run project seeds.
status: draft
decision_refs:
  - D38
  - D46
  - D48
  - D50
scope_layers:
  - mixed
details:
  product_decision: >
    Treat public release parity as a feature-complete product contract. The public
    release may sanitize, transform, and seed root state, but it should not omit
    root-level capability classes and still present the install as "Full".
  diagnosis:
    root_features_present:
      - "Roadmap command and dashboard machinery."
      - "Planning-bank and project-management validators/readiness surfaces."
      - "Autonomous-auto command, skill, loop governor, and run-ledger integration."
      - "Multi-platform command/agent/skill projections generated by azoth-deploy."
    current_release_gap:
      - >
        Product extraction includes much of the machinery, but public freshness is
        intentionally stale and local public main no longer matches the recorded
        release evidence commit.
      - >
        Fresh project install does not seed `.azoth/roadmap.yaml`,
        `.azoth/backlog.yaml`, `.azoth/roadmap-specs/`, initiative/design banks,
        command contracts, pipelines, or required scripts.
      - >
        Installed prompts can reference commands such as `/roadmap` or
        `autonomous-auto` whose runtime dependencies are absent in a new project.
      - >
        Codex install config references `$azoth-*` command wrappers and
        `scripts/codex_control_plane.py`, but the installer does not install the
        generated wrapper skills or required script bundle.
  desired_release_contract:
    minimal: >
      Kernel, trust contract, memory skeleton, manifest, and safe boot guidance.
    standard: >
      Minimal plus core commands, command wrappers, core scripts, pipelines,
      skills, tier-1 agents, and a small consumer project-management seed.
    full: >
      Standard plus all root feature classes that are safe for consumer use:
      complete command/runtime bundle, all agents/skills, roadmap/project-management
      seed layer, planning-bank directories/schemas, autonomous-auto support
      positioned as supervised, campaign-bounded project autonomy for consumer
      installs, and smoke tests proving first-use journeys work.
  consumer_safe_seed_policy:
    include:
      - ".azoth/roadmap.yaml generated from a neutral project template"
      - ".azoth/backlog.yaml generated from a neutral project template"
      - ".azoth/roadmap-specs/<active_version>/ directory with README or starter spec"
      - ".azoth/initiative-banks/ and .azoth/design-banks/ starter directories"
      - ".azoth/autonomous-loop-state.local.yaml.example when autonomous-auto is installed"
      - "Consumer `.gitignore` entries for local/private runtime state produced by governed commands"
      - "commands/, pipelines/, and required scripts referenced by installed prompts/config"
      - ".agents/skills/azoth-* command wrappers for Codex"
    exclude_or_transform:
      - "root workshop memory, inbox, handoffs, gates, claims, telemetry, local loop state"
      - >
        live consumer runtime files such as `.azoth/scope-gate.json`,
        `.azoth/pipeline-gate.json`, `.azoth/run-ledger.local.yaml`,
        `.azoth/autonomous-loop-state.local.yaml`, write-claim traces, and
        final-delivery approval records, except for tracked example/templates
      - "private project/cockpit/backup artifacts"
      - "root-specific initiative contents unless explicitly published as examples"
      - "release evidence that claims freshness without a current public sync gate"
  implementation_direction:
    - "Add a release profile matrix and make installer labels match real capability."
    - "Add consumer-safe project-state templates instead of copying root `.azoth/`."
    - "Install the command/runtime bundle needed by generated prompts and platform configs."
    - "Materialize consumer `.gitignore` protection for local/private runtime files and smoke-test it."
    - "Position autonomous-auto in public Full install as supervised, campaign-bounded project autonomy."
    - "Expand product release smoke to run fresh-project first-use journeys for Full install."
    - "Reconcile public release freshness policy, public repo HEAD, tag, and root evidence before claiming release parity."
  slicing_contract:
    first_slice: >
      Keep the first implementation slice under the Trust Contract entropy ceiling
      by limiting it to the release profile materializer, consumer runtime-state
      protection, and focused tests.
    later_slices: >
      Stop, checkpoint, or re-gate before wiring additional installer platforms,
      broad command/skill wording rewrites, public freshness publication, or any
      change set that would cross 10 files in one deliver-full session.
  acceptance_tests:
    - "Full install contains commands, pipelines, selected scripts, and Codex `$azoth-*` wrappers."
    - "Fresh Full install can execute `$azoth-start` or equivalent without import errors."
    - "Fresh Full install can run `/roadmap` or its generated platform equivalent against seeded project roadmap state."
    - "Fresh Full install reports supervised project-autonomy semantics for autonomous-auto and does not advertise root self-development."
    - "Fresh Full install `.gitignore` excludes local/private runtime files while preserving tracked examples/templates."
    - "Product release smoke fails if installed prompts reference missing runtime dependencies."
    - "Product release smoke fails if local/private runtime files are copied, tracked, or left unignored in a fresh consumer project."
    - "Freshness check distinguishes approved release, public main, and root dev, and blocks parity claims when they diverge."
  non_goals:
    - "Do not copy root `.azoth/` runtime state verbatim into consumer projects."
    - "Do not publish private cockpit, backup, memory, gate, claim, or handoff artifacts."
    - "Do not claim root HEAD is the published release until the public sync gate runs."
    - "Do not implement broad release automation in this proposal artifact alone."
