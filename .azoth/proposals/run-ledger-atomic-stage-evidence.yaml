      - "Do not change `append`, `claim`, `release-claim`, `park-session`, human-gate replay, closeout, autonomous-loop routing, or planning-bank helpers."
      - "Do not introduce a new ledger schema, JSONL side log, daemon, scheduler, or repository-wide lock manager."
  acceptance_criteria:
    - "A focused test in `tests/test_run_ledger.py` starts from one temp ledger and records two distinct stage spawns for the same run through `record_stage_spawn`; after both calls finish, the ledger contains both `stage_spawns` rows and `validate_ledger` reports no errors."
    - "A focused test in `tests/test_run_ledger.py` starts from one temp ledger and records two distinct stage summaries for the same run through `record_stage_summary`; after both calls finish, the ledger contains both `stage_summaries` rows and `validate_ledger` reports no errors."
    - "A paired test records spawn and summary evidence for at least two stage ids under the protected path, then `require_stage_evidence` succeeds for each stage id."
    - "The implementation protects the whole read/append/validate/write critical section in `scripts/run_ledger.py`, not only `_write_ledger` or final `Path.replace`."
    - "If the protection cannot be acquired within the bounded timeout or detects an unsafe stale write, `record-spawn` and `record-summary` fail closed with an actionable error that names the ledger path and retry/serialization expectation."
