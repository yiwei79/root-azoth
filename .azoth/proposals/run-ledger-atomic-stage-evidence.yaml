proposal_schema_version: 1
created_at: "2026-04-25T20:55:00Z"
session_id: "2026-04-25-autonomous-auto-run-ledger-atomic-stage-evidence-2"
backlog_id: "P6-003"
title: "Run-ledger serialized stage evidence writes"
summary: >
  Autonomous-auto now treats delegated-stage evidence as part of the operator-visible
  audit trail: child scopes must record `stage_spawns`, record `stage_summaries`,
  and later pass `require-stage-evidence` before downstream progress is trusted.
  A same-day autonomous-auto self-capture found that parallel `record-spawn` and
  `record-summary` calls can each report success while clobbering another writer's
  evidence row, because the helpers read the whole YAML ledger, append in memory,
  validate, and replace the whole file without protecting the full critical section.
  Current roadmap truth makes this a narrow run-state reliability follow-on, not
  another INI-EVI-002 planning-bank slice and not a broad autonomous-auto lifecycle
  rewrite: preserve the current ledger shape and fix only the stage-evidence writers
  that autonomous-auto relies on for auditability.
status: draft
decision_refs:
  - D11
  - D21
  - D23
  - D46
  - D50
  - D52
scope_layers:
  - pipelines
  - mixed
details:
  classification:
    scope: pipelines
    risk: additive
    complexity: medium
    knowledge: known-pattern
  problem:
    defect: >
      Run-ledger stage evidence writes are individually atomic at file-replace
      time, but the read/append/validate/rewrite sequence is not protected
      against stale reads. Two successful writers can each validate and replace
      the ledger from different snapshots, causing the later replace to erase
      the earlier evidence append.
    impact: >
      Autonomous-auto can truthfully use staged subagents and still fail
      `require-stage-evidence` later because spawn or summary rows were lost by
      concurrent ledger writers. That breaks the UX anchor for visible audit
      trail without noise: the operator cannot reconstruct staged execution
      from durable artifacts even though the staged work happened.
    current_campaign_rule: >
      Until this defect is fixed, all `scripts/run_ledger.py record-spawn`,
      `record-summary`, and `require-stage-evidence` calls must run
      sequentially, not through parallel tool batches.
  current_roadmap_truth:
    route_disposition: "hydrate-a-new-narrow-run-state-follow-on"
    not_this:
      - "Not INI-EVI-002: T-018, T-019, T-021, and T-022 are complete; that lane is about planning-bank richness and handoff quality."
      - "Not a repeat of INI-AUTO-001 slice-auto-001-e/T-027: lifecycle discoverability is hydrated separately and should not absorb this implementation."
      - "Not a P1-001 rewrite: the foundational run-ledger/resume protocol is complete and should remain stable."
    recommended_placement:
      initiative_ref: "INI-RST-003"
      title: "True multi-writer safety (write claims and lock enforcement)"
      rationale: >
        The implementation touches run-state multi-writer safety, but the defect
        was discovered through autonomous-auto's stage-evidence UX. Route the
        implementation as a small INI-RST-003 follow-on while keeping the
        motivation and acceptance criteria anchored to autonomous-auto auditability.
    autonomous_auto_ux_anchor_fit:
      improves:
        - "Auditability: staged subagent execution remains reconstructable from `stage_spawns`, `stage_summaries`, and `require-stage-evidence`."
        - "Safety: concurrent writer races fail closed or serialize instead of silently erasing evidence."
        - "Low cognitive load: operators stop seeing confusing replay needs caused by mechanical ledger loss."
      intentionally_deferred:
        - "Continuation policy, lifecycle routing, wakeup behavior, campaign reports, and initiative-bank hydration."
  evidence_refs:
    - path: ".azoth/inbox/session-reflection-2026-04-25-autonomous-auto-ledger-serialization.jsonl"
      line: 1
      note: >
        Validated process-control reflection: parallel record calls reported
        success, `require-stage-evidence` later missed rows, and sequential replay
        restored ledger truth.
    - path: ".azoth/roadmap.yaml"
      lines: "203-233"
      note: >
        INI-RST-003 is the existing run-state multi-writer safety placement.
    - path: ".azoth/roadmap.yaml"
      lines: "536-586"
      note: >
        INI-EVI-002 is complete through T-022 and should not receive this run-ledger
        implementation slice.
    - path: ".azoth/initiative-banks/INI-AUTO-001.yaml"
      lines: "652-681"
      note: >
        INI-AUTO-001 slice-auto-001-e/T-027 is already hydrated as lifecycle
        discoverability; this proposal should not repeat that route.
    - path: ".azoth/roadmap-specs/v0.2.0/AUTONOMOUS-AUTO-UX-EXPERIENCE.md"
      lines: "107-126"
      note: >
        Auditability, safety, and low cognitive load are explicit autonomous-auto
        UX anchors.
    - path: "scripts/run_ledger.py"
      lines: "99-108"
      note: >
        Ledger writes use a PID temp file followed by replace, making each replace
        atomic but not protecting stale read/modify/write windows.
    - path: "scripts/run_ledger.py"
      lines: "1015-1049"
      note: >
        `record_stage_spawn` and `record_stage_summary` append evidence through
        load/append/validate/rewrite flows.
    - path: "tests/test_run_ledger.py"
      lines: "980-1049"
      note: >
        Existing focused stage-evidence tests are the right home for the regression.
  implementation_options:
    file_lock:
      description: >
        Acquire an exclusive lock around the full ledger read/append/validate/write
        critical section for stage-evidence writers.
      pros:
        - "Smallest behavioral change."
        - "Keeps the current YAML ledger shape and validation flow."
        - "Easy to regression-test with concurrent record calls."
      cons:
        - "Requires careful cross-platform lock behavior and bounded timeout messaging."
      recommendation: "Recommended next slice."
    stale_write_guard:
      description: >
        Capture file metadata before mutation and reject the write if the on-disk
        ledger changed before replace.
      pros:
        - "Fails closed with an explicit retry path instead of blocking indefinitely."
        - "Can complement a future lock."
      cons:
        - "Callers still need retry or serialization handling."
        - "Metadata-only checks can be subtle across filesystems."
      recommendation: "Acceptable fallback only if simple locking is not viable."
    append_only_stage_evidence_log:
      description: >
        Move stage evidence to an append-only JSONL or per-run evidence log and
        derive ledger views from that log.
      pros:
        - "Naturally reduces whole-file clobber risk."
        - "Improves audit history for delegated-stage evidence."
      cons:
        - "Larger schema and read-path migration."
        - "Too broad for the first repair slice."
      recommendation: "Defer."
