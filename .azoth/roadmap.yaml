  - task_ref: P1-020
    spec_ref: null
    phase: v0.2.0-p3
    status: complete
    role: historical
  priority: high
  summary: 'Store raw episode context verbatim in M3 before any summarisation or compression.
    Building the episodic index on full signal avoids the compress-before-index regression
    observed in mempalace (96.6% → 84.2% when compression precedes ingestion). Azoth
    M3 is currently append-only JSONL with no vector index; this initiative scopes
    the policy and tooling to enforce verbatim storage as the baseline.

    '
  research_ref: RP-MEM-A
  decision_ref:
  - D11
  - D45
