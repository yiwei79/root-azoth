# Active task backlog — ordered by priority
# Status: pending | in_progress | blocked | complete
tasks:
  - id: P3-001
    title: "Define 10 agent archetypes in agents/ directory"
    priority: 1
    status: in_progress
    decision_ref: D7
    description: "Create .md definitions for 10 agents across 4 tiers: Core (architect, planner, implementer, reviewer), Research (explorer, analyst), Meta (self-improver, evaluator), Utility (documenter, tester). Initial draft complete with External Analysis refinements. Remaining: targeted online research for behavioral depth."
    blocked_by: null

  - id: P3-002
    title: "Create pipeline YAML schema"
    priority: 2
    status: pending
    decision_ref: D6
    description: "Define the declarative pipeline schema for Layer 3 orchestration"
    blocked_by: null

  - id: P3-003
    title: "Implement pipeline presets as YAML files"
    priority: 3
    status: pending
    decision_ref: [D28, D23]
    description: "Create 8 pipeline preset files: full, deliver, hotfix, docs, research, review, refactor, auto"
    blocked_by: [P3-002]

  - id: P3-004
    title: "Auto-pipeline router (LLM-as-router)"
    priority: 4
    status: pending
    decision_ref: D23
    description: "Implement the auto-detection logic that selects pipeline preset based on goal"
    blocked_by: [P3-003]

  - id: P3-005
    title: "Define Stage 6 quality rubric for structured content in delivery pipelines"
    priority: 5
    status: pending
    decision_ref: [D21, D44]
    description: "The full pipeline's Stage 6 (Architect Review) needs explicit quality criteria for structured content outputs — minimum capability depth, governance constraint coverage, interaction pattern completeness. Prevents shallow first-pass output from passing the delivery gate. Implement as a scored rubric embedded in the pipeline YAML schema."
    blocked_by: [P3-002]

  - id: P3-006
    title: "Build context-recall skill (memory read interface)"
    priority: 6
    status: pending
    decision_ref: [D11, D45]
    description: "Layer 1 skill implementing the D45 read path: extract tags from current goal, grep M3/M2, rank matches, surface top 1-3 episodes before planning. Complements the remember skill (write interface). Adapted from SupplyGrowth episodic-memory-retrieval pattern."
    blocked_by: null

  - id: P5-001
    title: "Commit-time governance enforcement hooks"
    priority: 1
    status: pending
    phase: 5
    decision_ref: D43
    description: "Pre-commit hooks that mechanically enforce CLAUDE.md git conventions: strip Co-Authored-By trailers, validate commit message format. Moves governance rules from agent memory (driftable) to tool execution (deterministic). Directly addresses the trust enforcement gap noted in the Phase 5 risk register — rules that currently live only in CLAUDE.md and memory files cannot survive context window drift."
    blocked_by: null

  - id: P1.5-CLEANUP
    title: "M3 episode count sync in azoth.yaml"
    priority: 6
    status: pending
    decision_ref: D11
    description: "azoth.yaml shows episodes: 0 but .azoth/memory/episodes.jsonl has entries. Session closeout should update the count."
    blocked_by: null

