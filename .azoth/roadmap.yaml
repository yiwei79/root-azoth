# Azoth Versioned Roadmap (D48)
# Supersedes the flat-task format of roadmap.yaml (D39).
# On macOS (case-insensitive FS), ROADMAP.yaml and roadmap.yaml are the same file.
#
# COMPATIBILITY: The top-level `current_phase` and `tasks:` fields are preserved for
# older tooling. Prefer `active_version` + `versions[]` + `.azoth/backlog.yaml` (D48).
# Task-id semantics: existing `v0.2.0` task ids include a stable legacy `P1-*` namespace.
# Do not infer the current milestone-local phase from that prefix; use `active_version`,
# the containing `versions[]` block, and backlog `target_version` for slice semantics.
# Forward rule: keep historical `P1-*` ids frozen, but mint all new roadmap-backed work in
# the neutral `T-{NNN}` namespace. Do not rename historical task ids in place.

# ── Legacy compat fields (kept for drift tests; mirror backlog when possible) ─
current_phase: 2
current_phase_title: "v0.2.0 — swarm · memory · UX (milestone phase 2)"
lifecycle_phase: 8
tasks:
  # Workflow loop — highest priority (new, D47-D51)
  - id: BL-002
    title: "Scope-gate: PreToolUse hook for builder-mode enforcement (P3-008)"
    priority: 1
    status: complete
    decision_ref: [D43, D50]
    target_layer: M1
    delivery_pipeline: governed
    description: >
      PreToolUse hook on Write/Edit that reads .azoth/scope-gate.json.
      If flag absent or expired, hook exits non-zero and prints the
      intent-declaration reminder. Moves confirm-before-building rule
      from agent memory (3 violations: ep-022, ep-028, ep-029) to
      tool execution (deterministic). Part of closed workflow loop (D50).
    blocked_by: null

  - id: BL-004
    title: "Update /next for ROADMAP.yaml + backlog.yaml + scope card (D50)"
    priority: 1
    status: complete
    decision_ref: [D47, D48, D50]
    target_layer: M1
    delivery_pipeline: governed
    description: >
      Rewrite /next to: (1) read ROADMAP.yaml active version tasks,
      (2) read backlog.yaml for operational priorities, (3) output a
      scope card (1 primary + max 2 secondary goals), (4) write
      scope-gate.json on human approval. Validator: reject scope cards
      mixing M1-targeted items with runtime tasks. Deprecates flat tasks:.
      Priority 1 (bootstrap gap): scope-gate hook is live but scope-gate.json
      requires manual edits until BL-004 delivers the /next scope card writer.
    blocked_by: [BL-002]

  - id: BL-003
    title: "Update /intake for 3-axis triage (D49)"
    priority: 2
    status: complete
    decision_ref: [D33, D49]
    target_layer: M1
    delivery_pipeline: governed
    description: >
      Extend D33 step 3: human simultaneously decides M3 action +
      M2 candidate flag + backlog item needed. Update intake.md to
      present 3-axis card format and append to backlog.yaml on
      human approval of a backlog item draft.
    blocked_by: [BL-002]

  - id: BL-001
    title: "Fix session-closeout write batching"
    priority: 3
    status: complete
    target_layer: M1
    decision_ref: null
    delivery_pipeline: governed
    description: >
      Refactor session-closeout to sequence Write/Edit calls with
      explicit checkpoints, or batch state updates into a single file.
      Document adding Write/Edit to settings.local.json allow list for
      restrictive permission models.
    blocked_by: null

  - id: BL-005
    title: "Formalize M2→M1 promotion path in governance doc (D51)"
    priority: 4
    status: complete
    decision_ref: D51
    target_layer: infrastructure
    delivery_pipeline: standard
    description: >
      Add M2→M1 promotion path to kernel/GOVERNANCE.md and
      PROMOTION_RUBRIC.md: trigger = target_layer M1 backlog item +
      /deliver-full pipeline. Document the between-sessions-only rule.
    blocked_by: null

  # Phase 3 — original tasks
  - id: P3-004
    title: "Auto-pipeline router (LLM-as-router)"
    priority: 5
    status: complete
    decision_ref: D23
    description: "Implement the auto-detection logic that selects pipeline preset based on goal"
    blocked_by: [P3-003]

  - id: P3-005
    title: "Define Stage 6 quality rubric for structured content in delivery pipelines"
    priority: 6
    status: complete
    decision_ref: [D21, D44]
    description: >
      The full pipeline Stage 6 (Architect Review) needs explicit quality criteria
      for structured content: minimum depth thresholds, governance constraint
      coverage, interaction pattern completeness.
    blocked_by: [P3-002]

  - id: P3-006
    title: "Build context-recall skill (memory read interface)"
    priority: 6
    status: complete
    decision_ref: [D11, D45]
    description: >
      Layer 1 skill implementing the D45 read path: extract tags from current goal,
      grep M3/M2, rank matches, surface top 1-3 episodes before planning.
    blocked_by: null

  - id: P1.5-CLEANUP
    title: "M3 episode count sync in azoth.yaml"
    priority: 7
    status: complete
    decision_ref: D11
    description: "azoth.yaml shows episodes: 0 but .azoth/memory/episodes.jsonl has entries."
    blocked_by: null

# ── Versioned structure (D48 + D53) — phase-aligned, delivery-triggered bumps ──
schema_version: 2
active_version: v0.2.0-p2
task_id_policy:
  legacy_milestones:
    - milestone: v0.2.0
      prefix: P1
      width: 3
      frozen: true
  future_default:
    prefix: T
    width: 3

# D53: Bump rules (0.0.PHASE.PATCH through v0.0.7; then 0.1.MILESTONE_PHASE.PATCH under v0.2.0)
# - patch: 0.0.N.XX → +1 every delivery; post-1.0: 0.1.P.M → 0.1.P.M+1 + active v0.2.0-pP current_patch +1
# - phase: 0.0.N.M → 0.0.N+1.1; post-1.0: 0.1.P.M → 0.1.P+1.0 + active_version v0.2.0-p(P+1)
# - release: v0.0.7 active → close v0.0.7 + v0.1.0, tag public v0.1.0, then move repo to 0.1.1.0 and activate v0.2.0-p1
# - git tag proposed at release only (user-confirmed, never auto-pushed)

