  - id: INI-MEM-002
    title: "Temporal validity windows for M2 patterns"
    category: memory
    theme: C
    dimensions:
      themes: [C]
      categories: [memory]
      tracks: [temporal-validity, m2-governance]
    phase: null
    priority: medium
    slices: []
    summary: >
      Add optional `valid_from` / `valid_to` fields to M2 pattern entries with point-in-time
      query support, replacing implicit recency-by-modification-date with explicit temporal
      scoping. Inspired by mempalace's SQLite triple store
      (`AND (valid_from IS NULL OR valid_from <= ?) AND (valid_to IS NULL OR valid_to >= ?)`).
      D42 kernel immutability: invalidation of M2 patterns remains HITL-only; this initiative
      adds temporal metadata, not auto-expiry.
    research_ref: "RP-MEM-C"
    decision_ref: [D11, D42]

  - id: INI-MEM-003
