      categories: [memory]
      tracks: [vector-retrieval, context-recall]
    phase: null
    priority: medium
    slices: []
    summary: >
      Introduce an optional vector backend (ChromaDB or SQLite-vec) for M3 episodic recall,
      complementing the current keyword/recency scan. Flat metadata tagging (no Python class
      hierarchy) mirrors mempalace's single "mempalace_drawers" ChromaDB collection. Hybrid
