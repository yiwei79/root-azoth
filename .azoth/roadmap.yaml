  slices: []
  summary: 'Add optional `valid_from` / `valid_to` fields to M2 pattern entries with
    point-in-time query support, replacing implicit recency-by-modification-date with
    explicit temporal scoping. Inspired by mempalace''s SQLite triple store (`AND
    (valid_from IS NULL OR valid_from <= ?) AND (valid_to IS NULL OR valid_to >= ?)`).
    D42 kernel immutability: invalidation of M2 patterns remains HITL-only; this initiative
    adds temporal metadata, not auto-expiry.

    '
  research_ref: RP-MEM-C
