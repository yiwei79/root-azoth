# ── Initiatives (schema_version: 2) ──────────────────────────────────────────
# Phase-agnostic goal items. phase: null until triage assigns a milestone.
# Grouped by theme then category. IDs: INI-{CATEGORY_PREFIX}-{NNN}
# Themes: A=run-state, B=pipeline, C=memory, D=ux/platform, E=efficiency
# Terminology: initiative (goal-level) ≠ backlog item (concrete, ready-to-pick) ≠ scope (active, gated).
initiatives:

  # ── Theme A: run-state ─────────────────────────────────────────────────────
  - id: INI-RST-001
    title: "Declarative swarm / eval-wave specification"
    category: run-state
    theme: A
    phase: null
    priority: high
    task_ref: P1-002
    blocked_by: [P1-001]
    summary: >
      YAML/schema spec for declarative swarm and eval-wave definitions alongside
      e2e-swarm-eval-loop.md. Moves pipeline orchestration from prose workflows to
      structured, lintable declarations. Depends on run ledger (P1-001 in v0.2.1).
    decision_ref: [D23, D28]
    spec_ref: ".azoth/roadmap-specs/v0.2.0/P1-002.yaml"

  - id: INI-RST-002
    title: "Control-plane surfacing in welcome (gates + optional ledger)"
    category: run-state
    theme: A
    phase: null
    priority: medium
    task_ref: P1-004
    blocked_by: [P1-001]
    summary: >
      TTL visibility and active run summary in welcome dashboard when ledger exists.
      Surfaces scope gate expiry, pipeline gate status, and optional run ledger summary
      in the session cockpit. Depends on run ledger (P1-001 in v0.2.1).
    decision_ref: [D52, D50]
    spec_ref: ".azoth/roadmap-specs/v0.2.0/P1-004.yaml"

  - id: INI-RST-003
    title: "True multi-writer safety (write claims and lock enforcement)"
    category: run-state
    theme: A
    phase: null
    priority: high
    task_ref: P1-015
    blocked_by: [P1-014]
    summary: >
      Add explicit write-claim and lock enforcement for concurrent sessions across
      Copilot, Claude Code, Antigravity, and other harnesses. The current model can
      track many sessions but projects only one active scope gate for writes; this
      initiative defines the next step: session leases or finer-grained file claims,
      conflict detection, handoff rules, and mechanical enforcement so parallel
      writers are safe rather than advisory.
    decision_ref: [D21, D46, D50]
    spec_ref: ".azoth/roadmap-specs/v0.2.0/P1-015.yaml"

  # ── Theme B: pipeline ──────────────────────────────────────────────────────
  - id: INI-PPL-001
    title: "auto-router L2 / self-improve lane"
    category: pipeline
    theme: B
    phase: null
    priority: medium
    task_ref: P1-008
    summary: >
      Stage 0 composition_rules for refinement goals; optional L2 self-improve lane
      in auto-router that routes low-risk refinement goals through a lighter pipeline
      (no full planner/builder/evaluator chain). Reduces overhead for iterative work.
    decision_ref: [D23, D44]
    spec_ref: ".azoth/roadmap-specs/v0.2.0/P1-008.yaml"

  - id: INI-PPL-002
    title: "Eval / eval-swarm wiring drift hardening"
    category: pipeline
    theme: B
    phase: null
    priority: medium
    task_ref: P1-010
    summary: >
      Tests and mirror surfaces for eval/eval-swarm stay aligned across
      skills/agentic-eval, skills/eval-swarm, and pipeline presets. Drift detection
      prevents silent divergence between the eval skill and its swarm escalation path.
    decision_ref: [D46]
    spec_ref: ".azoth/roadmap-specs/v0.2.0/P1-010.yaml"

  # ── Theme C: memory ────────────────────────────────────────────────────────
  - id: INI-MEM-001
    title: "Verbatim-first M3 storage strategy"
    category: memory
    theme: C
    phase: null
    priority: high
    summary: >
      Store raw episode context verbatim in M3 before any summarisation or compression.
      Building the episodic index on full signal avoids the compress-before-index regression
      observed in mempalace (96.6% → 84.2% when compression precedes ingestion). Azoth M3
      is currently append-only JSONL with no vector index; this initiative scopes the policy
      and tooling to enforce verbatim storage as the baseline.
    research_ref: "RP-MEM-A"
    decision_ref: [D11, D45]

  - id: INI-MEM-002
    title: "Temporal validity windows for M2 patterns"
    category: memory
    theme: C
    phase: null
    priority: medium
    summary: >
      Add optional `valid_from` / `valid_to` fields to M2 pattern entries with point-in-time
      query support, replacing implicit recency-by-modification-date with explicit temporal
      scoping. Inspired by mempalace's SQLite triple store
      (`AND (valid_from IS NULL OR valid_from <= ?) AND (valid_to IS NULL OR valid_to >= ?)`).
      D42 kernel immutability: invalidation of M2 patterns remains HITL-only; this initiative
      adds temporal metadata, not auto-expiry.
    research_ref: "RP-MEM-C"
    decision_ref: [D11, D42]

  - id: INI-MEM-003
    title: "Vector retrieval layer for M3 context-recall"
    category: memory
    theme: C
    phase: null
    priority: medium
    summary: >
      Introduce an optional vector backend (ChromaDB or SQLite-vec) for M3 episodic recall,
      complementing the current keyword/recency scan. Flat metadata tagging (no Python class
      hierarchy) mirrors mempalace's single "mempalace_drawers" ChromaDB collection. Hybrid
      retrieval formula (`fused_dist = dist * (1.0 - weight * keyword_overlap)`) should live
      in production code, not only benchmark scripts. The optional flag keeps the JSONL path
      as the zero-dependency default.
    research_ref: "RP-MEM-B"
    decision_ref: [D11, D45]

  - id: INI-MEM-004
    title: "Memory loop hardening (reinforcement, closeout, session-state)"
    category: memory
    theme: C
    phase: null
    priority: high
    task_ref: P1-006
    summary: >
      W2 parity for memory loop; reinforcement_count semantics in M2 patterns;
      session-state handoff integrity across closeout. Ensures /session-closeout
      reliably writes M3, updates session-state.md, and increments reinforcement
      counts without silent failures.
    decision_ref: [D11, D49, D51]
    spec_ref: ".azoth/roadmap-specs/v0.2.0/P1-006.yaml"

  - id: INI-MEM-005
    title: "Elasticity: M2/M3 recall governance"
    category: memory
    theme: C
    phase: null
    priority: medium
    task_ref: P1-007
    summary: >
      Tags, decay rules, contradiction handling, and consumer boundary governance for
      M2/M3 recall. Prevents memory bloat and stale pattern surfacing without requiring
      constant manual pruning. Consumer boundary: defines what a downstream azoth install
      inherits vs builds fresh.
    decision_ref: [D45]
    spec_ref: ".azoth/roadmap-specs/v0.2.0/P1-007.yaml"

  # ── Theme D: ux / platform ─────────────────────────────────────────────────
  - id: INI-UX-001
    title: "Phone-friendly output (narrow terminals)"
    category: ux
    theme: D
    phase: null
    priority: low
    task_ref: P5-006
    deferred_from: "v0.0.5 Phase 5 — beyond v0.1.0 roadmap (2026-04-08)"
    summary: >
      Compact/width-aware layouts for welcome dashboard and roadmap panels in narrow
      terminals (mobile SSH, phone-sized viewports). Graceful degradation when terminal
      width < 80 columns without breaking structured output.
    decision_ref: [D48, D52]
    spec_ref: ".azoth/roadmap-specs/v0.2.0/P5-006.yaml"

  - id: INI-PLT-001
    title: "Memory operation platform parity"
    category: platform
    theme: D
    phase: null
    priority: low
    summary: >
      Document and validate that M3 append, M2 promote, and context-recall operations produce
      consistent, tested results across Claude Code, Cursor, and Copilot adapter paths.
      Mempalace highlighted production-vs-benchmark divergence (hybrid retrieval only in
      benchmark scripts, not searcher.py). Azoth must not ship memory features that work in
      the development surface but silently degrade under adapter paths.
    research_ref: "RP-PLT-A"
    decision_ref: [D42, D46, D52]

  - id: INI-PLT-002
    title: "Cursor session-open parity"
    category: platform
    theme: D
    phase: null
    priority: medium
    task_ref: P1-009
    summary: >
      Documented and validated automation path for Cursor session-open that reaches
      parity with Claude Code's SessionStart hook. Covers azoth-memory.mdc rule loading,
      session-orientation.txt fallback, and Rich UI access via integrated terminal.
    decision_ref: [D52, D46]
    spec_ref: ".azoth/roadmap-specs/v0.2.0/P1-009.yaml"

  - id: INI-PLT-003
    title: "Explicit default orchestrator role across Claude Code and Copilot"
    category: platform
    theme: D
    phase: null
    priority: medium
    task_ref: P1-013
    summary: >
      Claude Code supports a session-wide main agent, but Azoth does not currently set one,
      so `/auto` and related pipelines run in the default session agent and only reach Azoth
      archetypes through explicit subagent spawns. This initiative defines an explicit Azoth
      orchestrator default for Claude Code and an equivalent default-agent orchestration role
      for Copilot adapter surfaces so pipeline ownership is mechanical rather than implicit.
    decision_ref: [D21, D23, D46]
    spec_ref: ".azoth/roadmap-specs/v0.2.0/P1-013.yaml"

  - id: INI-PLT-004
    title: "Antigravity workspace bootstrap adapter"
    category: platform
    theme: D
    phase: null
    priority: high
    task_ref: P1-014
    summary: >
      Bootstrap a practical Antigravity-native Azoth surface inside the repo using
      `.agents/rules/`, `.agents/workflows/`, and `.agents/skills/`. Target standard
      infrastructure work first, keep `.azoth/` authoritative, and defer kernel-template
      deploy integration until the workspace bootstrap proves operational.
