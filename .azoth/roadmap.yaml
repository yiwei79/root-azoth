  status: active
  current_patch: 11
  goal: 'Stabilization and rollout: freeze new initiative expansion, repair release
    truth, prove product extraction, publish a clean azoth product surface, and define
    the personal root control-plane deployment model. The first stable release must
    also prove included features end-to-end, including the campaign-bounded autonomous
    learning/self-heal contract.'
  phase_scope:
  - 4
  themes:
  - release
  - productization
  - control-plane
  freeze_policy:
    no_new_initiatives: true
    allowed_work:
    - release_readiness_repairs
    - learning_system_stabilization
    - product_extraction_and_publish
    - personal_control_plane_deployment_model
    - documentation_and_ci_rollout
    - verification_and_release_candidate_closeout
    deferred_work_rule: All new feature, autonomy, memory, planning-bank, and platform
      ideas remain unscheduled proposal or initiative-bank evidence until this phase
      closes.
  note: This phase is a stabilization freeze, not a feature-growth phase. It exists
    to make Azoth safe to use for real projects by separating root-azoth as the private
    development workshop, azoth as the clean published product, and the operator personal
    root as an installed Azoth control-plane deployment. Stable release closeout requires
    a green full root test suite and evidence that autonomous-auto learning/self-heal
    is supervised, campaign-bounded, and still blocked by fresh approval and protected-boundary
    gates. Inbox reflections remain governed evidence unless a route is explicitly
    safe, campaign-bounded, and applied through strategy-preflight; the first stable
    release must not imply silent inbox draining or background self-modification.
