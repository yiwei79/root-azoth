schema_version: 1
artifact_type: project_genesis_goal_mode_rehearsal
initiative_ref: INI-GEN-001
candidate_slice_ref: slice-gen-001-a
task_ref: GEN-001-A
status: complete
created_at: "2026-05-19T22:00:10Z"
session_id: 2026-05-19-ini-gen-project-genesis-rehearsal
purpose: >
  Rehearse the Project Genesis starter experience under Goal-mode authority
  across music production, bachelor thesis, and agent-context examples while
  keeping every protected or external plane non-mutating.
authority_boundary:
  opened_by: goal-mode-self-approval
  scope_class: planning_seed
  allowed_outputs:
    - root-local planning notes
    - starter prompt drafts
    - validation receipt
    - initiative-bank readiness update
  bookkeeping_writes_allowed:
    - .azoth/scope-gate.json
    - .azoth/pipeline-gate.json
    - .azoth/run-ledger.local.yaml
  forbidden_outputs:
    - kernel_governance_mutation
    - kernel_template_mutation
    - roadmap_backlog_spec_hydration
    - release_publishing
    - public_azoth_mutation
    - personal_cockpit_mutation
    - project_local_mutation
    - dependency_or_credential_changes
    - destructive_actions
    - code_changes
    - broad_productization_gate
four_plane_rehearsal:
  root_azoth:
    role: architecture, proposal, initiative-bank, and validation source of truth
    this_slice_behavior: >
      Owns the rehearsal artifact, acceptance mapping, and readiness update.
    mutation_in_this_slice: true
    mutation_scope:
      - .azoth/research/ini-gen-001-project-genesis-rehearsal.yaml
      - .azoth/handoffs/goal-mode/2026-05-19-slice-gen-001-a-validation-receipt.yaml
      - .azoth/initiative-banks/INI-GEN-001.yaml
  public_azoth:
    role: reusable installed Azoth core and starter-template distribution plane
    this_slice_behavior: >
      Referenced only as a future source-profile and template destination.
    mutation_in_this_slice: false
    safe_next_action: decide later whether starter templates graduate to public Azoth
  personal_cockpit:
    role: operator-facing index and safe-open router across personal spaces
    this_slice_behavior: >
      Rehearsed as pointer-only readback, not as a writer into any project.
    mutation_in_this_slice: false
    safe_next_action: keep cockpit route rehearsal pointer-only until opt-in exists
  project_local_space:
    role: per-project context, prompts, decisions, and receipts
    this_slice_behavior: >
      Rehearsed through starter prompts only. No music, thesis, or agent-context
      project repository or local space was created or edited.
    mutation_in_this_slice: false
    safe_next_action: create a project-local starter packet template before any local mutation
domain_rehearsals:
  - domain_id: music_production
    project_shape: creative exploration and production practice
    starter_prompt: >
      Help me shape this music-production space: capture my current sound,
      reference tracks, tools, unfinished ideas, learning questions, and next
      low-friction experiments without forcing it into software-task language.
    starter_packet_focus:
      - sound and reference vocabulary
      - tools and session habits
      - unfinished sketches
      - learning questions
      - next low-friction experiments
    safe_boundary: discovery and creative context only; no project-management hydration
  - domain_id: bachelor_thesis
    project_shape: academic research and writing program
    starter_prompt: >
      Help me continue my bachelor thesis: map research question, advisor
      constraints, sources, deadlines, argument structure, writing gaps, and
      the next focused work block.
    starter_packet_focus:
      - research question
      - advisor constraints
      - literature and source state
      - deadline map
      - argument and writing gaps
    safe_boundary: academic planning only; no citation, source, or document mutation
  - domain_id: agent_context_project
    project_shape: agent architecture and context-management experiment
    starter_prompt: >
      Help me reconnect this agent/context-management project to Azoth:
      identify its design intent, current code/artifact state, open risks,
      compatibility with Azoth, and safe next experiments.
    starter_packet_focus:
      - design intent
      - current code and artifact pointers
      - context lifecycle questions
      - compatibility risks
      - safe next experiments
    safe_boundary: readback and experiment framing only; no repo mutation
acceptance_map:
  - criterion: Proposal and initiative bank validate.
    result: pass_after_local_validation
    evidence_refs:
      - .azoth/proposals/project-genesis-goal-mode-autonomy.yaml
      - .azoth/initiative-banks/INI-GEN-001.yaml
  - criterion: Goal-mode allowed and forbidden outputs are explicit.
    result: pass
    evidence_refs:
      - .azoth/scope-gate.json
      - .azoth/research/ini-gen-001-project-genesis-rehearsal.yaml#authority_boundary
  - criterion: Four-plane responsibilities are explicit.
    result: pass
    evidence_refs:
      - .azoth/research/ini-gen-001-project-genesis-rehearsal.yaml#four_plane_rehearsal
  - criterion: Music production, bachelor thesis, and agent-context starter prompts are present.
    result: pass
    evidence_refs:
      - .azoth/research/ini-gen-001-project-genesis-rehearsal.yaml#domain_rehearsals
  - criterion: Validation receipt records no public, cockpit, project, kernel, or governance mutation.
    result: pass_after_local_validation
    evidence_refs:
      - .azoth/handoffs/goal-mode/2026-05-19-slice-gen-001-a-validation-receipt.yaml
outcome:
  result: slice-gen-001-a complete as a planning-seed rehearsal
  next_candidate_slice: slice-gen-001-b
  hydration_recommendation: >
    Continue with the project-local starter packet template as a root-local
    planning artifact. Do not hydrate roadmap, backlog, or project-local state
    until a later human-approved managed-mode slice exists.
  remaining_questions:
    - Which starter packet fields should be optional for creative projects?
    - Should the first reusable template remain root-only or graduate to public Azoth?
