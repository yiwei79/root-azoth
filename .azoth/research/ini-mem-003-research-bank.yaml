  synthesis:
    readiness_effect: >
      This fixture contract plus the selected executable surface resolves the
      open readiness blockers for slice-mem-003-a. Hydration is safe only for
      planning artifacts that scaffold the zero-dependency recall-quality spine.
    protected_boundaries:
    - No dependency or vector backend work without explicit future approval.
    - No network expansion.
    - No M2 invalidation, rewrite, or auto-expiry.
    - No raw inbox, personal-root, or unreviewed source indexing.
    - No /start or /next integration in the first implementation slice.
