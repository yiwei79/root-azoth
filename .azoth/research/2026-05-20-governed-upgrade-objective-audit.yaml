current_mode_readiness:
  expected_profile_outcome:
    guide: ready
    assisted: ready
    managed: requires_authority
    governed_autonomy: requires_authority
  interpretation: >
    The readiness profile correctly refuses to advertise managed or governed
    autonomy without project-local receipt and autonomy budget authority.
remaining_decision:
  blocking_question: >
    Which target-plane adoption should be approved first: public release
    extraction, cockpit pointer registration, project-local starter packet
    creation, a new improvement campaign, or defer?
  decision_brief_ref: .azoth/proposals/governed-upgrade-target-plane-decision-brief.yaml
  recommended_option: approve_cockpit_pointer_registration
  why: >
    It most directly advances the central cockpit/control-point goal while
    staying pointer-only and avoiding project-local or release writes until the
    operator grants that authority.
