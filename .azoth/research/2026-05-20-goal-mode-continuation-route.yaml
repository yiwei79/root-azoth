continuation_policy:
  rule_1_lane_completion_is_not_goal_completion: >
    A completed child lane or target-plane slice must not call update_goal unless
    the full objective matrix is complete and verified.
  rule_2_goal_mode_should_continue_without_manual_approval_for_safe_work: >
    When the active Goal still maps to root-local planning, readiness, research,
    receipt, or bounded repo-repair work, use Goal-mode self-approval rather
    than stopping for another chat approval.
  rule_3_protected_planes_remain_named_gates: >
    Goal-mode self-approval does not authorize kernel/governance mutation,
    roadmap/backlog/spec hydration, public Azoth mutation, personal cockpit
    mutation, project-local mutation, release publishing, dependencies,
    credentials, destructive actions, pushes, or tags.
  rule_4_continue_by_route_not_by_guess: >
    After each lane, record whether the next step is self-servable, human-gated,
    or complete. If self-servable, open it; if human-gated, stop with the exact
    target-plane approval required.

