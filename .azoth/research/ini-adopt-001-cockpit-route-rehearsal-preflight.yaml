no_write_simulation_plan:
  fixture_strategy: >
    Build a temporary cockpit project-index fixture from the three route
    fixtures, then run root-local render/check assertions equivalent to
    scripts/cockpit_menu.py and scripts/cockpit_ux_simulate.py. The simulation
    must compare cockpit and project git status before and after.
  required_assertions:
    - rendered menu includes Mode, Readiness, Freshness, Authority, Pointer, Installed assets, Missing assets, Approval, Write claim, Next safe action, and Stop reason
    - rendered handoff includes a project-session prompt
    - output contains no forbidden project context fields
    - cockpit git status does not change
    - project git status does not change
    - route write is not performed
  suggested_command_after_approval: >
    python3 scripts/cockpit_ux_simulate.py --root /Users/yiwei/GithubRepos/yiwei-azoth-cockpit --project <approved_project_id>
