purpose: >
  Define the root-local, no-write cockpit route rehearsal for Project Genesis
  spaces before any personal cockpit repository mutation or project-local
  context loading is approved.
authority_boundary:
  root_azoth_may_define:
    - pointer-only route readback fields
    - safe-open project-session prompts
    - no-write cockpit simulation checklist
    - validation receipt for this preflight
  forbidden_in_this_slice:
    - personal_cockpit_mutation
    - project_local_mutation
    - public_azoth_mutation
    - roadmap_backlog_spec_hydration
    - kernel_governance_mutation
    - code_changes
    - release_publishing
route_readback_contract:
  source_refs:
    - .azoth/research/t-059-deployment-readiness-mode-matrix.yaml#cockpit_readback_contract
    - scripts/cockpit_menu.py#READBACK_PROJECT_FIELDS
    - docs/personal-control-plane/MULTI-CONTROL-PANEL-UX-ANCHOR.md#cockpit-main-menu-and-context-firewall
  required_fields:
    - project_id
    - title
    - repo_path
    - default_branch
    - tracking_ref
    - privacy_class
    - profile_mode
    - project_pointer
    - authority_plane
    - selected_mode
    - readiness_state
    - freshness_status
    - installed_asset_classes
    - missing_asset_classes
    - approval_scope
    - active_write_claim
    - next_safe_action
    - stop_reason
    - handoff_receipt_ref
    - validation_commands
  invariants:
    - profile_mode is pointer_only
    - authority_plane is personal_cockpit for pointer display, not project_local authority
    - selected_mode remains guide or assisted until a project-local receipt exists
    - active_write_claim is false for menu display
    - no source_files, code_summaries, dependency_inventory, secrets, or retrieval_index fields
