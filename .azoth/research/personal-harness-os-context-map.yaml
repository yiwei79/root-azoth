    title: Codex control-plane advisory integration
    approval_need: fresh root-local gate naming codex_control_plane files
  - id: harness-003
    title: Cockpit pointer-only readback rehearsal
    approval_need: fresh cockpit authority if writing outside root
  - id: harness-004
    title: Practice rehearsal pack
    approval_need: depends on target project/cockpit writes
