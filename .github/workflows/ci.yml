# Azoth — drift CI (P4-003): repo-wide Ruff, kernel integrity (D2 / GOVERNANCE §4),
# full pytest (D46 deploy parity, adapters, handoff consistency).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      - name: Ruff lint (repo-wide)
        run: python3 -m ruff check .

      - name: Ruff format
        run: python3 -m ruff format --check .

      - name: Kernel integrity (D2 + optional §4)
        run: |
          python3 scripts/kernel-integrity.py
          python3 scripts/kernel-integrity.py --verify-checksums

      - name: Pytest
        run: python3 -m pytest -q
