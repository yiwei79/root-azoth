schema_version: 1
name: session-closeout
display_name: /session-closeout
description: Unified eval + close + sync — run at the end of every session
agent: orchestrator
azoth_effect: write

execution:
  kind: closeout
  waits_for_human_signal: explicit_closeout_intent
  emits:
    - closeout_summary
    - closeout_semantics
    - closeout_checkpoint

arguments:
  accepts_arguments: false
  syntax: /session-closeout

state:
  reads:
    - .azoth/scope-gate.json
    - .azoth/run-ledger.local.yaml
    - .azoth/session-state.md
    - .azoth/final-delivery-approvals.jsonl
    - .azoth/memory/episodes.jsonl
    - .azoth/backlog.yaml
    - .azoth/roadmap.yaml
    - azoth.yaml
  writes:
    - .azoth/memory/episodes.jsonl
    - .azoth/bootloader-state.md
    - .azoth/run-ledger.local.yaml
    - .azoth/scope-gate.json
    - .azoth/session-state.md
    - .azoth/backlog.yaml
    - .azoth/roadmap.yaml
    - .azoth/session-orientation.txt
    - azoth.yaml
    - .claude/settings.json
  outputs:
    - closeout_summary
    - closeout_semantics
    - closeout_checkpoint

governance:
  preconditions:
    - require_live_scope_or_saved_closeout_checkpoint
    - governed_final_delivery_approval_before_first_w1_mutation
    - keep_repo_local_w1_w2_w4_authoritative
  approval_mode: explicit_closeout_intent
  pipeline_gate_behavior: preserve_saved_stage_checkpoint_during_closeout
  target_layer_rule: governed_closeout_fails_closed_before_w1

body:
  mode: canonical_markdown
  source_path: commands/session-closeout/body.md

projection:
  claude:
    kind: native_command_markdown
    output_path: .claude/commands/session-closeout.md
  cursor:
    kind: claude_command_toggle_surface
    output_path: .claude/commands/session-closeout.md
  copilot:
    kind: prompt_markdown
    output_path: .github/prompts/session-closeout.prompt.md
  opencode:
    kind: native_command_markdown
    output_path: .opencode/commands/session-closeout.md
  codex:
    kind: skill_wrapper
    output_path: .agents/skills/azoth-session-closeout/SKILL.md
    metadata_path: .agents/skills/azoth-session-closeout/agents/openai.yaml
  gemini:
    kind: native_command_toml
    output_path: .gemini/commands/session-closeout.toml
  antigravity:
    kind: workflow_markdown
    output_path: .agents/workflows/session-closeout.md

migration:
  phase: canonical_body_batch_3_initiative_exit
  runtime_source_of_truth: commands/session-closeout/command.yaml
  notes:
    - T-004 moves /session-closeout onto the neutral command path.
    - commands/session-closeout/body.md is now the authored semantic body.
    - Generated closeout mirrors remain deployed outputs until azoth-deploy is rerun.

references:
  - .azoth/roadmap-specs/v0.2.0/T-004.yaml
  - docs/CANONICAL_COMMAND_CONTRACT.md
