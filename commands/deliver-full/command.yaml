schema_version: 1
name: deliver-full
display_name: /deliver-full
description: Full pipeline with governance gates — for kernel, governance, or breaking changes
agent: orchestrator
azoth_effect: write

execution:
  kind: pipeline
  waits_for_human_signal: governed_stage_approval
  emits:
    - pipeline_gate
    - governed_review
    - run_checkpoint
    - final_delivery_approval

arguments:
  accepts_arguments: true
  syntax: /deliver-full <goal>

state:
  reads:
    - .azoth/scope-gate.json
    - .azoth/pipeline-gate.json
    - .azoth/run-ledger.local.yaml
    - .azoth/final-delivery-approvals.jsonl
  writes:
    - .azoth/pipeline-gate.json
    - .azoth/run-ledger.local.yaml
    - .azoth/final-delivery-approvals.jsonl
  outputs:
    - governed_review
    - final_delivery_approval

governance:
  preconditions:
    - require_approved_scope
    - governed_human_gates_are_mandatory
    - governed_human_gates_must_advance_runtime_state
  approval_mode: governed_stage_and_final_delivery_approval
  pipeline_gate_behavior: require_matching_pipeline_gate
  target_layer_rule: dedicated_governed_session

runtime:
  governance_mode:
    command_default: governed
    scope_gate_field: governance_mode
    legacy_scope_gate_field: delivery_pipeline
  pipeline_command:
    command_value: deliver-full
    scope_gate_field: pipeline_command
    pipeline_gate_field: pipeline_command
    legacy_pipeline_gate_field: pipeline
    run_ledger_field: pipeline_command
    legacy_run_ledger_field: mode
  approval_consumption:
    helper: scripts/run_ledger.py:consume_human_gate_approval
    durable: true
    same_run_required: true

body:
  mode: legacy_claude_markdown
  source_path: .claude/commands/deliver-full.md

projection:
  claude:
    kind: native_command_markdown
    output_path: .claude/commands/deliver-full.md
  cursor:
    kind: claude_command_toggle_surface
    output_path: .claude/commands/deliver-full.md
  copilot:
    kind: prompt_markdown
    output_path: .github/prompts/deliver-full.prompt.md
  opencode:
    kind: native_command_markdown
    output_path: .opencode/commands/deliver-full.md
  codex:
    kind: skill_wrapper
    output_path: .agents/skills/azoth-deliver-full/SKILL.md
    metadata_path: .agents/skills/azoth-deliver-full/agents/openai.yaml
  gemini:
    kind: native_command_toml
    output_path: .gemini/commands/deliver-full.toml
  antigravity:
    kind: workflow_markdown
    output_path: .agents/workflows/deliver-full.md

migration:
  phase: canonical_body_batch_2_session_a
  runtime_source_of_truth: commands/deliver-full/command.yaml
  notes:
    - Session A of T-003 moves /deliver-full onto the neutral command path.
    - .claude/commands/deliver-full.md remains the authored semantic body during the bridge.

references:
  - .azoth/roadmap-specs/v0.2.0/T-003.yaml
  - docs/CANONICAL_COMMAND_CONTRACT.md
