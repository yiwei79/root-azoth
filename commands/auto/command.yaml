schema_version: 1
name: auto
display_name: /auto
description: Auto-compose and execute a pipeline based on goal classification
agent: orchestrator
azoth_effect: write

execution:
  kind: pipeline
  waits_for_human_signal: declaration_approval
  emits:
    - fused_declaration
    - scope_gate
    - pipeline_gate
    - run_checkpoint

arguments:
  accepts_arguments: true
  syntax: /auto <goal>

state:
  reads:
    - .azoth/scope-gate.json
    - .azoth/pipeline-gate.json
    - .azoth/run-ledger.local.yaml
    - .azoth/backlog.yaml
  writes:
    - .azoth/scope-gate.json
    - .azoth/pipeline-gate.json
    - .azoth/run-ledger.local.yaml
  outputs:
    - pipeline_declaration
    - pipeline_progress

governance:
  preconditions:
    - require_approved_scope_or_fused_declaration
    - redirect_governed_scope_to_governed_execution_when_needed
    - governed_human_gates_must_advance_runtime_state
  approval_mode: fused_scope_and_pipeline_declaration
  pipeline_gate_behavior: open_or_update_matching_pipeline_gate
  target_layer_rule: m1_or_governance_scope_requires_governed_mode

runtime:
  governance_mode:
    command_default: standard
    scope_gate_field: governance_mode
    legacy_scope_gate_field: delivery_pipeline
  pipeline_command:
    command_value: auto
    scope_gate_field: pipeline_command
    pipeline_gate_field: pipeline_command
    legacy_pipeline_gate_field: pipeline
    run_ledger_field: pipeline_command
    legacy_run_ledger_field: mode
  approval_consumption:
    helper: scripts/run_ledger.py:consume_human_gate_approval
    durable: true
    same_run_required: true

body:
  mode: legacy_claude_markdown
  source_path: .claude/commands/auto.md

projection:
  claude:
    kind: native_command_markdown
    output_path: .claude/commands/auto.md
  cursor:
    kind: claude_command_toggle_surface
    output_path: .claude/commands/auto.md
  copilot:
    kind: prompt_markdown
    output_path: .github/prompts/auto.prompt.md
  opencode:
    kind: native_command_markdown
    output_path: .opencode/commands/auto.md
  codex:
    kind: skill_wrapper
    output_path: .agents/skills/azoth-auto/SKILL.md
    metadata_path: .agents/skills/azoth-auto/agents/openai.yaml
  gemini:
    kind: native_command_toml
    output_path: .gemini/commands/auto.toml
  antigravity:
    kind: workflow_markdown
    output_path: .agents/workflows/auto.md

migration:
  phase: canonical_body_batch_2_session_a
  runtime_source_of_truth: commands/auto/command.yaml
  notes:
    - Session A of T-003 moves /auto onto the neutral command path.
    - .claude/commands/auto.md remains the authored semantic body during the bridge.

references:
  - .azoth/roadmap-specs/v0.2.0/T-003.yaml
  - docs/CANONICAL_COMMAND_CONTRACT.md
